version: 1
updated: 2026-09-04
title: International Full Stack AI Engineer
audience: Developer with basic JavaScript and Python familiarity

strategy:
  core_duration_weeks: 24
  deep_extension_weeks: 24
  weekly_hours: 6-8
  lesson_style: Short concept lessons followed by retrieval practice and production-oriented implementation
  completion_rule: Pass the mastery check and produce the stated practical evidence
  progress_views:
    - Interview core completion
    - Deep curriculum completion
    - Portfolio project completion

core_sequence:
  - weeks: 1-2
    focus: Engineering workflow, software design and clean code, low-level design, machine coding, computer science baseline, and interview problem-solving habits
  - weeks: 3-5
    focus: JavaScript internals, TypeScript, and browser fundamentals
  - weeks: 6-8
    focus: React architecture, frontend quality, and Portfolio Project 1
  - weeks: 9-11
    focus: Node.js internals, backend APIs, security, and testing
  - weeks: 12-14
    focus: Python internals, async programming, FastAPI, and service design
  - weeks: 15-16
    focus: PostgreSQL, Redis, data modeling, and transaction behavior
  - weeks: 17-18
    focus: Distributed systems, system design, microservices, domain-driven design, event-driven systems, containers, and cloud fundamentals
  - weeks: 19-20
    focus: ML foundations, transformers, model APIs, and structured outputs
  - weeks: 21-22
    focus: Retrieval, RAG, agents, evaluations, safety, and Portfolio Project 2
  - weeks: 23-24
    focus: Production hardening, Portfolio Project 3, situational and behavioral practice, storytelling, influence, salary negotiation, and international job materials

tracks:
  - id: engineering-foundations
    title: Engineering Foundations and Workflow
    tier: core
    goal: Work effectively in a professional repository and explain the systems beneath everyday tools.
    topics:
      - title: Terminal, processes, files, permissions, environment variables, signals, and exit codes
        behind_the_scenes: Understand shells, process trees, standard streams, PATH lookup, and OS boundaries.
        practical: Build diagnostic shell workflows and troubleshoot a broken local service.
        interview: Explain what happens between entering a command and seeing its output.
      - title: Git object model and collaborative workflows
        behind_the_scenes: Learn blobs, trees, commits, refs, HEAD, merge bases, rebasing, and conflict mechanics.
        practical: Recover lost work, split commits, resolve conflicts, review a pull request, and bisect a regression.
        interview: Compare merge and rebase and diagnose common repository failures.
      - title: Dependency management and reproducible environments
        behind_the_scenes: Understand semantic versioning, lockfiles, registries, dependency graphs, and supply-chain risks.
        practical: Produce reproducible Node.js and Python environments and audit a dependency update.
        interview: Explain deterministic builds and direct versus transitive dependencies.
      - title: Debugging as hypothesis testing
        behind_the_scenes: Learn observation boundaries, stack traces, breakpoints, logging, profiling, and binary search.
        practical: Diagnose seeded frontend, backend, database, and AI-pipeline defects from evidence.
        interview: Narrate a disciplined debugging process without guessing.
      - title: Technical writing and architecture decisions
        behind_the_scenes: Understand how written context reduces coordination cost in distributed teams.
        practical: Write READMEs, runbooks, ADRs, incident notes, and concise pull-request descriptions.
        interview: Communicate assumptions, tradeoffs, risks, and decisions clearly in English.

  - id: software-design
    title: Software Design, Clean Code, and Patterns
    tier: core
    goal: Write code that is easy to understand and change, choose principles and patterns from evidence, and explain design tradeoffs without dogma.
    topics:
      - title: Clean code, naming, functions, control flow, comments, formatting, and local reasoning
        behind_the_scenes: Follow how a reader reconstructs intent from names, scope, explicit branches, data movement, side effects, invariants, comments that explain why, and consistent layout.
        practical: Refactor one confusing TypeScript function in behavior-preserving steps, then compare tests, complexity, mutation points, and the time another reader needs to explain it.
        interview: Review a small code sample and distinguish readability evidence from personal style preference.
      - title: DRY, knowledge duplication, accidental duplication, KISS, YAGNI, simplicity, and premature abstraction
        behind_the_scenes: Separate duplicated business knowledge that must change together from code that only looks similar, then compare the current cost of repetition with the future coupling created by an abstraction.
        practical: Refactor one real duplicated rule, deliberately leave two accidental similarities separate, delete an unused extension point, and record the change-cost evidence for each decision.
        interview: Explain why DRY does not mean removing every repeated line and how KISS and YAGNI constrain speculative design.
      - title: Cohesion, coupling, encapsulation, information hiding, dependency direction, boundaries, and change cost
        behind_the_scenes: Group behavior that changes for the same reason, hide volatile decisions behind stable boundaries, and direct dependencies toward policy so one requirement change touches fewer unrelated modules.
        practical: Draw a dependency graph for a coupled feature, move one volatile decision behind a narrow boundary, and measure imports, affected tests, and files changed before and after.
        interview: Use a concrete change request to explain cohesion, coupling, information hiding, and dependency direction.
      - title: Single Responsibility Principle, Open-Closed Principle, reasons to change, extension points, and plugin boundaries
        behind_the_scenes: Identify actors and independent change axes, then add variation behind a proven stable contract without turning every conditional into an interface or predicting requirements that do not exist.
        practical: Split mixed pricing and notification policy, add a second pricing rule through one tested extension seam, and compare the simpler conditional alternative.
        interview: Explain SRP and OCP with change scenarios, including when another abstraction would be overengineering.
      - title: Liskov Substitution Principle, Interface Segregation Principle, Dependency Inversion Principle, contracts, substitutability, and capability interfaces
        behind_the_scenes: Make implementations preserve caller-visible preconditions, postconditions, invariants, and failure behavior while consumers depend only on the capabilities they actually use and policy owns the abstraction.
        practical: Repair a subtype that strengthens a precondition, split a broad interface by consumer need, and inject a narrow clock or storage capability into domain policy.
        interview: Diagnose a SOLID violation from observable behavior rather than class shape or acronym recall.
      - title: Composition, inheritance, delegation, polymorphism, data-oriented design, and functional cores
        behind_the_scenes: Compare reuse through object hierarchy, assembled capabilities, delegated work, tagged data, and pure functions while tracking state ownership, runtime dispatch, invalid combinations, and test seams.
        practical: Implement one pricing feature with inheritance and with composition plus a functional core, then compare supported combinations, mutation, tests, and change cost.
        interview: Choose composition or inheritance from semantic substitutability and variation needs rather than a slogan.
      - title: Design pattern literacy, context, forces, intent, consequences, implementation variants, and anti-patterns
        behind_the_scenes: Treat a pattern as a named response to recurring forces, not copyable class scaffolding, and require its extra indirection to solve a present problem under stated constraints.
        practical: Write a pattern decision card for an existing feature, implement the smallest direct design first, and introduce the pattern only after a second requirement proves the variation.
        interview: Explain a pattern through problem, forces, structure, consequences, alternatives, and evidence instead of reciting participants.
      - title: Creational patterns, Factory Method, Abstract Factory, Builder, Prototype, Singleton, and dependency injection
        behind_the_scenes: Separate object use from construction when selection, compatible families, staged validation, copying, lifetime, or test substitution creates real pressure, while recognizing hidden global state and unnecessary factories.
        practical: Build a validated request builder and environment-selected adapter factory, inject dependencies explicitly, and write a test that exposes why a mutable singleton is unsafe.
        interview: Compare creational patterns and choose plain construction when it is sufficient.
      - title: Structural patterns, Adapter, Facade, Decorator, Composite, Proxy, Bridge, and Flyweight
        behind_the_scenes: Change interfaces, simplify subsystems, wrap behavior, represent part-whole trees, control access, separate two variation axes, or share immutable state while preserving identity and contract behavior.
        practical: Adapt a provider API to a domain port, decorate it with tracing, place it behind a small facade, and verify order, errors, cancellation, and types without changing the core service.
        interview: Distinguish structurally similar wrappers by intent, ownership, and observable behavior.
      - title: Behavioral patterns, Strategy, Observer, Command, State, Chain of Responsibility, Template Method, Iterator, Mediator, Memento, and Visitor
        behind_the_scenes: Move algorithms, notifications, requests, transitions, handler selection, traversal, coordination, snapshots, or operations into explicit structures while controlling order, reentrancy, failure, lifetime, and exhaustiveness.
        practical: Implement a typed state machine with commands and strategies, add an observer, then test invalid transitions, duplicate delivery, handler failure, and subscriber cleanup.
        interview: Select a behavioral pattern from the control-flow problem and explain its hidden operational costs.
      - title: Code smells, characterization tests, refactoring, seams, small steps, behavior preservation, and review evidence
        behind_the_scenes: Treat smells as investigation signals, capture current observable behavior, create a controllable seam, apply one named transformation, run tests after each step, and separate structural change from feature change.
        practical: Refactor a long conditional with duplicated calculations using extract function, introduce parameter object, and replace conditional with strategy while keeping every commit executable.
        interview: Describe a safe refactoring sequence for untested production code and the evidence that behavior stayed stable.
      - title: Architecture patterns, layered architecture, hexagonal architecture, clean architecture, vertical slices, repository, unit of work, and modular monoliths
        behind_the_scenes: Compare organization by technical layer, dependency-inverted ports, use-case policy, feature slice, persistence abstraction, transaction boundary, and deployable module while keeping domain and operational boundaries explicit.
        practical: Organize one order workflow as a modular monolith with a vertical application slice, pure domain policy, HTTP and database adapters, explicit transaction ownership, and dependency tests.
        interview: Choose an architecture from team, domain, change, deployment, consistency, and operational constraints without confusing folder names with boundaries.

  - id: computer-science
    title: Computer Science and Coding Interviews
    tier: core
    goal: Solve unfamiliar problems by selecting appropriate data structures and reasoning about constraints.
    topics:
      - title: Complexity analysis and cost models
        behind_the_scenes: Derive time and space complexity, amortized bounds, cache effects, and practical constants.
        practical: Benchmark competing implementations and explain where asymptotic analysis misleads.
        interview: State brute force, constraints, target complexity, and tradeoffs before coding.
      - title: Arrays, strings, hash tables, stacks, queues, and linked structures
        behind_the_scenes: Study memory layout, hashing, collisions, resizing, locality, and mutation costs.
        practical: Implement simplified structures and solve canonical pattern-based problems.
        interview: Recognize two-pointer, sliding-window, prefix-sum, monotonic-stack, and frequency-map patterns.
      - title: Trees, heaps, tries, graphs, and disjoint sets
        behind_the_scenes: Understand representations, traversal state, heap invariants, path compression, and branching costs.
        practical: Implement traversal, shortest-path, scheduling, search, and connectivity problems.
        interview: Choose BFS, DFS, topological sort, Dijkstra, union-find, or trie with justification.
      - title: Recursion, backtracking, greedy methods, and dynamic programming
        behind_the_scenes: Model call stacks, state spaces, overlapping subproblems, optimal substructure, and proof obligations.
        practical: Progress from brute-force recursion to memoized and tabulated solutions.
        interview: Derive a recurrence and communicate why a greedy choice is or is not safe.
      - title: Sorting, comparison bounds, stability, merge sort, quicksort, heapsort, counting sort, and selection
        behind_the_scenes: Trace comparisons, swaps, partitions, merges, heap maintenance, auxiliary memory, stable equal-key order, worst cases, and the lower bound that applies to comparison sorting.
        practical: Implement merge sort, randomized quicksort, and quickselect, test duplicates and adversarial inputs, then compare operation counts and memory on the same datasets.
        interview: Choose sorting or selection from data range, stability, mutation, memory, worst-case, and top-k requirements and explain the invariant.
      - title: Binary search, boundary invariants, lower bound, upper bound, monotonic predicates, rotated arrays, and answer search
        behind_the_scenes: Maintain a half-open candidate interval whose discarded side is proven impossible, then apply the same boundary reasoning to positions, rotations, and monotonic feasibility functions.
        practical: Implement lower and upper bound once, test empty and duplicate inputs, find a rotated minimum, and binary-search a minimum feasible capacity.
        interview: State the interval and invariant before code and eliminate off-by-one loops through proof rather than memorized templates.
      - title: Array and string patterns, two pointers, sliding windows, prefix sums, difference arrays, frequency maps, and intervals
        behind_the_scenes: Reuse maintained summaries while indices move so repeated range work becomes incremental, and distinguish fixed, variable, ordered, overlapping, and frequency-constrained problems.
        practical: Solve paired-sum, longest valid window, range-sum, range-update, anagram, and interval-merge problems with traced invariants and edge tables.
        interview: Recognize the constraint that justifies each pattern and explain when negative values or unsorted input invalidate a shortcut.
      - title: Linked-list patterns, sentinel nodes, fast and slow pointers, reversal, stacks, queues, deques, and monotonic structures
        behind_the_scenes: Change links without losing reachable nodes, use relative pointer speed to detect structure, and maintain end or monotonic invariants for amortized constant-time operations.
        practical: Reverse and merge lists, detect a cycle, implement a deque, and solve next-greater and sliding-maximum problems while checking empty and one-node states.
        interview: Draw pointer state before mutation and derive amortized cost for monotonic stack or deque operations.
      - title: Tree algorithms, depth-first traversal, breadth-first traversal, binary search trees, heaps, tries, lowest common ancestors, and serialization
        behind_the_scenes: Represent hierarchical state through recursive frames or explicit frontiers while preserving ordering, heap, prefix, ancestor, and round-trip encoding invariants.
        practical: Implement iterative traversals, validate a BST, maintain top-k with a heap, build a trie, find an LCA, and serialize and restore a tree.
        interview: Choose traversal state from the required output order, depth, memory, mutation, and repeated-query needs.
      - title: Graph algorithms, representations, BFS, DFS, topological sorting, shortest paths, minimum spanning trees, and union-find
        behind_the_scenes: Convert relationships into adjacency state, mark discovery consistently, relax weighted paths, order dependencies, connect components cheaply, and separate reachability from optimality.
        practical: Implement BFS, iterative DFS, Kahn topological sort, Dijkstra, Kruskal, and disjoint sets and test disconnected, cyclic, duplicate-edge, and negative-weight cases.
        interview: Select the graph algorithm from direction, weight, cycle, connectivity, path, and ordering requirements and state its complexity.
      - title: Backtracking, decision trees, permutations, combinations, subsets, constraint propagation, pruning, and branch and bound
        behind_the_scenes: Choose one candidate, update reversible state, reject impossible branches early, record complete solutions, and bound branches that cannot beat the best known result.
        practical: Generate deduplicated permutations and subsets, solve a constrained board, and measure nodes visited before and after ordering and pruning.
        interview: Define state, choices, validity, completion, undo, and worst-case search size before implementing recursion.
      - title: Dynamic programming, state, transitions, base cases, memoization, tabulation, reconstruction, and space optimization
        behind_the_scenes: Convert repeated subproblems into a directed acyclic dependency graph, define exactly what each state means, order evaluation after prerequisites, and retain information needed to reconstruct a solution.
        practical: Derive and implement one sequence and one grid problem recursively, memoized, tabulated, and space-optimized, then recover the chosen path.
        interview: Derive state and recurrence from the decision process instead of naming a memorized problem family.
      - title: Greedy algorithms, exchange arguments, stays-ahead proofs, intervals, scheduling, heaps, and counterexamples
        behind_the_scenes: Make an irreversible locally optimal choice only when a proof can transform an optimal solution to include that choice without making it worse.
        practical: Solve interval scheduling and resource allocation, write an exchange argument, then construct a counterexample for an invalid coin or path heuristic.
        interview: Justify a greedy choice with a proof and switch to dynamic programming when future choices depend on hidden state.
      - title: Bit manipulation, binary representation, masks, shifts, XOR, integer limits, subsets, and practical bitsets
        behind_the_scenes: Follow fixed-width bit patterns through signed representation, masking, shifting, toggling, counting, and subset enumeration while respecting language-specific numeric limits.
        practical: Implement flags, set-bit counting, unique-value XOR, subset masks, and a small bitset in JavaScript and Python with boundary tests.
        interview: Explain the bit invariant and language integer model rather than presenting an unexplained trick.
      - title: Arrays and hashing, frequency maps, sets, grouping, and lookup tradeoffs
        behind_the_scenes: Compare repeated scans, sorting, and hash-indexed lookup while tracing key creation, collisions, duplicates, insertion order, and expected versus worst-case cost.
        practical: Progress through a duplicate badge detector, a target-pair finder, and signature-based label grouping; compare brute-force, sorted, and hash-based work on the same inputs.
        interview: Recognize when extra memory buys simpler linear-time membership or grouping and state the hashability assumptions.
      - title: Two pointers, converging scans, same-direction scans, partitioning, and sorted invariants
        behind_the_scenes: Replace repeated pair checks with indices whose movement discards a proven-impossible region while preserving ordering or partition invariants.
        practical: Progress through normalized palindrome checking, a sorted target pair, and unique zero-sum triples; record left, right, decision, and discarded candidates at each step.
        interview: Explain exactly why pointer movement is safe and when unsorted data invalidates the proof.
      - title: Sliding windows, fixed windows, variable windows, frequency constraints, and monotonic deques
        behind_the_scenes: Maintain only the summary for one contiguous range, adding the entering value and removing or repairing from the left instead of recomputing every range.
        practical: Progress through maximum fixed-window load, longest distinct session, and minimum covering segment; compare enumerating ranges with incremental window state.
        interview: State the window invariant, shrink condition, and whether negative values or non-monotonic constraints break the method.
      - title: Stacks, monotonic stacks, matching, deferred resolution, and amortized analysis
        behind_the_scenes: Preserve unresolved work in last-in-first-out order and pop items exactly when a new value proves their answer, so each item enters and leaves at most once.
        practical: Progress through delimiter validation, next-warmer reading, and largest histogram block; trace stack contents beside every input position.
        interview: Derive the stack invariant and amortized linear cost rather than calling nested while loops quadratic.
      - title: Linked lists, sentinel nodes, reversal, fast and slow pointers, and pointer surgery
        behind_the_scenes: Rewire links without losing reachable nodes, use a sentinel to remove head special cases, and use relative pointer speed to reveal middle positions or cycles.
        practical: Progress through iterative reversal, sorted-list merge, and cycle detection; draw previous, current, next, slow, and fast references before every mutation.
        interview: State which nodes remain reachable after each assignment and compare list operations with contiguous arrays.
      - title: Heaps, priority queues, top-k selection, multiway merge, and streaming medians
        behind_the_scenes: Maintain a partial order in a complete tree so the current extreme is cheap without paying to sort every element or every update.
        practical: Progress through kth-largest readings, merging sorted sensor feeds, and a running median; compare full sorting with bounded and dual heaps.
        interview: Choose min-heap or max-heap from what must be discarded and explain O(log k) maintenance.
      - title: Binary search, boundary invariants, rotated order, monotonic predicates, and answer search
        behind_the_scenes: Maintain a candidate interval whose discarded side is proven impossible, then apply the same boundary reasoning to sorted positions, rotations, and feasible numeric answers.
        practical: Progress through lower bound, rotated lookup, and minimum processing capacity; trace lo, mid, hi, predicate, and the surviving interval.
        interview: State interval semantics before code and eliminate off-by-one loops through proof rather than a memorized template.
      - title: Depth-first search, recursive frames, iterative stacks, tree paths, and connected regions
        behind_the_scenes: Follow one branch to completion while each recursive frame or explicit stack retains the state needed to resume sibling work.
        practical: Progress through tree depth, constrained root-to-leaf paths, and counting grid regions; compare recursive and explicit-stack state.
        interview: Define visited timing, base cases, return meaning, and maximum call-stack depth.
      - title: Greedy algorithms, local choices, exchange arguments, stays-ahead proofs, and counterexamples
        behind_the_scenes: Make an irreversible local choice only when an exchange or stays-ahead proof connects it to a global optimum.
        practical: Progress through single-trade profit, minimum jumps, and maximum compatible bookings; pair each solution with a proof and a counterexample for a tempting invalid rule.
        interview: Justify the local choice and switch to dynamic programming when future value depends on hidden state.
      - title: Dynamic programming, state, recurrences, memoization, tabulation, and reconstruction
        behind_the_scenes: Turn repeated subproblems into an acyclic dependency graph, define what each state means, order prerequisites first, and retain choices when a solution path is required.
        practical: Progress through stair counts, minimum coin count, and longest common subsequence; compare recursion, memoization, tabulation, and space optimization.
        interview: Derive state and recurrence from decisions rather than naming a memorized problem family.
      - title: Graphs, adjacency structures, topological order, weighted shortest paths, and union-find
        behind_the_scenes: Represent relationships explicitly, discover each vertex consistently, order dependencies, relax weighted paths, and merge connectivity components cheaply.
        practical: Progress through dependency ordering, minimum delivery cost, and redundant-link detection; test disconnected, cyclic, duplicate-edge, and invalid negative-weight cases.
        interview: Select the algorithm from direction, weights, cycles, connectivity, and required output, then state V-and-E complexity.
      - title: Backtracking, decision trees, reversible state, pruning, combinations, and constraint search
        behind_the_scenes: Choose one candidate, mutate reversible state, reject impossible branches, record complete solutions, and undo before exploring the next branch.
        practical: Progress through subsets, bounded combination totals, and non-attacking board placement; count visited nodes before and after pruning.
        interview: Define state, choices, validity, completion, undo, and worst-case search size before coding.
      - title: Breadth-first search, queues, levels, shortest unweighted paths, and multi-source expansion
        behind_the_scenes: Expand a FIFO frontier one distance layer at a time so first discovery proves the shortest number of unweighted steps.
        practical: Progress through tree level sums, contamination spread time, and minimum word transformations; trace queue boundaries and discovery distance.
        interview: Explain why marking on enqueue prevents duplicates and when weighted edges require another algorithm.
      - title: Tries, prefix trees, shared prefixes, autocomplete, and wildcard search
        behind_the_scenes: Store one character per edge so common prefixes share traversal state and prefix queries cost input length plus returned output.
        practical: Progress through insert-and-find, prefix suggestions, and single-character wildcard matching; compare scanning every word with walking the prefix tree.
        interview: Explain node shape, terminal markers, memory cost, and when a sorted array or hash map is simpler.
      - title: Prefix sums, running aggregates, range queries, subarray counts, and difference arrays
        behind_the_scenes: Precompute cumulative state so a range becomes two boundary values, or store boundary deltas so many range updates collapse into one final scan.
        practical: Progress through immutable range totals, target-sum subarray counting, and batch capacity updates; trace prefix values and frequency counts.
        interview: Derive the boundary formula and explain why a frequency map is required when prefix values repeat.
      - title: Matrices, coordinate transforms, boundary walks, in-place rotation, and marker encoding
        behind_the_scenes: Treat rows and columns as explicit coordinate state, shrink traversal boundaries, and reuse safe cells as markers when auxiliary memory must remain constant.
        practical: Progress through spiral reading, square rotation, and row-column zero propagation; trace top, right, bottom, left, row, and column state.
        interview: State dimension assumptions, visit each cell once, and prove an in-place transform does not overwrite unread data.
      - title: Intervals, sorting, merging, insertion, sweep events, and overlap counting
        behind_the_scenes: Sort interval boundaries so local comparisons summarize all earlier ranges, then sweep starts and ends to measure simultaneous occupancy.
        practical: Progress through merging bookings, inserting one booking, and finding minimum rooms; compare pairwise overlap checks with sort-and-sweep processing.
        interview: Define endpoint semantics first and explain how closed versus half-open ranges change overlap.
      - title: Bit manipulation, masks, shifts, XOR, set-bit iteration, and subset encoding
        behind_the_scenes: Follow fixed-width bit patterns through masking, shifting, toggling, cancellation, and subset enumeration while respecting language numeric limits.
        practical: Progress through one unpaired identifier, population count, and subset-mask generation; show each binary transition and compare bit work with collection-based alternatives.
        interview: Explain the invariant and integer-width model rather than presenting an unexplained trick.
      - title: Interview execution and verification
        behind_the_scenes: Separate problem comprehension, invariant design, implementation, and testing.
        practical: Complete timed sessions in JavaScript and Python with edge-case tables and post-solution review.
        interview: Think aloud, ask useful questions, test deliberately, and improve a working solution.

  - id: web-platform
    title: Web Platform and Browser Internals
    tier: core
    goal: Explain and debug the path from a URL to pixels, interaction, and network activity.
    topics:
      - title: URLs, DNS, TCP, TLS, HTTP, proxies, and CDNs
        behind_the_scenes: Trace name resolution, connections, encryption, requests, caching, and content delivery.
        practical: Inspect network waterfalls, headers, certificates, cache behavior, and connection reuse.
        interview: Explain what happens after entering a URL in a browser.
      - title: HTML semantics, parsing, DOM construction, and accessibility trees
        behind_the_scenes: Learn tokenization, tree construction, error recovery, semantics, and assistive-technology exposure.
        practical: Build and audit an accessible form, navigation structure, and content hierarchy.
        interview: Defend semantic elements and accessible interaction choices.
      - title: CSS cascade, layout, stacking, painting, and compositing
        behind_the_scenes: Understand specificity, formatting contexts, intrinsic sizing, layers, and GPU compositing.
        practical: Reproduce complex responsive layouts and diagnose overflow, stacking, and repaint problems.
        interview: Explain layout and rendering performance rather than memorizing properties.
      - title: Browser event loop, tasks, microtasks, rendering, and input
        behind_the_scenes: Connect JavaScript scheduling to style, layout, paint, frames, and responsiveness.
        practical: Diagnose long tasks, layout thrashing, race conditions, and animation jank.
        interview: Predict execution order and explain why an interface becomes unresponsive.
      - title: Browser security and storage
        behind_the_scenes: Study origins, CORS, CSP, cookies, storage, sessions, XSS, CSRF, and sandboxing.
        practical: Harden a frontend/backend boundary and inspect browser security controls.
        interview: Distinguish authentication state, origin policy, and common attack paths.

  - id: systems-foundations
    title: Networking and Operating Systems Foundations
    tier: core
    goal: Trace production software from application calls through protocols, kernel mechanisms, hardware-facing resources, and observable failure evidence.
    topics:
      - title: Request to wire, sockets, encapsulation, frames, packets, segments, and application messages
        behind_the_scenes: Follow one application request through name resolution, socket creation, transport segmentation, IP routing, link framing, transmission, decapsulation, and the receiving process.
        practical: Build an executable encapsulation trace, label the owner of every header, and diagnose where loss, delay, corruption, or rejection becomes visible.
        interview: Explain what crosses each boundary after an application sends a request without treating a network chunk as an application message.
      - title: IPv4, IPv6, CIDR, subnet masks, MAC addresses, ARP, and neighbor discovery
        behind_the_scenes: Separate stable network-layer addressing from link-local delivery, calculate network and host ranges, and resolve a next-hop IP address to a local interface address.
        practical: Calculate subnets with the standard library, build a bounded neighbor cache, and trace same-subnet versus gateway delivery.
        interview: Explain why IP and MAC addresses both exist, how CIDR controls routing, and where ARP or IPv6 neighbor discovery applies.
      - title: Routing tables, longest-prefix match, default gateways, ICMP, traceroute, and NAT
        behind_the_scenes: Select the most specific route, decrement hop limits, report network errors, translate endpoint tuples at boundaries, and reverse the translation for returning traffic.
        practical: Implement longest-prefix route selection and a small NAT table, then interpret ping and traceroute evidence for broken local, routed, and translated paths.
        interview: Trace a packet across routers and explain which addresses change, which remain end-to-end, and what ICMP reveals.
      - title: UDP, TCP, ports, sockets, handshakes, sequence numbers, acknowledgements, MTU, and MSS
        behind_the_scenes: Compare datagram and byte-stream contracts, demultiplex by endpoint tuples, establish TCP state, order bytes, retransmit loss, close directions independently, and fit segments to path limits.
        practical: Encode and decode a bounded UDP datagram, simulate a TCP handshake and acknowledgement trace, and test framing across arbitrary receive chunks.
        interview: Choose UDP or TCP from application requirements and distinguish packets, segments, byte streams, connections, and messages.
      - title: TCP flow control, congestion control, slow start, AIMD, retransmission, backpressure, and overload
        behind_the_scenes: Keep a sender within receiver capacity and estimated network capacity while acknowledgements grow windows, loss reduces them, retransmission repairs gaps, and applications propagate pressure.
        practical: Simulate congestion-window growth and loss, compare it with a receive window, and connect socket buffering to application-level bounded queues.
        interview: Separate flow control, congestion control, retransmission, backpressure, and admission control.
      - title: DNS resolution, TLS handshakes, certificates, HTTP semantics, HTTP versions, and connection reuse
        behind_the_scenes: Resolve a name through caches and authoritative data, authenticate and encrypt a transport, exchange HTTP representations, and compare HTTP/1.1, HTTP/2, and HTTP/3 connection behavior.
        practical: Build a dependency-ordered request trace, inspect DNS and certificate data with system tools, and compare connection setup, multiplexing, caching, and failure evidence.
        interview: Explain the complete path after entering an HTTPS URL and identify which layer owns identity, reliability, encryption, and resource semantics.
      - title: System calls, user mode, kernel mode, file descriptors, process creation, exec, signals, and exit
        behind_the_scenes: Cross the user-kernel boundary through library wrappers and system calls, represent open resources with descriptors, create and replace processes, deliver signals, and retain exit status for a parent.
        practical: Trace pipe descriptors through process creation and cleanup, observe signals and exit codes, and prove every descriptor has one owner and close path.
        interview: Explain what a system call changes and distinguish a process, program, executable, thread, descriptor, and kernel object.
      - title: Processes, threads, process control blocks, context switches, CPU scheduling, and IPC
        behind_the_scenes: Preserve execution context in kernel task state, schedule runnable threads on finite CPUs, switch register and memory context, and exchange data through explicit interprocess channels.
        practical: Simulate round-robin scheduling, measure process and thread behavior, and compare pipes, shared memory, sockets, and message queues by ownership and failure.
        interview: Explain why concurrency is not parallelism and account for scheduling, context-switch, isolation, and communication costs.
      - title: Race conditions, locks, semaphores, condition variables, atomics, deadlocks, and lock ordering
        behind_the_scenes: Make conflicting operations atomic, wait for state predicates correctly, bound access to finite capacity, and prevent circular wait through a global acquisition order.
        practical: Reproduce a lost update, repair it with the narrowest synchronization, and verify a two-resource transfer cannot deadlock under ordered locking.
        interview: State the invariant protected by synchronization and distinguish mutual exclusion, coordination, atomicity, starvation, and deadlock.
      - title: Address spaces, segmentation, paging, page tables, the MMU, virtual memory, demand paging, and replacement
        behind_the_scenes: Translate virtual pages to physical frames, enforce permissions, load absent pages on demand, evict under pressure, and separate process views of memory.
        practical: Implement page translation and LRU replacement simulations, then connect page faults and resident memory to a real process observation.
        interview: Explain why virtual memory is not merely swap and trace one load instruction through translation, fault, allocation, and retry.
      - title: I/O, disks, SSDs, files, directories, VFS, buffering, caching, journaling, and durability
        behind_the_scenes: Move requests through descriptors and the virtual filesystem to caches, device queues, persistent media, metadata, and crash-recovery records while distinguishing visibility from durability.
        practical: Perform an atomic file replacement with flush and directory synchronization, inspect metadata, and compare sequential, random, buffered, and durable I/O costs.
        interview: Explain why a successful write call may not mean durable data and trace pathname lookup, caching, writeback, and recovery.
      - title: Namespaces, cgroups, containers, virtualization, resource limits, observability, and systems debugging capstone
        behind_the_scenes: Compose kernel namespaces for views, cgroups for accounting and limits, filesystems and capabilities for authority, and telemetry for diagnosing the same process under real constraints.
        practical: Trace a containerized service from process and socket through namespaces, cgroups, storage, and network paths; reproduce CPU, memory, file, and connection pressure and record recovery evidence.
        interview: Explain what containers do and do not isolate and debug a slow or terminated service from application symptoms down to kernel evidence.

  - id: lld-machine-coding
    title: Low-Level Design and Machine Coding
    tier: core
    goal: Turn ambiguous interview requirements into small, executable object models whose behavior, extensions, failures, and tradeoffs are easy to demonstrate.
    topics:
      - title: Requirement discovery, use cases, constraints, actors, invariants, and scope control
        behind_the_scenes: Convert an ambiguous prompt into observable behaviors, identify authoritative state and forbidden transitions, and choose a smallest useful scope before naming classes.
        practical: Build a requirement ledger for a parking system, reject speculative features, and encode its capacity and identity invariants as executable assertions.
        interview: Ask high-value clarifying questions, state assumptions, and define the first demonstrable slice before drawing a class diagram.
      - title: Domain modeling, entities, value objects, identity, equality, immutability, and validation
        behind_the_scenes: Separate objects that persist through change from immutable descriptive values, keep invalid state out at construction boundaries, and make equality match domain meaning.
        practical: Model money, vehicle identifiers, tickets, and accounts with dataclasses and validate both accepted and rejected construction paths.
        interview: Explain why a class exists, who owns its identity, and which rules belong inside versus outside it.
      - title: Object relationships, composition, aggregation, association, ownership, lifecycle, and UML class diagrams
        behind_the_scenes: Map domain relationships to references and collections while making creation, sharing, deletion, cardinality, and dependency direction explicit.
        practical: Translate a compact UML-style parking model into code and prove that spot, floor, ticket, and vehicle lifecycles have one clear owner.
        interview: Distinguish inheritance from composition and explain cardinality and lifecycle without treating UML as generated code.
      - title: Interfaces, abstract base classes, protocols, dependency injection, and substitutable adapters
        behind_the_scenes: Let policy depend on the smallest capability it needs, preserve caller-visible contracts across implementations, and inject time, storage, notification, or payment boundaries.
        practical: Define a structural payment protocol, provide real and fake adapters, and swap them without changing checkout policy.
        interview: Defend each interface with a present substitution or test need and avoid one-interface-per-class ceremony.
      - title: Strategy, Factory, Adapter, Decorator, Observer, and pattern selection by changing requirement
        behind_the_scenes: Introduce a pattern only where a second concrete variation creates pressure in construction, algorithms, interfaces, wrapping, or notification flow.
        practical: Start with direct pricing code, add one pricing strategy and payment adapter, decorate audit evidence, and compare the resulting change surface.
        interview: Select a pattern from forces and consequences, then name the simpler design that remains valid at smaller scope.
      - title: State machines, commands, transitions, workflows, and invalid-state prevention
        behind_the_scenes: Represent legal states and transitions explicitly, validate commands against current state, make repeated commands safe where required, and record why a transition occurred.
        practical: Implement an elevator or order state machine with an explicit transition table and tests for normal, repeated, and forbidden commands.
        interview: Trace one workflow through state changes and explain how the design prevents impossible transitions.
      - title: Concurrency, atomic operations, locks, idempotency, contention, and thread-safe design
        behind_the_scenes: Identify shared mutable state, define atomic boundaries, protect invariants with narrow locking, and make retried commands avoid duplicate effects.
        practical: Reproduce double booking under concurrent reservation attempts, repair it with one lock boundary, and verify exactly one winner.
        interview: State the race as an interleaving, name the protected invariant, and discuss contention and distributed limitations.
      - title: Repositories, transactions, persistence boundaries, domain events, errors, and recovery
        behind_the_scenes: Keep domain policy separate from storage details, commit related changes atomically, publish facts after authoritative state changes, and retain enough evidence to retry or repair failures.
        practical: Implement an in-memory repository and transaction-shaped booking service that rolls back failed work and emits one event after commit.
        interview: Explain transaction ownership, repository value, error mapping, and what changes when storage becomes remote.
      - title: Testable design, unit tests, contract tests, fakes, edge cases, and executable acceptance criteria
        behind_the_scenes: Test public behavior and invariants through stable seams, use fakes that preserve relevant contracts, and cover boundaries without asserting private implementation structure.
        practical: Turn a prompt into an acceptance table, run it against two adapters, and include empty, duplicate, capacity, and failure cases.
        interview: Demonstrate correctness continuously and explain why the chosen tests permit safe refactoring.
      - title: Parking lot machine-coding case study, allocation, tickets, pricing, and extension seams
        behind_the_scenes: Coordinate spot inventory, vehicle compatibility, ticket identity, deterministic allocation, fee policy, release, and duplicate command handling without speculative services.
        practical: Build a runnable parking-lot core, demonstrate park and leave flows, add one vehicle category, and inspect invariant and extension tests.
        interview: Evolve the design from one floor to multiple floors and from one fee rule to several without rewriting stable policy.
      - title: Splitwise expense-sharing case study, exact arithmetic, balances, settlement, and simplification
        behind_the_scenes: Validate participants and shares, represent money exactly, post balanced ledger entries, derive net positions, and separate debt simplification from source-of-truth history.
        practical: Implement equal and exact expense splits with Decimal, reject unbalanced input, and settle balances while preserving a zero-sum invariant.
        interview: Explain the data model, rounding policy, concurrency boundary, and why simplified debts are a projection rather than the ledger.
      - title: Timed machine-coding capstone, LRU cache, rate limiter, demo strategy, and review rubric
        behind_the_scenes: Prioritize a vertical slice under time pressure, combine a hash map with recency ordering, add a clock-controlled rate rule, and reserve time for tests, explanation, and one extension.
        practical: Implement and demonstrate a bounded LRU cache plus per-client limiter using only the standard library, then self-review correctness, clarity, extensibility, and tradeoffs.
        interview: Narrate requirements, model, invariants, complexity, failure cases, tests, and deliberate omissions while continuously keeping the program executable.

  - id: javascript
    title: JavaScript Complete Deep Dive
    tier: core
    goal: Reason precisely about JavaScript semantics instead of depending on trial and error.
    topics:
      - title: JavaScript setup, strict mode, runtimes, consoles, and reproducible experiments
        behind_the_scenes: Separate ECMAScript language rules from browser and Node host APIs, enable strict semantics, and capture runtime versions and assertions.
        practical: Build a zero-dependency experiment harness that records values, types, descriptors, timing, and failures in both a browser and Node.
        interview: Distinguish the JavaScript language, an engine, and a host runtime before explaining any observed behavior.
      - title: ECMAScript specification, syntax grammar, abstract operations, and completion records
        behind_the_scenes: Learn how grammar productions, algorithms, internal slots, specification types, and normal or abrupt completions describe semantics without prescribing one engine.
        practical: Trace a short expression through the living specification and translate the relevant abstract steps into plain language.
        interview: Use specification terminology accurately without claiming that specification devices are literal runtime objects.
      - title: Primitive values, objects, typeof, null, undefined, and identity
        behind_the_scenes: Distinguish the seven primitive types from objects, value copying from reference sharing, and typeof's historical observable behavior.
        practical: Construct an identity table using typeof, Object.is, strict equality, mutation, and cross-realm values.
        interview: Explain primitives versus objects without the misleading phrase pass by reference.
      - title: Numbers, IEEE-754, NaN, signed zero, BigInt, and numeric precision
        behind_the_scenes: Trace binary floating-point representation, rounding, safe integers, NaN propagation, signed zero, and BigInt's separate arithmetic domain.
        practical: Implement safe currency and counter boundaries and demonstrate when Number, BigInt, or a decimal representation is appropriate.
        interview: Explain 0.1 plus 0.2, NaN, safe integer limits, and why Number and BigInt do not mix implicitly.
      - title: Strings, Unicode, code units, code points, graphemes, and normalization
        behind_the_scenes: Understand UTF-16 storage, surrogate pairs, iteration by code point, user-perceived grapheme clusters, and canonical normalization.
        practical: Build Unicode-safe length, truncation, comparison, and normalization experiments with emoji and accented text.
        interview: Explain why string length and indexing do not necessarily correspond to visible characters.
      - title: Type coercion, ToPrimitive, valueOf, toString, truthiness, and operators
        behind_the_scenes: Trace the abstract conversion operations selected by addition, relational operators, property keys, conditionals, and wrapper objects.
        practical: Predict coercion before execution, then replace ambiguous boundaries with explicit parsing and validation.
        interview: Derive coercion results from ToPrimitive and conversion rules rather than memorizing puzzle outputs.
      - title: Equality, strict equality, Object.is, SameValueZero, and relational comparison
        behind_the_scenes: Compare the language's equality algorithms and identify where arrays, sets, maps, includes, indexOf, and sorting use different sameness rules.
        practical: Build a comparison matrix for NaN, signed zero, objects, strings, and mixed numeric values.
        interview: Select the correct equality model for domain logic and explain its edge cases.
      - title: Declarations, lexical environments, environment records, scope, and name resolution
        behind_the_scenes: Trace declarative, object, global, function, and module environment records linked by outer references during identifier resolution.
        practical: Draw scope chains for nested blocks and functions and inspect shadowing, accidental globals, and global object bindings.
        interview: Explain lexical scope through environment records rather than saying JavaScript searches the call stack.
      - title: Execution contexts, call stack, realms, scripts, and functions
        behind_the_scenes: Follow running execution contexts, Realm records, ScriptOrModule state, function calls, returns, and stack unwinding.
        practical: Instrument nested calls and exceptions, then compare the specification model with a debugger stack trace.
        interview: Distinguish execution contexts, lexical environments, realms, and implementation stack frames.
      - title: Hoisting, var, let, const, temporal dead zone, and global bindings
        behind_the_scenes: Compare declaration instantiation, var and lexical environment placement, initialization timing, redeclaration rules, and top-level host behavior.
        practical: Predict reads and writes before declarations across scripts, modules, functions, and blocks.
        interview: Replace the vague claim declarations move upward with the actual binding-creation and initialization sequence.
      - title: Closures, captured bindings, factories, privacy, stale state, and retention
        behind_the_scenes: See how function objects retain references to outer lexical environments and how closures observe mutable bindings rather than frozen value copies.
        practical: Implement a private counter, fix a loop capture bug, diagnose stale asynchronous state, and release a retained object graph.
        interview: Define a closure, trace one captured binding, and discuss both useful encapsulation and memory cost.
      - title: Functions, declarations, expressions, arrows, parameters, arguments, and arity
        behind_the_scenes: Compare function object creation, lexical this in arrows, parameter environment initialization, defaults, rest parameters, arguments mapping, and length metadata.
        practical: Design a callback API that preserves parameter contracts and test default, rest, destructured, and missing arguments.
        interview: Compare arrow and ordinary functions beyond shorter syntax.
      - title: this binding, call, apply, bind, method calls, constructors, and new.target
        behind_the_scenes: Derive this from the call form, strictness, bound function slots, constructor allocation, prototype linkage, explicit object returns, and new.target.
        practical: Predict this for detached methods, callbacks, bound functions, arrows, and constructor calls, then repair an unsafe API.
        interview: Apply the binding precedence rules and explain why this is not lexical in ordinary functions.
      - title: Objects, property keys, own properties, descriptors, enumerability, and ownership
        behind_the_scenes: Trace ToPropertyKey, data versus accessor descriptors, writable/configurable flags, own-property tables, and enumeration ordering.
        practical: Define a validated accessor, inspect descriptors, and compare Object.keys, for-in, ownKeys, and hasOwn.
        interview: Explain why assignment, lookup, enumeration, and ownership are separate operations.
      - title: Prototypes, delegation, property lookup, Object.create, and prototype mutation
        behind_the_scenes: Follow ordinary property lookup through an object's internal prototype chain and distinguish constructor prototype properties from an object's prototype.
        practical: Build a delegation chain without class syntax, shadow a property, and observe the cost and security risk of prototype mutation.
        interview: Draw the prototype chain for an instance and explain shadowing and inherited methods.
      - title: Classes, fields, private elements, static initialization, inheritance, and super
        behind_the_scenes: Unpack class declaration semantics, strict method bodies, instance and static field initialization, private-name branding, derived construction, and super lookup.
        practical: Implement a class invariant with private state and compare inheritance with injected composition.
        interview: Explain which parts of classes are prototype-based and which semantics are genuinely class-specific.
      - title: Composition, immutability, shallow copies, deep copies, freezing, and structural sharing
        behind_the_scenes: Distinguish rebinding from mutation, shallow container copying from nested aliasing, structured cloning from arbitrary graphs, and persistent update strategies.
        practical: Repair an accidental mutation bug and implement a structural-sharing update with identity assertions.
        interview: Explain why const and Object.freeze do not make a complete object graph immutable.
      - title: Arrays, holes, length, mutation, copying methods, sorting, and element kinds
        behind_the_scenes: Explore integer-indexed properties, automatic length changes, holes versus undefined, iteration behavior, stable sorting, and engine element representations.
        practical: Compare mutating and copying array methods, sparse and dense behavior, and numeric versus default sorting.
        interview: Diagnose common array surprises and state their performance implications without overgeneralizing engine details.
      - title: Map, Set, WeakMap, WeakSet, keys, identity, and collection selection
        behind_the_scenes: Compare insertion ordering, SameValueZero key equality, object property coercion, weak reachability, and non-enumerable weak collections.
        practical: Choose and benchmark appropriate collections for indexing, deduplication, metadata, and lifecycle-sensitive caches.
        interview: Compare Object, Map, Set, and weak collections by key model, ownership, iteration, and lifetime.
      - title: Iteration protocols, iterable, iterator, Iterator helpers, and custom traversal
        behind_the_scenes: Trace Symbol.iterator, iterator result objects, abrupt completion, IteratorClose, and lazy helper pipelines.
        practical: Implement a reusable range iterable and compose a lazy filtered and mapped traversal that closes early.
        interview: Distinguish iterable from iterator and explain how for-of performs cleanup.
      - title: Generators, yield, yield star, next, throw, return, and suspended execution
        behind_the_scenes: Follow generator execution contexts across suspendedStart, suspendedYield, executing, and completed states with bidirectional values.
        practical: Build a cancellable paginated traversal and use next, throw, return, and yield star deliberately.
        interview: Explain why calling a generator function does not execute its body and how values travel in both directions.
      - title: Symbols, well-known symbols, protocols, and customization hooks
        behind_the_scenes: Understand unique symbol identity, global symbol registration, symbol-keyed properties, and hooks such as iterator, toPrimitive, species, and toStringTag.
        practical: Add iteration and safe primitive conversion to a domain object without name collisions.
        interview: Explain what Symbols solve and why they are not private fields.
      - title: Proxy, Reflect, traps, invariants, revocation, and metaprogramming
        behind_the_scenes: Trace internal object methods through proxy traps, mandatory invariants, receiver forwarding, Reflect defaults, and revocable authority.
        practical: Build a logging membrane that preserves method receivers and demonstrate an invariant violation.
        interview: Explain why a Proxy cannot arbitrarily lie about non-configurable state.
      - title: Errors, throw, try, catch, finally, cause, AggregateError, and custom errors
        behind_the_scenes: Follow abrupt completion and stack unwinding, finally replacement behavior, error causes, cross-layer translation, and multiple failure representation.
        practical: Design a stable error taxonomy that preserves causes, performs cleanup, and serializes safe public failures.
        interview: Explain when to catch, translate, recover, aggregate, or rethrow an error.
      - title: ECMAScript modules, live bindings, linking, evaluation, cycles, and top-level await
        behind_the_scenes: Trace module records through resolution, linking, environment initialization, dependency ordering, live bindings, cyclic graphs, and asynchronous evaluation.
        practical: Build a small cyclic module graph, observe a temporal-dead-zone failure, and refactor the dependency direction.
        interview: Compare ESM imports with copied object values and explain cycle and top-level-await risks.
      - title: Dynamic import, import attributes, module boundaries, code splitting, and tree shaking
        behind_the_scenes: Separate language-level dynamic loading and import metadata from host resolution, bundler graph analysis, chunk generation, and dead-code elimination.
        practical: Lazy-load a feature with failure handling and inspect the resulting network and bundle graph.
        interview: Explain which module behaviors come from ECMAScript and which come from browsers, Node, or build tools.
      - title: Promises, states, fate, resolving functions, thenables, reactions, and chaining
        behind_the_scenes: Trace promise capability creation, thenable assimilation, fulfillment versus resolution, reaction jobs, returned-value adoption, and rejection propagation.
        practical: Implement a promise chain with a hostile thenable and prove exactly which value or failure each stage receives.
        interview: Distinguish resolved from fulfilled and explain why promise callbacks never run synchronously.
      - title: Async functions, await, suspension, resumption, errors, and sequential execution
        behind_the_scenes: Understand how async calls create promises and how await converts operands, suspends evaluation, and schedules resumption as a promise job.
        practical: Refactor accidental sequential waits into intentional concurrency while preserving error context and cleanup.
        interview: Explain async and await without claiming they create threads or make CPU work non-blocking.
      - title: Event loop, tasks, microtasks, rendering, browser hosts, and Node hosts
        behind_the_scenes: Separate ECMAScript Jobs from host event loops and compare browser task checkpoints, rendering opportunities, and Node phase-specific scheduling.
        practical: Predict and record ordering among script code, queueMicrotask, promises, timers, MessageChannel, and Node scheduling APIs.
        interview: State which ordering rules are language-level and which are host-specific.
      - title: Promise combinators, bounded concurrency, backpressure, retries, and partial failure
        behind_the_scenes: Compare all, allSettled, any, and race settlement; then add admission limits, idempotency, deadlines, jitter, and failure accounting.
        practical: Implement a bounded worker pool that preserves result order and reports partial failures without unbounded memory.
        interview: Choose a concurrency and failure policy for a real batch instead of reflexively using Promise.all.
      - title: AbortController, AbortSignal, cancellation, deadlines, timeouts, and cleanup
        behind_the_scenes: Treat abort as cooperative one-way notification, compose signals, distinguish timeout rejection from underlying cancellation, and release listeners and resources.
        practical: Build a cancellable fetch workflow with one deadline, child operations, cleanup, and a distinguishable abort result.
        interview: Explain why Promise.race with a timer does not itself stop the losing operation.
      - title: Explicit resource management, using, await using, Symbol.dispose, and DisposableStack
        behind_the_scenes: Trace disposable-resource stacks, lexical lifetime, reverse-order cleanup, async disposal, and SuppressedError when work and cleanup both fail.
        practical: Implement disposable file-like and subscription resources and verify cleanup across normal return and exceptions.
        interview: Compare deterministic disposal with garbage collection and finally blocks.
      - title: JSON, structured clone, serialization, transfer, identity, and schema evolution
        behind_the_scenes: Compare JSON's limited data model with the structured clone algorithm, transferable ownership, graph identity, unsupported values, and versioned contracts.
        practical: Round-trip a mixed object graph through JSON and structuredClone and record every changed or rejected value.
        interview: Explain why serialization is a trust and compatibility boundary rather than a transparent copy.
      - title: Date, time zones, Intl, formatting, collation, and temporal modeling
        behind_the_scenes: Distinguish instants from calendar representations, UTC from local rules, locale-sensitive formatting from storage, and host time-zone data.
        practical: Parse, store, compare, and render one event across DST and locale boundaries without ambiguous date strings.
        interview: Explain why time-zone conversion and locale formatting belong at explicit boundaries.
      - title: Regular expressions, Unicode modes, groups, lookarounds, backtracking, and ReDoS
        behind_the_scenes: Follow pattern compilation and backtracking choices, Unicode-aware matching, capture state, lastIndex, and catastrophic ambiguity.
        practical: Build and test a bounded validation regex, then expose and repair a catastrophic-backtracking case.
        interview: Explain when a parser is safer than a regular expression and how to recognize ReDoS risk.
      - title: ArrayBuffer, TypedArray, DataView, binary data, endianness, and detachment
        behind_the_scenes: Separate raw byte storage from typed views, offsets and lengths, platform-independent DataView access, buffer transfer, and detached state.
        practical: Encode and decode a versioned binary message with explicit endianness and bounds checks.
        interview: Explain the relationship among ArrayBuffer, TypedArray, DataView, Buffer, and WebAssembly memory.
      - title: SharedArrayBuffer, Atomics, agents, workers, memory ordering, and synchronization
        behind_the_scenes: Study agent clusters, shared data blocks, sequentially consistent atomic operations, wait and notify, data races, and host isolation requirements.
        practical: Coordinate two workers with an atomic state machine and compare it with message passing.
        interview: Explain why shared memory requires an explicit protocol even though JavaScript execution is often described as single-threaded.
      - title: Reachability, garbage collection, weak references, FinalizationRegistry, leaks, and cleanup
        behind_the_scenes: Separate language reachability guarantees from implementation collectors, understand weak observation, nondeterministic finalization, and accidental retaining paths.
        practical: Reproduce listener, timer, closure, and cache leaks; capture heap snapshots; then remove the retaining edges.
        interview: Explain why garbage collection cannot replace deterministic resource cleanup.
      - title: Engine pipeline, parsing, AST, bytecode, interpreter, JIT, and deoptimization
        behind_the_scenes: Use V8 as a concrete implementation to trace source through parsing, Ignition bytecode, feedback, optimizing compilation, guards, and fallback.
        practical: Inspect generated bytecode and optimization traces for a focused function while separating portable semantics from V8 details.
        interview: Explain tiered execution without assuming every engine uses V8's exact pipeline.
      - title: Hidden classes, shapes, inline caches, elements kinds, optimization, and performance
        behind_the_scenes: See how V8 records object shapes and access feedback, specializes operations, transitions array representations, and invalidates optimistic assumptions.
        practical: Profile stable and unstable object shapes with representative data and verify whether any difference matters end to end.
        interview: Discuss engine-friendly consistency while rejecting cargo-cult micro-optimizations.
      - title: Measurement, complexity, benchmarking, warmup, variance, and event-loop responsiveness
        behind_the_scenes: Separate algorithmic cost, wall time, CPU time, allocation, JIT warmup, garbage collection, system noise, long tasks, and user-perceived latency.
        practical: Design a repeatable benchmark with warmup, multiple samples, percentile reporting, and a responsiveness guardrail.
        interview: Challenge misleading microbenchmarks and propose production-representative evidence.
      - title: JavaScript security, prototype pollution, injection, eval, supply chain, and trust boundaries
        behind_the_scenes: Trace how untrusted keys, strings, URLs, modules, and serialized values cross interpreters or mutate shared prototypes and authority.
        practical: Harden a merge function, remove dynamic code execution, validate URLs and schemas, and document dependency provenance.
        interview: Threat-model JavaScript language features separately from browser, Node, framework, and deployment controls.
      - title: Testing, assertions, table tests, property tests, async tests, fakes, and timers
        behind_the_scenes: Understand observable contracts, deterministic isolation, generated input shrinking, promise settlement, fake-clock queues, and the risks of mocking internals.
        practical: Test coercion, async cancellation, and a stateful module using tables, properties, controlled dependencies, and real failure paths.
        interview: Choose test boundaries and explain what evidence each layer can and cannot provide.
      - title: Debugging, breakpoints, stack traces, source maps, heap snapshots, CPU profiles, and tracing
        behind_the_scenes: Connect transformed source to generated code, synchronous and asynchronous call history, retaining paths, sampled stacks, and performance timelines.
        practical: Diagnose one wrong value, one rejected promise, one leak, and one CPU hot path with browser or Node debugging evidence.
        interview: Present debugging as hypothesis, instrumentation, observation, and causal proof.
      - title: JavaScript architecture, module cohesion, dependency direction, functional core, object boundaries, and contracts
        behind_the_scenes: Organize domain policy separately from effects, inject capabilities at composition roots, preserve module invariants, and validate external data at runtime.
        practical: Refactor a tightly coupled feature into a pure domain core with adapters for clock, storage, network, and telemetry.
        interview: Explain architectural choices through change cost, testability, failure isolation, and explicit tradeoffs.
      - title: JavaScript production architecture capstone, event pipeline, reliability, observability, security, and performance
        behind_the_scenes: Connect language semantics, async scheduling, module design, resource ownership, validation, error taxonomy, runtime measurement, and operational constraints in one service.
        practical: Build an event-processing slice with bounded concurrency, cancellation, idempotency, structured errors, tests, metrics, profiles, and a failure runbook.
        interview: Defend the complete design by tracing success, overload, cancellation, duplicate input, dependency failure, memory growth, and recovery.

  - id: typescript
    title: TypeScript Complete Deep Dive
    tier: core
    goal: Use the type system to encode intent and make frontend, backend, and AI-generated changes safer.
    topics:
      - title: TypeScript setup, compiler versions, tsconfig, strict mode, and reproducible checks
        behind_the_scenes: Pin the compiler, understand project discovery, establish strict defaults, and separate editor feedback from an explicit command-line check.
        practical: Create a minimal strict project that type-checks without emitting and records the exact compiler configuration and version.
        interview: Explain what TypeScript adds to JavaScript and what a successful type-check does not prove.
      - title: Compiler pipeline, scanner, parser, binder, checker, transformer, emitter, and language service
        behind_the_scenes: Trace source through tokens, AST construction, symbol binding, relationship checking, transforms, JavaScript and declaration emit, and incremental editor queries.
        practical: Inspect an AST, emitted JavaScript, declarations, diagnostics, and a compiler trace for one small program.
        interview: Describe the compiler phases and distinguish batch compilation from language-service behavior.
      - title: TypeScript design goals, type erasure, structural typing, gradual adoption, and soundness tradeoffs
        behind_the_scenes: Study the erasable structural type system, JavaScript compatibility, deliberate unsoundness, and productivity-oriented design choices.
        practical: Produce examples that type-check but fail at runtime, then identify the boundary evidence needed to make them safe.
        interview: Explain why TypeScript is useful without claiming it is sound or supplies runtime validation.
      - title: Type annotations, inference, contextual typing, best common types, and widening
        behind_the_scenes: Follow how annotations constrain values while initialization, return context, callbacks, and candidate sets drive inference and literal widening.
        practical: Remove redundant annotations, add contracts at unstable boundaries, and inspect inferred types with compile-time assertions.
        interview: Explain when inference improves maintainability and when an explicit contract is necessary.
      - title: any, unknown, never, void, undefined, null, and top or bottom types
        behind_the_scenes: Compare escape hatches, safe top types, unreachable bottom types, absent values, function-return conventions, and strict null checking.
        practical: Replace any with unknown at an external boundary and narrow it into a trusted domain value.
        interview: Contrast any, unknown, never, and void with precise assignability examples.
      - title: Assignability, structural compatibility, freshness, excess property checks, and open object types
        behind_the_scenes: Trace member-wise compatibility, source and target relationships, fresh object-literal checks, variable assignment, and the absence of exact object types.
        practical: Diagnose an extra-property bug and design a runtime boundary that rejects unknown keys.
        interview: Explain why a variable with extra fields may be assignable when the same object literal is rejected.
      - title: Optional properties, exactOptionalPropertyTypes, indexed access, noUncheckedIndexedAccess, and safe absence
        behind_the_scenes: Separate a missing property from a present undefined value and model uncertain key lookup under stricter compiler options.
        practical: Harden configuration and dictionary access without non-null assertions or truthiness mistakes.
        interview: Explain how strict optional and indexed-access flags expose real production failure paths.
      - title: Union types, intersection types, common members, impossible intersections, and composition
        behind_the_scenes: Understand set-like combinations, accessible operations, intersection normalization, conflicting properties, and how runtime values satisfy combined structure.
        practical: Model alternative payment inputs and composed service capabilities without unsafe assertions.
        interview: Compare unions and intersections using value sets and property access.
      - title: Discriminated unions, state machines, exhaustiveness, never, and illegal states
        behind_the_scenes: Use literal discriminants and control-flow analysis to correlate fields, eliminate variants, and detect missing cases through never.
        practical: Replace booleans and nullable fields with an exhaustive request-lifecycle state machine.
        interview: Show how discriminated unions make illegal states unrepresentable and future changes compiler-visible.
      - title: Control-flow analysis, narrowing, typeof, instanceof, in, equality, and truthiness
        behind_the_scenes: Follow how assignments, conditions, returns, reachability, aliases, and built-in guards refine or widen the checker view at each program point.
        practical: Draw the flow graph for a mixed union and remove unsafe casts through evidence-producing conditions.
        interview: Explain narrowing as control-flow analysis rather than permanent mutation of a declared type.
      - title: User-defined type guards, assertion functions, predicates, validation, and narrowing safety
        behind_the_scenes: Learn how predicate and assertion signatures instruct the checker and why an incorrect implementation creates unsoundness.
        practical: Implement tested guards and assertion functions for API payloads while keeping parsing separate from boolean checks.
        interview: Compare a predicate, an assertion function, and a parser returning validated data.
      - title: Function types, call signatures, construct signatures, parameters, callbacks, and overloads
        behind_the_scenes: Study parameter and return compatibility, optional and rest parameters, contextual callbacks, implementation signatures, and overload resolution.
        practical: Design a public API with one honest generic or union signature instead of misleading overloads.
        interview: Explain when overloads are appropriate and why the implementation signature is invisible to callers.
      - title: Object types, interfaces, type aliases, declaration merging, index signatures, and property keys
        behind_the_scenes: Compare structural contracts, aliasable expressions, interface merging, index constraints, numeric key behavior, and symbol properties.
        practical: Model a plugin registry and choose intentionally between an interface, type alias, Record, and Map.
        interview: Compare interface and type without claiming one is always superior.
      - title: Readonly, const assertions, readonly arrays, tuples, satisfies, and literal preservation
        behind_the_scenes: Distinguish compile-time write restrictions from runtime immutability, preserve literals, validate shapes without replacing inference, and model fixed positions.
        practical: Define an immutable route catalog retaining literal keys and values while satisfying a broader contract.
        interview: Contrast annotation, assertion, const assertion, and satisfies.
      - title: Generics, type parameters, constraints, defaults, relationships, and reusable contracts
        behind_the_scenes: Treat type parameters as relationships among positions, apply constraints only to required capabilities, and understand defaults.
        practical: Design repository and selection APIs that preserve caller types without leaking any.
        interview: Derive a generic signature from input-output relationships instead of adding a decorative type parameter.
      - title: Generic inference, inference sites, contextual inference, const type parameters, and inference failures
        behind_the_scenes: Trace candidates from arguments, return context, constraints, and variance, then see how const parameters retain literals.
        practical: Diagnose an inference failure and compare explicit arguments, helper design, NoInfer, and const type parameters.
        interview: Explain why TypeScript cannot infer information no value or context supplies.
      - title: keyof, typeof in type positions, indexed access types, lookup relationships, and value-derived types
        behind_the_scenes: Form key unions, capture static types from value declarations, and look up correlated property types without executing code.
        practical: Build a type-safe property selector and derive configuration types from one value-level source of truth.
        interview: Distinguish runtime typeof from type-query typeof and explain T[K].
      - title: Mapped types, mapping modifiers, key remapping, property transforms, and homomorphism
        behind_the_scenes: Iterate over keys, preserve or remove modifiers, remap with as, filter with never, and observe homomorphic preservation.
        practical: Derive update, event-handler, and serialized forms from one domain model.
        interview: Write and explain a mapped type without treating it as runtime iteration.
      - title: Conditional types, constraints, infer, distributivity, recursion, and deferred evaluation
        behind_the_scenes: Select by assignability, introduce inferred variables, distribute naked parameters over unions, suppress distribution with tuples, and control recursion.
        practical: Implement result extraction and compare distributive with non-distributive behavior using type tests.
        interview: Explain substitution and union distribution, including complexity limits.
      - title: Template literal types, string unions, key paths, event names, and combinatorial growth
        behind_the_scenes: Cross-multiply interpolated unions, infer substrings, compose string transformations, and recognize oversized generated unions.
        practical: Type an event naming convention and shallow property-path API with an intentional complexity limit.
        interview: Show where template literal types improve contracts and where code generation is clearer.
      - title: Built-in utility types, Partial, Required, Pick, Omit, Record, ReturnType, Parameters, and Awaited
        behind_the_scenes: Reconstruct common utilities from mapped and conditional types, understand their shallow nature, and identify overload and union behavior.
        practical: Replace vague utilities with domain-named contracts when business meaning differs from mechanical transformation.
        interview: Derive two utility types and explain why Partial is rarely a complete update model.
      - title: Variance, covariance, contravariance, invariance, bivariance, and strictFunctionTypes
        behind_the_scenes: Determine how type parameters in output, input, mutable, and method positions affect assignability and callback safety.
        practical: Repair an unsafe callback and mutable collection assignment using readonly views and correct parameter direction.
        interview: Explain variance with producers and consumers rather than memorized prefixes.
      - title: Classes, public, protected, private, abstract classes, parameter properties, and override safety
        behind_the_scenes: Connect instance and static sides, structural compatibility, JavaScript private fields, TypeScript private members, abstract contracts, and noImplicitOverride.
        practical: Model a framework base class, then compare it with a composed interface-driven design.
        interview: Explain how TypeScript classes participate in runtime JavaScript and compile-time typing.
      - title: Nominal techniques, private members, unique symbols, branded types, opaque IDs, and units
        behind_the_scenes: Add identity constraints to a structural system with inaccessible members or unique-symbol brands while remembering brands erase.
        practical: Prevent user IDs, project IDs, meters, and milliseconds from being mixed after runtime parsing.
        interview: Explain branded-type benefits and limitations without claiming runtime validation.
      - title: Decorators, standard decorator semantics, contexts, metadata boundaries, and dependency injection
        behind_the_scenes: Trace class-element replacement and initialization under current semantics and distinguish legacy experimental decorators and metadata conventions.
        practical: Implement a typed method decorator preserving this, parameters, return type, and errors.
        interview: Compare standard and legacy decorators and identify hidden control-flow or typing risks.
      - title: Enums, const enums, literal unions, runtime objects, reverse mappings, and alternatives
        behind_the_scenes: Compare emitted enum objects, numeric reverse mappings, const-enum inlining hazards, literal unions, and as-const lookup objects.
        practical: Replace an unsafe cross-package const enum with a versionable wire representation and runtime parser.
        interview: Choose among enum, literal union, and as-const object based on runtime and API needs.
      - title: ECMAScript modules, type-only imports, verbatimModuleSyntax, isolatedModules, and emit correctness
        behind_the_scenes: Track whether imports exist at runtime, how erasure affects module edges, and why single-file transpilers need locally understandable syntax.
        practical: Make a mixed type and value import emit correctly under strict module settings.
        interview: Explain why an import can affect type checking, runtime loading, both, or neither.
      - title: Module resolution, NodeNext, bundler mode, package exports, imports, paths, and traceResolution
        behind_the_scenes: Follow the host model through specifiers, extensions, package conditions, declarations, aliases, and resolution diagnostics.
        practical: Diagnose a works-in-editor but fails-at-runtime import and align compiler, runtime, tests, and bundler.
        interview: Explain why paths does not rewrite output and how module resolution must match the host.
      - title: Declaration files, ambient declarations, global scope, module augmentation, and lib selection
        behind_the_scenes: Describe runtime values without implementation, control script versus module scope, merge declarations, and select DOM, Node, or Worker libraries.
        practical: Type an untyped library and augment an existing module without leaking accidental globals.
        interview: Explain what a d.ts promises and how inaccurate declarations create false confidence.
      - title: Typed library authoring, declaration emit, package exports, typesVersions, API surface, and compatibility
        behind_the_scenes: Generate declarations, map runtime entries to types, expose stable public names, and test consumers across compiler versions.
        practical: Package a small library and verify installation, imports, declarations, and public API from a clean consumer.
        interview: Describe how runtime and declaration files stay aligned across package conditions.
      - title: JavaScript interop, allowJs, checkJs, JSDoc types, declaration generation, and gradual migration
        behind_the_scenes: Infer JavaScript, layer JSDoc contracts, check selected files, emit declarations, and migrate without a flag-day rewrite.
        practical: Convert one dependency leaf from JavaScript to checked JSDoc and then TypeScript while preserving behavior.
        interview: Propose an incremental migration plan that keeps builds deployable.
      - title: Runtime validation, unknown input, parsing, schemas, decoders, and trusted domain types
        behind_the_scenes: Recognize erasure, turn unknown values into validated representations, accumulate useful errors, and align parser output with domain contracts.
        practical: Implement and test a dependency-free parser, then compare schema inference and code generation.
        interview: Explain why parsing is safer than casting and why as Type does not establish runtime truth.
      - title: HTTP, environment, database, queue, file, and AI-output type boundaries
        behind_the_scenes: Identify external uncertainty, version wire contracts, validate at entry, translate into domain types, and serialize explicitly.
        practical: Trace a command from environment and HTTP through persistence and AI structured output with validation at every boundary.
        interview: Prioritize boundaries requiring runtime checks in an all-TypeScript codebase.
      - title: Async typing, Promise, Awaited, async iterables, generators, cancellation, and error channels
        behind_the_scenes: Model eventual values, recursive unwrapping, streamed iteration, generator slots, AbortSignal, and explicit result errors.
        practical: Type a cancellable paginated async generator and consume it with bounded work and complete cleanup.
        interview: Explain what async types express and which scheduling, cancellation, and rejection behavior remains runtime-only.
      - title: React with TypeScript, component props, events, refs, generics, reducers, and polymorphism
        behind_the_scenes: Align JSX inference, intrinsic elements, events, refs, discriminated state, generic components, and constrained polymorphism.
        practical: Build an accessible generic data table and reducer form without React.FC, any, or unsafe casts.
        interview: Explain React typing tradeoffs without making component APIs harder to use.
      - title: Node.js with TypeScript, ESM, configuration, processes, streams, errors, and service boundaries
        behind_the_scenes: Align Node modules and types, parse environment input, type stream and process lifecycles, and preserve errors and cancellation.
        practical: Build a typed ESM service entry point with validated configuration and graceful shutdown.
        interview: Diagnose compilation success followed by a Node module-loading failure.
      - title: Type testing, ts-expect-error, assignability assertions, declaration tests, runtime tests, and contract evidence
        behind_the_scenes: Separate tests of checker behavior from emitted runtime behavior and verify accepted and rejected programs across public declarations.
        practical: Add positive and negative type tests plus runtime boundary tests for one API.
        interview: Explain why a unit test cannot prove a type error and a type test cannot prove runtime validation.
      - title: tsconfig strictness, target, lib, module, moduleResolution, include, exclude, and build ownership
        behind_the_scenes: Understand how options change inputs, platform declarations, checks, resolution, transforms, and emitted artifacts.
        practical: Create browser, Node, worker, and test configurations with shared strict defaults and no global mixing.
        interview: Explain target, lib, module, and moduleResolution using a deployment example.
      - title: Project references, composite projects, incremental builds, declaration boundaries, monorepos, and build mode
        behind_the_scenes: Build a project graph whose consumers load declarations, cache build data, and rebuild affected dependencies in order.
        practical: Split a monorepo into domain, server, and web projects and verify incremental rebuild and boundaries.
        interview: State when project references improve scale and when their overhead is unnecessary.
      - title: Compiler API, AST traversal, symbols, types, transforms, language service, and tooling
        behind_the_scenes: Use Programs, SourceFiles, nodes, checker, symbols, transformations, and services without confusing syntax and semantics.
        practical: Write a read-only analyzer reporting exported functions without explicit return contracts.
        interview: Explain the difference between AST nodes, symbols, and types.
      - title: Type-checker performance, extendedDiagnostics, generateTrace, instantiation depth, project size, and editor latency
        behind_the_scenes: Measure parse, bind, check, emit, memory, relation caches, instantiation, file discovery, and language-server work before optimizing.
        practical: Capture diagnostics and a trace, locate an expensive type or oversized project, and verify improvement quantitatively.
        interview: Diagnose slow TypeScript with evidence rather than recommending skipLibCheck by reflex.
      - title: TypeScript upgrades, release notes, deprecations, strictness migration, dependency types, and compatibility
        behind_the_scenes: Treat compiler and library declaration changes as dependency upgrades affecting inference, resolution, diagnostics, and output.
        practical: Upgrade a pinned project, classify errors, remove obsolete suppressions, and record compatibility tests.
        interview: Describe a safe compiler-upgrade process for a large codebase.
      - title: Safe AI-assisted TypeScript, generated code, type constraints, validation, tests, review, and provenance
        behind_the_scenes: Use types as review constraints while recognizing generated code may type-check yet violate runtime, security, performance, or business needs.
        practical: Repair an AI-generated feature using diagnostics, validation, adversarial tests, dependency review, and measurement.
        interview: Explain how TypeScript helps AI-assisted work without outsourcing engineering judgment.
      - title: TypeScript architecture, domain modeling, ports, adapters, dependency direction, and change cost
        behind_the_scenes: Keep domain states precise, isolate framework and vendor types at adapters, inject capabilities, and expose stable contracts.
        practical: Refactor a coupled feature into a typed functional core with validated adapters.
        interview: Defend type complexity through prevented states, ownership, testability, and change cost.
      - title: TypeScript production architecture capstone, full-stack contracts, reliability, security, observability, and evolution
        behind_the_scenes: Join configuration, domain types, runtime schemas, packaging, cancellation, errors, telemetry, type tests, and compatibility in one system.
        practical: Build a versioned React-to-Node command slice with validation, persistence, AI output parsing, tests, declarations, and an upgrade runbook.
        interview: Trace compile time, runtime success, malformed input, cancellation, dependency failure, schema evolution, and deployment.

  - id: react
    title: React Complete Deep Dive
    tier: core
    goal: Master the complete modern React surface, explain its runtime and server boundaries, and build accessible, tested, production-grade interfaces.
    topics:
      - title: React setup, project anatomy, module graph, and development tooling
        behind_the_scenes: Trace source modules through the compiler, bundler, development server, browser module graph, React runtime, and DevTools.
        practical: Create a strict React and TypeScript workspace, inspect its production bundle, and document every transformation from source to browser.
        interview: Explain what React provides, what the build tool provides, and what the browser executes.
      - title: JSX, elements, expressions, fragments, and element creation
        behind_the_scenes: Understand JSX transformation, immutable element descriptions, children representation, escaping, and the difference between an element and a component instance.
        practical: Translate nested JSX to element creation calls and inspect the resulting element objects without relying on framework magic.
        interview: Explain why JSX is syntax rather than HTML and how it becomes a renderable tree.
      - title: Components, props, children, composition, and public component APIs
        behind_the_scenes: Model component invocation, one-way data flow, opaque children, composition boundaries, and API surface area.
        practical: Build compound and slot-based components without cloning children or coupling callers to internal markup.
        interview: Compare composition, configuration props, render props, and inheritance.
      - title: Purity, Rules of React, Rules of Hooks, and Strict Mode
        behind_the_scenes: Learn why rendering must be idempotent, how React owns component calls, why hook order is positional, and how development replays expose unsafe behavior.
        practical: Repair components that mutate inputs, call hooks conditionally, or depend on render-time side effects; verify them under Strict Mode.
        interview: Derive the Rules of Hooks from React's hook bookkeeping rather than reciting lint rules.
      - title: Events, propagation, event handlers, update priority, and batching
        behind_the_scenes: Follow browser events through React delegation, capture and bubble phases, handler execution, state queueing, automatic batching, and the next render.
        practical: Build nested keyboard and pointer interactions, deliberately control propagation, and trace batched versus synchronous updates.
        interview: Distinguish event handlers from effects and explain why state does not change inside an existing render snapshot.
      - title: useState, render snapshots, update queues, batching, and functional updates
        behind_the_scenes: Trace hook slots, memoized state, queued updater functions, Object.is bailouts, lazy initialization, and state replacement across renders.
        practical: Implement counters, object and array updates, reset behavior, and queued updates while predicting every rendered value first.
        interview: Explain stale state, functional updaters, immutability, and when state is preserved.
      - title: useReducer, actions, reducer purity, initialization, and dispatch
        behind_the_scenes: Understand reducer hook storage, action queues, stable dispatch identity, lazy initialization, and why reducers must remain pure.
        practical: Build a typed multi-step editor with undoable actions, invariant tests, and reducer-level property checks.
        interview: Decide between useState and useReducer and defend the action and state design.
      - title: State modeling, normalization, derived data, lifting state, and ownership
        behind_the_scenes: Match state identity and lifetime to the tree, eliminate contradictory or redundant state, and derive values during render.
        practical: Refactor a duplicated-state interface into one normalized source of truth with explicit ownership boundaries.
        interview: Diagnose state synchronization defects and explain where state should live.
      - title: Identity, keys, reconciliation, state preservation, and reset
        behind_the_scenes: Learn how element type, position, and key participate in child reconciliation and determine whether fibers and state are reused or recreated.
        practical: Repair index-key bugs, preserve draft state across reordering, and intentionally reset forms with identity.
        interview: Explain keys beyond list warnings and predict preservation across tree changes.
      - title: createContext and useContext, providers, defaults, and update propagation
        behind_the_scenes: Trace provider lookup through the fiber tree, subscriber invalidation, reference identity, default values, and context update fan-out.
        practical: Build split state and dispatch contexts, stabilize provider values, and measure avoidable consumer renders.
        interview: Explain when context solves dependency distribution and when it becomes hidden global state.
      - title: useRef, DOM refs, ref callbacks, and useImperativeHandle
        behind_the_scenes: Distinguish retained mutable cells from reactive state, follow ref attachment through commit, and constrain imperative APIs.
        practical: Build an accessible focus-managed widget, measure a node safely, and expose a minimal imperative handle through a ref.
        interview: Choose among state, refs, callback refs, and imperative handles without creating invisible data flow.
      - title: useEffect, external synchronization, setup, cleanup, and dependencies
        behind_the_scenes: Separate render and commit, trace passive effect scheduling, Object.is dependency comparison, cleanup-before-next-setup, and development replay.
        practical: Synchronize a connection and cancellable request with props while proving cleanup prevents races and leaks.
        interview: Identify when an effect is necessary and explain its lifecycle independently of mount and update folklore.
      - title: useLayoutEffect and useInsertionEffect timing
        behind_the_scenes: Compare insertion, mutation, layout, paint, and passive-effect timing, including server-rendering constraints and why insertion effects target CSS-in-JS libraries.
        practical: Remove tooltip flicker with measured layout and prototype style injection without blocking more work than necessary.
        interview: Select the least disruptive effect timing and explain the performance cost of synchronous layout work.
      - title: useEffectEvent, reactive dependencies, and stale closure repair
        behind_the_scenes: Separate reactive synchronization from non-reactive effect events while preserving access to the latest committed props and state.
        practical: Fix reconnect loops and stale analytics values without suppressing the exhaustive-dependencies rule.
        interview: Explain closure capture, dependency correctness, and the narrow role of effect events.
      - title: Custom Hooks, reusable stateful logic, useDebugValue, and hook contracts
        behind_the_scenes: Understand that custom hooks share logic rather than state, compose built-in hooks positionally, and expose diagnostic labels to DevTools.
        practical: Extract a tested online-status hook with subscription cleanup, server fallback, and a formatted debug value.
        interview: Design a custom hook API and identify abstractions that merely hide complexity.
      - title: memo, useMemo, useCallback, referential equality, and cache invalidation
        behind_the_scenes: Learn prop comparison, dependency caches, function identity, invalidation, retained memory, and why memoization is a performance hint rather than semantics.
        practical: Profile a slow child, add only evidence-backed memoization, and prove the before and after commit cost.
        interview: Explain when memoization helps, when it cannot help, and why unstable objects defeat it.
      - title: useTransition, startTransition, useDeferredValue, and interruptible rendering
        behind_the_scenes: Trace urgent and transition updates through scheduler lanes, interruption, restart, pending state, and deferred rendering.
        practical: Keep search input responsive while rendering and fetching an expensive result view, with visible pending and stale states.
        interview: Compare debouncing, throttling, transitions, and deferred values.
      - title: useId, deterministic identity, accessibility relationships, and hydration
        behind_the_scenes: Understand tree-derived IDs, server and client consistency, identifier prefixes, and why useId is not a list-key generator.
        practical: Build reusable form fields with stable label, description, and error relationships across server rendering.
        interview: Explain why random IDs can cause hydration or accessibility defects.
      - title: useSyncExternalStore, subscriptions, snapshots, and server snapshots
        behind_the_scenes: Study the subscribe and getSnapshot contract, snapshot caching, tearing prevention, hydration snapshots, and transitions that mutate external stores.
        practical: Adapt browser online state and a small external store with deterministic server behavior and concurrency-safe updates.
        interview: Explain why reading a mutable singleton during render is insufficient.
      - title: use, promises, context resources, Suspense integration, and conditional reads
        behind_the_scenes: Learn how use reads promises or context, signals suspension, resumes rendering, interacts with error boundaries, and differs from conventional hooks.
        practical: Stream a promise from a server boundary, read it under Suspense, and handle rejection without effect-based fetching.
        interview: Explain suspension as control flow and the special call-site rules of use.
      - title: useActionState, useOptimistic, useFormStatus, actions, and pending UI
        behind_the_scenes: Trace form submission through actions, transition scheduling, optimistic state, server responses, progressive enhancement, and nearest-form status.
        practical: Build an accessible comment form with optimistic insertion, validation errors, pending feedback, and rollback.
        interview: Compare optimistic UI with confirmed state and explain action failure handling.
      - title: Controlled and uncontrolled inputs, forms, validation, and file fields
        behind_the_scenes: Connect DOM input state, React props, default values, event updates, form serialization, constraint validation, and controlled-mode invariants.
        practical: Build accessible controlled and uncontrolled forms, preserve input responsiveness, and test browser validation and file submission.
        interview: Choose controlled versus uncontrolled fields and diagnose input warnings or cursor problems.
      - title: Client data fetching, caches, race prevention, optimistic updates, and URL state
        behind_the_scenes: Separate server state from UI state and trace request identity, cancellation, deduplication, cache keys, invalidation, mutation, and navigation lifetime.
        practical: Build a filterable data screen with abortable requests, cache behavior, optimistic mutation, error rollback, and shareable URL state.
        interview: Explain why effect-based fetching alone creates waterfalls and missing cache semantics.
      - title: Suspense, lazy, code splitting, streaming boundaries, and fallbacks
        behind_the_scenes: Follow thrown thenables, nearest-boundary capture, retry, reveal order, lazy module caching, server streaming, and hydration priority.
        practical: Split a route and nested expensive panel with stable fallbacks, preload intent, and measured loading behavior.
        interview: Explain what Suspense coordinates and what it does not automatically fetch.
      - title: Error boundaries, rejected resources, recovery, and observability
        behind_the_scenes: Understand render error propagation, boundary capture, subtree replacement, reset identity, event and async exclusions, and error reporting.
        practical: Build route and widget-level boundaries with retry, trace IDs, logging, and a deliberately failing resource.
        interview: Place boundaries by failure domain and distinguish render errors from event-handler failures.
      - title: Portals, overlays, stacking contexts, focus management, and event trees
        behind_the_scenes: Separate physical DOM placement from logical React ancestry, including context access and React-tree event bubbling.
        practical: Build a modal with a portal, focus trap, escape handling, scroll locking, restoration, and nested overlay tests.
        interview: Explain why a portal fixes clipping but not accessibility automatically.
      - title: React with TypeScript, component contracts, refs, events, and polymorphism
        behind_the_scenes: Connect JSX typing, intrinsic element maps, generic inference, discriminated props, ref types, and runtime boundary validation.
        practical: Build typed controlled components and a constrained polymorphic primitive without unsafe casts or impossible prop combinations.
        interview: Derive component prop types and explain what TypeScript cannot validate at runtime.
      - title: Styling, CSS architecture, responsive design, and design systems
        behind_the_scenes: Understand how React composition interacts with cascade layers, tokens, variants, responsive constraints, runtime style insertion, and package boundaries.
        practical: Build themeable primitives with tokens, states, responsive behavior, dark mode, and visual-regression examples.
        interview: Defend a styling strategy through performance, maintainability, SSR, and accessibility tradeoffs.
      - title: Accessibility, semantic HTML, keyboard interaction, focus, and announcements
        behind_the_scenes: Connect React output to the DOM and accessibility tree, native semantics, focus order, live regions, and interaction state machines.
        practical: Implement and audit a form, dialog, tabs, and async status flow using keyboard and assistive-technology expectations.
        interview: Treat accessibility as behavioral correctness and explain how automated and manual tests complement each other.
      - title: Component tests, integration tests, browser tests, act, and user behavior
        behind_the_scenes: Understand the render and commit work flushed by act, DOM-level observation, test environment limits, event fidelity, and async stabilization.
        practical: Test a component, a routed data flow, accessibility behavior, and one browser-critical journey without asserting implementation details.
        interview: Choose test boundaries and explain why snapshots or shallow rendering cannot prove user behavior.
      - title: Profiler, render diagnostics, performance tracks, and optimization workflow
        behind_the_scenes: Distinguish render and commit cost, interaction latency, wasted versus necessary work, browser main-thread work, and production profiling constraints.
        practical: Capture a baseline trace, isolate a slow interaction, fix its dominant cost, and document measurable improvement.
        interview: Diagnose performance from evidence before selecting memoization, virtualization, scheduling, or architectural changes.
      - title: React Compiler, automatic memoization, directives, linting, and adoption
        behind_the_scenes: Learn how the compiler analyzes components and hooks, applies memoization, skips unsafe patterns, relies on the Rules of React, and reports diagnostics.
        practical: Enable the compiler incrementally, verify compiled components in DevTools, compare profiles, and debug an intentionally incompatible pattern.
        interview: Explain what the compiler optimizes, what it does not optimize, and how manual memoization coexists with it.
      - title: Fiber nodes, reconciliation, render work, commit work, lanes, and scheduling
        behind_the_scenes: Build a useful internal model of current and work-in-progress fiber trees, update queues, child reconciliation, lanes, interruption, and atomic commits.
        practical: Annotate a component update from dispatched action through scheduled work, fiber traversal, effect flags, DOM mutation, and passive effects.
        interview: Explain concurrent rendering without claiming that React renders DOM mutations concurrently.
      - title: createRoot, hydrateRoot, StrictMode, portals, and React DOM client APIs
        behind_the_scenes: Trace root creation, event delegation, concurrent capabilities, hydration attachment, recoverable errors, root unmounting, portals, and flushSync escape behavior.
        practical: Mount and unmount multiple roots, capture recoverable hydration errors, and demonstrate the narrow valid use of flushSync.
        interview: Contrast root rendering, hydration, portals, and forced synchronous commits.
      - title: Server rendering, streaming HTML, static rendering, and hydration
        behind_the_scenes: Follow server tree rendering, shell readiness, Suspense streaming, bootstrap resources, client hydration, selective hydration, and mismatch recovery.
        practical: Stream a page with two Suspense boundaries, hydrate it, inject a mismatch, and inspect recovery and user-visible timing.
        interview: Compare CSR, SSR, streaming SSR, static generation, and hydration costs.
      - title: Server Components, Client Components, serialization, and bundle boundaries
        behind_the_scenes: Separate the Server Component environment from SSR, trace payload references, async server rendering, client boundaries, serializable props, and bundle exclusion.
        practical: Move data access and a heavy dependency to a Server Component while retaining a small interactive Client Component.
        interview: Explain why use server does not mark Server Components and how RSC changes the module graph.
      - title: Server Functions, use server, actions, authorization, and progressive enhancement
        behind_the_scenes: Trace a client-held server reference through transport, argument serialization, execution, response, transition state, and framework integration boundaries.
        practical: Implement an authenticated mutation with validation, authorization, idempotency, pending UI, error return, and no-JavaScript form behavior.
        interview: Treat every Server Function as a public mutation boundary and explain its security obligations.
      - title: Routing, framework boundaries, layouts, data loading, and resource preloading
        behind_the_scenes: Understand how React frameworks combine route matching, server and client rendering, nested layouts, caching, bundling, navigation transitions, and preload APIs.
        practical: Build nested routes with route-level data, code splitting, error and loading boundaries, metadata, and measured navigation waterfalls.
        interview: Separate React concepts from framework guarantees and justify framework adoption.
      - title: React security, escaping, dangerouslySetInnerHTML, URLs, and trust boundaries
        behind_the_scenes: Study default text escaping, attribute and URL sinks, raw HTML injection, hydration data, third-party scripts, client-side authorization limits, and dependency risk.
        practical: Threat-model and harden a rich-text, link, and server-action flow with sanitization and server-side authorization tests.
        interview: Explain what React escapes, what it cannot protect, and why frontend checks never replace backend authorization.
      - title: React DevTools, component stacks, source maps, debugging, and production incidents
        behind_the_scenes: Connect component and owner stacks, hook inspection, render highlighting, profiling, source maps, error telemetry, and user-session evidence.
        practical: Diagnose seeded stale-state, excessive-render, hydration, and effect-loop defects from traces rather than guesses.
        interview: Narrate a disciplined React debugging workflow from symptom to verified fix.
      - title: Class components, lifecycle methods, legacy context, and migration
        behind_the_scenes: Map class instance state and lifecycle phases to modern render and commit concepts while recognizing APIs still required for error boundaries.
        practical: Test and incrementally migrate a class component with lifecycle synchronization to hooks without changing observable behavior.
        interview: Translate componentDidMount and componentDidUpdate reasoning into one synchronization process and identify unsafe migrations.
      - title: React architecture, feature boundaries, state placement, and scalable delivery
        behind_the_scenes: Align module ownership, component APIs, state lifetimes, server boundaries, error domains, test seams, and team deployment boundaries.
        practical: Design and implement a vertical feature slice with an ADR, dependency rules, performance budget, and independent test strategy.
        interview: Defend architecture through change cost and failure containment instead of folder-name preferences.
      - title: Portfolio Project 1 — production-quality frontend
        behind_the_scenes: Expose architecture, rendering, data flow, server and client boundaries, accessibility, testing, security, and performance decisions in documentation.
        practical: Ship a tested React and TypeScript application with accessible interactions, server-state behavior, failure recovery, profiling evidence, CI, and a production deployment.
        interview: Present the system, tradeoffs, a difficult bug, an incident or failure mode, and measured improvements using concise internationally legible evidence.

  - id: nodejs
    title: Node.js Complete Deep Dive
    tier: core
    goal: Build reliable JavaScript services and explain how Node executes asynchronous and CPU-bound work.
    topics:
      - title: Node.js setup, release lines, version management, CLI, REPL, and reproducible execution
        behind_the_scenes: Distinguish release status, runtime binaries, command-line flags, package metadata, environment input, and host platform details.
        practical: Create a pinned zero-dependency ESM workspace and record exact Node, npm, V8, libuv, OpenSSL, and platform versions.
        interview: Explain how you choose and upgrade a production Node release without relying on whatever is installed locally.
      - title: Node.js architecture, V8, native bindings, libuv, operating system, and host APIs
        behind_the_scenes: Trace JavaScript from V8 through Node bindings into libuv or synchronous OS calls and back into JavaScript callbacks.
        practical: Classify common APIs by JavaScript, Node binding, libuv, worker-pool, and kernel responsibility.
        interview: Explain Node as a JavaScript host rather than calling it a language or merely a single thread.
      - title: Event loop phases, timers, pending callbacks, poll, check, close callbacks, and iteration
        behind_the_scenes: Follow libuv loop iterations through readiness, timer, check, and close work while separating platform-dependent details from stable guarantees.
        practical: Instrument timers, I/O, setImmediate, and socket close callbacks and predict their ordering from the scheduling context.
        interview: Draw the event-loop phases and avoid claiming one universal ordering across all contexts.
      - title: process.nextTick, Promise microtasks, queueMicrotask, setImmediate, timers, and starvation
        behind_the_scenes: Compare the next-tick queue, V8 microtask checkpoints, libuv phases, timer thresholds, and how recursively queued work can starve I/O.
        practical: Build an ordering matrix and reproduce then repair nextTick or microtask starvation.
        interview: Explain why nextTick, a resolved Promise, setImmediate, and setTimeout are not interchangeable.
      - title: libuv worker pool, file system, crypto, DNS, UV_THREADPOOL_SIZE, and saturation
        behind_the_scenes: Identify APIs using the shared worker pool, distinguish OS-network readiness, and see how long tasks delay unrelated pool consumers.
        practical: Saturate the pool with password derivation and measure its effect on file and DNS latency before applying bounded admission.
        interview: Explain why asynchronous does not always mean non-threaded and diagnose worker-pool contention.
      - title: Callback APIs, error-first callbacks, promises, promisify, async functions, and error propagation
        behind_the_scenes: Follow callback ownership, synchronous throws, promise rejection, async resumption, multiple completion hazards, and util.promisify conventions.
        practical: Wrap a callback API safely, preserve errors and cancellation, and prove it settles exactly once.
        interview: Compare callback and Promise failure channels and identify lost rejection paths.
      - title: EventEmitter, listeners, synchronous dispatch, once, errors, captureRejections, and leaks
        behind_the_scenes: Understand ordered synchronous listener invocation, special error events, listener identity, rejection capture, and retention through registrations.
        practical: Build a lifecycle emitter with cleanup and reproduce a listener leak warning.
        interview: Explain how EventEmitter differs from the event loop and why missing error listeners can terminate a process.
      - title: async_hooks, AsyncLocalStorage, AsyncResource, execution context, and request correlation
        behind_the_scenes: Trace async resource creation, trigger relationships, callback execution, destruction, and context propagation through supported boundaries.
        practical: Attach a request ID with AsyncLocalStorage and verify propagation through timers, promises, fetch, and a custom AsyncResource.
        interview: Explain why global variables cannot safely hold per-request context and where async context can break.
      - title: Timers, AbortSignal, ref, unref, scheduling, drift, and cleanup
        behind_the_scenes: Treat timer delays as thresholds, understand loop delay and drift, compose abortable promise timers, and control whether handles keep the process alive.
        practical: Implement an abortable periodic task without overlap and prove shutdown leaves no referenced timer.
        interview: Explain why setTimeout is not a precise scheduler and when unref is appropriate.
      - title: Buffer, encodings, allocation, pooling, slices, copies, and binary safety
        behind_the_scenes: Understand byte storage, slab allocation, zero-filled versus unsafe allocation, view semantics, encoding boundaries, and maximum-size risks.
        practical: Parse a length-prefixed binary message with bounds checks and demonstrate slice aliasing versus copying.
        interview: Explain why Buffer is not text and how unsafe allocation or unbounded lengths become vulnerabilities.
      - title: ArrayBuffer, TypedArray, DataView, Buffer interop, transfer, and endianness
        behind_the_scenes: Relate Node Buffer views to ECMAScript binary storage, byte offsets, underlying pooled buffers, transferability, and explicit byte order.
        practical: Exchange a binary payload between a Buffer and worker without accidentally exposing unrelated pooled bytes.
        interview: Compare Buffer, ArrayBuffer, TypedArray, and DataView ownership and view behavior.
      - title: Stream architecture, Readable, Writable, Duplex, Transform, states, and events
        behind_the_scenes: Trace internal readable and writable state, queues, mode selection, lifecycle events, error destruction, and half-open duplex behavior.
        practical: Inspect stream state while moving data through a custom transform and forced failure.
        interview: Explain streams as bounded incremental protocols rather than simply large-file helpers.
      - title: Readable streams, flowing mode, paused mode, async iteration, object mode, and consumption
        behind_the_scenes: See how adding consumers changes mode, why mixing consumption styles loses predictability, and how async iteration coordinates demand and cleanup.
        practical: Consume a large source with for-await-of and stop early while proving the source is destroyed.
        interview: Compare data events, readable events, pipe, and async iteration.
      - title: Writable streams, highWaterMark, write return values, drain, cork, and backpressure
        behind_the_scenes: Follow writes into internal queues, thresholds signalling producer slowdown, drain notification, batching, and finalization.
        practical: Build a slow destination and prove respecting false from write keeps memory bounded.
        interview: Explain backpressure using queue state and why highWaterMark is a threshold rather than a hard memory cap.
      - title: Transform streams, pipeline, finished, error propagation, cancellation, and composition
        behind_the_scenes: Coordinate multi-stage stream ownership so one failure destroys the chain, completion is awaited, and abort releases every resource.
        practical: Build a gzip file pipeline with AbortSignal, checksums, atomic output, and injected failure.
        interview: Explain why pipeline is safer than manually chaining pipe calls.
      - title: Node streams, Web Streams, adapters, fetch bodies, compression, and interoperability
        behind_the_scenes: Compare Node and WHATWG stream contracts, locking, readers, backpressure strategies, conversion adapters, and fetch body consumption.
        practical: Stream a fetch response through Web and Node transforms without buffering the full payload.
        interview: Explain which stream API a library expects and where adaptation affects error or cancellation behavior.
      - title: File system, file descriptors, promises API, atomic writes, metadata, watching, and race conditions
        behind_the_scenes: Trace path resolution, descriptor ownership, kernel page cache, partial operations, rename-based replacement, metadata, and unreliable watch semantics.
        practical: Implement an atomic configuration write and descriptor-safe read with explicit permissions and cleanup.
        interview: Explain TOCTOU races and why checking existence before opening is unsafe.
      - title: Paths, file URLs, import.meta, cross-platform behavior, traversal, and filesystem boundaries
        behind_the_scenes: Separate opaque filesystem paths from URL semantics, normalize without confusing authorization, and account for platform roots and separators.
        practical: Resolve a user filename beneath an allowed root and reject traversal and encoded boundary escapes.
        interview: Explain why string concatenation and prefix checks are unsafe path controls.
      - title: TCP sockets, net server, connections, framing, half-close, timeouts, and backpressure
        behind_the_scenes: Follow listening sockets, accepted connections, byte-stream framing, kernel buffers, half-close states, idle timeouts, errors, and destruction.
        practical: Build a bounded newline-framed TCP protocol handling split and combined packets safely.
        interview: Explain why one data event does not equal one application message.
      - title: DNS, lookup, resolve, address selection, caching, thread pool, and connection behavior
        behind_the_scenes: Distinguish OS-backed dns.lookup from network DNS queries, result ordering, missing built-in application caching, and connection selection.
        practical: Compare lookup and resolve results, latency, errors, and worker-pool behavior.
        interview: Diagnose a DNS-related latency incident without assuming every DNS API behaves alike.
      - title: TLS, certificates, trust stores, SNI, ALPN, sessions, verification, and secure contexts
        behind_the_scenes: Trace handshake negotiation, certificate-chain and hostname validation, protocol selection, session reuse, and key material ownership.
        practical: Create a local TLS client and server, inspect negotiated parameters, and prove invalid hostname rejection.
        interview: Explain what TLS verifies and why disabling certificate verification is not a fix.
      - title: HTTP server, parser, request, response, headers, keep-alive, timeouts, and connection lifecycle
        behind_the_scenes: Follow bytes through connection acceptance, HTTP parsing, incoming streams, response framing, socket reuse, timeout layers, and close behavior.
        practical: Build a dependency-free JSON endpoint with body limits, validation, deadlines, stable errors, and keep-alive settings.
        interview: Trace one HTTP request and identify slow-header, slow-body, and idle-connection risks.
      - title: Fetch, Undici, connection pools, dispatchers, Web APIs, cancellation, and response consumption
        behind_the_scenes: Understand Node fetch on Undici, origin pooling, streaming bodies, AbortSignal, response resource release, and Web-standard types.
        practical: Build a deadline-bound JSON client that validates status and payload and always consumes or cancels the body.
        interview: Explain why a timed-out Promise must cancel underlying network work and how pooling affects latency.
      - title: HTTP/2, sessions, streams, multiplexing, flow control, headers, and graceful shutdown
        behind_the_scenes: Trace one connection carrying independent streams, per-stream and connection flow control, header compression, errors, GOAWAY, and draining.
        practical: Build a small secure HTTP/2 server and demonstrate concurrent streams plus graceful GOAWAY.
        interview: Compare HTTP/1 keep-alive and HTTP/2 multiplexing without promising automatic application speedups.
      - title: ECMAScript modules, URLs, resolution, loading, caching, top-level await, and customization hooks
        behind_the_scenes: Follow ESM specifiers through URL-based resolution, package rules, linking, evaluation, cache identity, asynchronous graphs, and loader hooks.
        practical: Trace an ESM graph with import.meta, JSON import attributes, a cycle, and top-level await.
        interview: Explain Node ESM resolution differences from CommonJS and bundlers.
      - title: CommonJS, wrapper function, require resolution, module cache, exports, cycles, and initialization
        behind_the_scenes: Understand the per-file wrapper, synchronous loading, cache insertion before evaluation, exports aliasing, extension searching, and partial cyclic exports.
        practical: Reproduce a CommonJS cycle and an exports versus module.exports mistake, then refactor the boundary.
        interview: Explain why clearing require.cache is not a general hot-reload design.
      - title: ESM and CommonJS interoperability, package type, exports, imports, conditions, and dual-package hazards
        behind_the_scenes: Trace format selection, namespace wrapping, conditional entry points, package encapsulation, and duplicated state when consumers load separate implementations.
        practical: Publish one package surface and test ESM and CommonJS consumers against aligned state and types.
        interview: Diagnose ERR_REQUIRE_ESM and the dual-package hazard from the real loader rules.
      - title: Runtime TypeScript, type stripping, erasable syntax, tsconfig limits, module formats, and distribution
        behind_the_scenes: Understand built-in type stripping, absence of type checking, unsupported transform-dependent syntax, ignored tsconfig behavior, and package distribution constraints.
        practical: Run an erasable TypeScript script directly, then compare it with a compiled application and packed library.
        interview: Explain why native TypeScript execution does not replace tsc, runtime validation, or publishing JavaScript.
      - title: Packages, npm, package-lock, semantic versioning, lifecycle scripts, provenance, and supply-chain risk
        behind_the_scenes: Follow dependency resolution, lockfile integrity, installation and lifecycle execution, package contents, transitive graph, and registry identity.
        practical: Audit and pack a minimal package, inspect its dependency graph and artifact, and install it without lifecycle scripts in a clean directory.
        interview: Explain the distinct jobs of package.json, a lockfile, semver ranges, and artifact provenance.
      - title: Configuration, process.env, env files, command-line arguments, secrets, parsing, and startup validation
        behind_the_scenes: Treat strings from environment and argv as untrusted process input, establish precedence, parse once, redact secrets, and fail before readiness.
        practical: Build a dependency-free immutable configuration parser with aggregated errors and safe diagnostics.
        interview: Explain why TypeScript declarations do not validate environment variables.
      - title: Node errors, system errors, causes, codes, operational failures, programmer bugs, and recovery
        behind_the_scenes: Preserve error identity, code and cause across async boundaries, distinguish expected operational conditions from broken invariants, and avoid string matching.
        practical: Create a small error taxonomy and translate filesystem and HTTP failures without losing diagnostic evidence.
        interview: Decide when to retry, reject a request, restart a process, or alert an operator.
      - title: uncaughtException, unhandledRejection, warnings, exit codes, crash policy, and supervisors
        behind_the_scenes: Understand last-resort process events, undefined application state after uncaught failures, synchronous emergency logging, exit status, and external restart ownership.
        practical: Reproduce uncaught and unhandled failures in child processes and verify exit, report, and supervisor behavior.
        interview: Explain why continuing after uncaughtException is unsafe.
      - title: Process lifecycle, signals, readiness, liveness, graceful shutdown, draining, and deadlines
        behind_the_scenes: Coordinate signal delivery, readiness removal, admission stop, connection draining, in-flight deadlines, resource cleanup, and forced exit.
        practical: Build an HTTP process that handles SIGTERM during a slow request and proves bounded graceful shutdown.
        interview: Trace deployment termination without confusing liveness and readiness.
      - title: child_process, spawn, execFile, exec, stdio, IPC, signals, and shell injection
        behind_the_scenes: Compare process creation, shell parsing, buffered versus streaming output, file descriptors, IPC channels, termination, and orphan risk.
        practical: Run an external tool with spawn or execFile, bounded output, timeout, AbortSignal, and no shell interpolation.
        interview: Choose the correct child-process API and explain command-injection prevention.
      - title: worker_threads, message ports, structured clone, transfer lists, SharedArrayBuffer, and Atomics
        behind_the_scenes: Run separate V8 isolates in one process, exchange cloned or transferred data, share memory deliberately, and coordinate worker lifecycle and failure.
        practical: Move a CPU calculation to a reusable worker and measure transfer, clone, computation, and event-loop responsiveness.
        interview: Explain when worker threads help and why one worker per request is usually wasteful.
      - title: Cluster, processes, replicas, load balancing, IPC, shared ports, and failure isolation
        behind_the_scenes: Compare cluster-managed workers with independent process replicas, OS or proxy load balancing, memory isolation, rolling replacement, and IPC.
        practical: Measure one multi-process server and document why an external orchestrator may own replication instead.
        interview: Choose cluster or external replicas based on deployment ownership rather than CPU count alone.
      - title: Background jobs, durable queues, idempotency, retries, backoff, dead letters, and CPU work
        behind_the_scenes: Separate in-process concurrency from durable delivery, model at-least-once execution, claim idempotency keys, bound attempts, and record terminal failures.
        practical: Implement an in-memory worker only as a local model, then specify the persistence and recovery needed in production.
        interview: Explain why setImmediate, a worker thread, and a durable queue solve different problems.
      - title: Node test runner, assertions, mocking, timers, concurrency, coverage, and isolation
        behind_the_scenes: Understand test discovery, subprocess or thread isolation, mock restoration, timer control, async completion, concurrency, and built-in coverage.
        practical: Test an abortable HTTP client and process lifecycle using node:test without third-party frameworks.
        interview: Choose unit, integration, process, and contract tests for a Node service.
      - title: Node security, permission model, validation, injection, SSRF, path traversal, and least privilege
        behind_the_scenes: Treat filesystem, network, child-process, module, deserialization, and secret access as authority boundaries and use runtime permissions as defense in depth.
        practical: Harden an HTTP-to-file workflow with schema, URL, path, size, timeout, and permission controls.
        interview: Threat-model a Node service beyond dependency scanning.
      - title: diagnostics_channel, AsyncLocalStorage, structured logging, metrics, traces, and observability
        behind_the_scenes: Correlate operations without patching libraries, subscribe to stable diagnostic channels, propagate context, and control telemetry cardinality and secret leakage.
        practical: Instrument one HTTP request and outbound fetch with request ID, latency, outcome, and trace linkage.
        interview: Distinguish logs, metrics, and traces and explain context propagation.
      - title: perf_hooks, eventLoopUtilization, monitorEventLoopDelay, marks, measures, and capacity evidence
        behind_the_scenes: Measure wall-clock spans, histogrammed loop delay, active versus idle loop time, observer overhead, and workload saturation.
        practical: Establish a baseline, inject blocking and I/O load, and compare throughput, latency percentiles, utilization, and delay.
        interview: Explain why CPU percentage alone cannot diagnose Node responsiveness.
      - title: Memory, V8 heap, external memory, RSS, garbage collection, heap snapshots, and leaks
        behind_the_scenes: Separate V8 heap spaces, Buffer and native allocations, resident memory, reachability, collector behavior, and retaining paths.
        practical: Reproduce listener and cache leaks, compare memory counters, capture snapshots, and identify the retaining edge.
        interview: Diagnose rising RSS with a flat JavaScript heap and explain why increasing heap limits is not a fix.
      - title: CPU profiles, inspector, trace events, diagnostic reports, flame graphs, and incident evidence
        behind_the_scenes: Sample stacks, expose inspector protocol, record runtime events, capture fatal-process state, and correlate profiles with representative load.
        practical: Diagnose one blocking endpoint using a CPU profile, trace, report, and minimal reproduction.
        interview: Walk through a Node performance incident from symptom to causal evidence.
      - title: Native addons, Node-API, ABI stability, WebAssembly, FFI, ownership, and failure boundaries
        behind_the_scenes: Cross from JavaScript into native execution with conversion, lifetime, thread-safety, ABI, blocking, and crash implications.
        practical: Compare a WebAssembly function and a Node-API boundary and document memory and error ownership.
        interview: State when native code is justified and how it changes reliability and deployment risk.
      - title: Node.js service architecture, dependency direction, concurrency budgets, overload, resilience, and operations
        behind_the_scenes: Keep domain policy independent, validate adapters, budget sockets and work, propagate deadlines, shed overload, and make lifecycle ownership observable.
        practical: Refactor a service into a small functional core with HTTP, storage, queue, telemetry, and clock adapters.
        interview: Defend architecture through failure containment, change cost, capacity evidence, and recovery.
      - title: Node.js production architecture capstone, API, streaming, workers, reliability, security, and observability
        behind_the_scenes: Join event-loop behavior, streams, HTTP, modules, workers, validation, cancellation, error policy, shutdown, diagnostics, and capacity in one operated system.
        practical: Build a dependency-free ingestion service with bounded streaming, optional worker offload, stable errors, tests, metrics, profiles, and a runbook.
        interview: Trace success, malformed input, slow clients, overload, cancellation, worker failure, memory growth, deployment drain, and recovery.

  - id: python
    title: Python Complete Deep Dive
    tier: core
    goal: Master Python from its execution and object models through typing, concurrency, memory, packaging, security, testing, performance, and production architecture.
    topics:
      - title: Python setup, interpreters, REPL, scripts, virtual environments, and workflow
        behind_the_scenes: Trace source text through tokenization, parsing, bytecode compilation, module execution, pycache reuse, interpreter selection, and environment isolation.
        practical: Create a version-pinned project, inspect bytecode and interpreter paths, and prove that its dependencies are isolated.
        interview: Explain what happens from running a Python file to executing its first statement and why environment drift occurs.
      - title: Execution model, code blocks, frames, namespaces, scopes, and name resolution
        behind_the_scenes: Follow a name through local, enclosing, global, and builtins scopes while distinguishing compile-time scope analysis from runtime namespace lookup.
        practical: Inspect frames and closures, reproduce UnboundLocalError, and fix a scope design without using global state.
        interview: Explain LEGB, local-variable determination, closures, global, nonlocal, and why assignment changes name resolution.
      - title: Objects, identity, type, value, references, mutability, and aliasing
        behind_the_scenes: Understand that names bind to objects, assignment copies references, mutation changes an object, and identity, type, and value are distinct properties.
        practical: Build an aliasing experiment with nested mutable and immutable containers and diagram every reference before and after mutation.
        interview: Explain identity versus equality, pass-by-sharing, shallow copies, and the mutable-default trap.
      - title: Numbers, booleans, None, truthiness, floating point, Decimal, and arithmetic
        behind_the_scenes: Compare arbitrary-precision integers, binary floating-point representation, numeric coercion, rich comparison, truth-value testing, and decimal contexts.
        practical: Implement money and measurement calculations with explicit rounding and tests for floating-point edge cases.
        interview: Explain why 0.1 plus 0.2 is surprising, why bool is an int subtype, and when Decimal is appropriate.
      - title: Strings, Unicode, bytes, bytearray, encoding, and text boundaries
        behind_the_scenes: Distinguish Unicode code points from encoded bytes, trace encode and decode operations, and understand normalization and malformed-input policies.
        practical: Build a file and HTTP text boundary that handles UTF-8, invalid bytes, normalization, and binary payloads explicitly.
        interview: Explain str versus bytes, mojibake, Unicode normalization, and where encoding should happen.
      - title: Lists, tuples, ranges, slicing, unpacking, copying, and sequence costs
        behind_the_scenes: Study dynamic-array growth, immutable tuple structure, slice allocation, extended unpacking, reference copying, and operation complexity.
        practical: Benchmark append, front insertion, slicing, and deque alternatives while fixing a nested shallow-copy bug.
        interview: Compare list and tuple, explain slice semantics, and state the complexity of common sequence operations.
      - title: Dictionaries, sets, hashing, equality, collisions, and insertion order
        behind_the_scenes: Trace key hashing, equality checks, collision resolution, resizing, insertion-order preservation, and the invariant required of hashable objects.
        practical: Design a hashable domain key, reproduce a broken hash-equality contract, and profile membership against a list.
        interview: Explain dictionary lookup, why mutable keys are unsafe, and the relationship between __eq__ and __hash__.
      - title: Control flow, loops, comprehensions, assignment expressions, and pattern matching
        behind_the_scenes: Understand truth tests, iterator-driven loops, comprehension scope, short-circuiting, match pattern selection, guards, and variable binding.
        practical: Implement and test a small command parser using structural pattern matching, guards, and readable comprehensions.
        interview: Explain for-else, comprehension scope, walrus tradeoffs, and pattern matching versus dictionary dispatch.
      - title: Functions, parameters, defaults, positional-only, keyword-only, args, and kwargs
        behind_the_scenes: Follow argument binding against a function signature and learn when default objects are created and retained.
        practical: Design a stable public function API, inspect its signature, and demonstrate safe sentinels instead of mutable defaults.
        interview: Explain Python parameter kinds, argument binding errors, and why default values persist across calls.
      - title: First-class functions, closures, lambdas, partials, and callable objects
        behind_the_scenes: Inspect function objects, code objects, closure cells, late binding, descriptors that bind methods, and __call__ dispatch.
        practical: Build configurable validators using closures, functools.partial, and callable objects, then compare their state and introspection.
        interview: Explain closure capture, late binding, first-class callables, and when a callable class is clearer.
      - title: Exceptions, chaining, custom errors, groups, notes, cleanup, and failure design
        behind_the_scenes: Trace stack unwinding, handler matching, exception context and cause, ExceptionGroup splitting, finally execution, and traceback retention.
        practical: Design a domain error hierarchy, preserve root causes, handle concurrent failures, and expose safe error messages.
        interview: Explain raise from, exception chaining, finally behavior, and when not to catch Exception.
      - title: Modules, packages, imports, sys.modules, finders, loaders, and circular imports
        behind_the_scenes: Follow import through cache lookup, meta path finders, module creation, early sys.modules insertion, loader execution, and package resolution.
        practical: Build a package, inspect its import trace, reproduce a circular import, and refactor ownership to remove the cycle.
        interview: Explain import caching, __name__, __main__, relative imports, and partially initialized modules.
      - title: Classes, instances, attributes, methods, classmethods, staticmethods, and binding
        behind_the_scenes: Trace class-body execution, instance construction, attribute storage, function descriptor binding, and class versus instance lookup.
        practical: Implement a domain entity with alternate constructors and prove how bound methods pass self and cls.
        interview: Explain __new__ versus __init__, bound methods, class attributes, and staticmethod tradeoffs.
      - title: Inheritance, composition, MRO, super, abstract base classes, and mixins
        behind_the_scenes: Study C3 linearization, cooperative method dispatch, abstract-method enforcement, virtual subclasses, and the fragility of shared mutable inheritance.
        practical: Diagnose a diamond hierarchy, make super calls cooperative, then redesign a second version with composition.
        interview: Explain Python's MRO, zero-argument super, ABCs, mixins, and composition over inheritance.
      - title: Data model, special methods, operators, containers, representations, and protocols
        behind_the_scenes: Connect syntax such as len, iteration, comparison, containment, arithmetic, calls, and with statements to their special-method dispatch.
        practical: Implement a small immutable collection with iteration, containment, equality, ordering, repr, and a deliberate unsupported operation.
        interview: Explain duck typing, NotImplemented, __repr__ versus __str__, and why special methods are looked up on the type.
      - title: Attribute lookup, descriptors, properties, slots, __getattribute__, and __getattr__
        behind_the_scenes: Follow the descriptor precedence rules across data descriptors, instance dictionaries, non-data descriptors, classes, and fallback hooks.
        practical: Implement a validating descriptor and lazy non-data descriptor, then trace lookup with and without __slots__.
        interview: Explain how property works, data versus non-data descriptors, slots tradeoffs, and recursion in __getattribute__.
      - title: Dataclasses, named tuples, enums, frozen models, and value objects
        behind_the_scenes: Understand generated methods, field discovery, factories, equality and hash decisions, pattern-matching metadata, and the limits of frozen objects.
        practical: Model an immutable money value and command DTO with validation, serialization boundaries, and invariant-focused tests.
        interview: Compare dataclass, NamedTuple, Enum, regular classes, and runtime validation models.
      - title: Iterables, iterators, next, StopIteration, sentinel iteration, and lazy traversal
        behind_the_scenes: Trace iter and next dispatch, stateful iterator exhaustion, iterable reuse, sentinel call iteration, and protocol-based loops.
        practical: Implement restartable and single-use traversal types, then prove memory behavior on a large input.
        interview: Distinguish iterable and iterator and explain how a for loop consumes both.
      - title: Generators, yield, generator frames, send, throw, close, and delegation
        behind_the_scenes: Follow suspension and resumption through a preserved frame, value injection, exception injection, GeneratorExit, return values, and yield from delegation.
        practical: Build a streaming parser with generator cleanup and a delegated pipeline that propagates errors correctly.
        interview: Explain generator state, yield versus return, yield from, and deterministic generator cleanup.
      - title: Comprehensions, generator expressions, itertools, laziness, and streaming pipelines
        behind_the_scenes: Compare eager container construction with pull-based lazy evaluation, iterator fusion, buffering helpers, one-shot consumption, and infinite streams.
        practical: Process a large event stream with itertools while measuring peak memory against an eager implementation.
        interview: Explain generator expressions, laziness tradeoffs, iterator exhaustion, and hidden buffering.
      - title: Decorators, wrappers, functools.wraps, parameters, stacking, and registration
        behind_the_scenes: Treat decoration as definition-time function replacement and trace closure state, descriptor binding, metadata copying, and bottom-up stacking order.
        practical: Build typed timing, retry, and registry decorators while preserving signatures and avoiding duplicate side effects.
        interview: Explain decorator execution order, wraps, decorator factories, and why retries require idempotency.
      - title: Context managers, with, contextlib, ExitStack, async context, and cleanup
        behind_the_scenes: Follow __enter__, __exit__, exception suppression, nested reverse-order cleanup, generator-based managers, and asynchronous resource finalization.
        practical: Manage a dynamic set of files and locks with ExitStack and prove cleanup under success, failure, and cancellation.
        interview: Explain the context-manager protocol, exception suppression, and why deterministic cleanup beats finalizers.
      - title: Type hints, unions, narrowing, aliases, Literal, Never, and static analysis
        behind_the_scenes: Separate runtime annotations from a type checker's model, understand control-flow narrowing, gradual typing, lazy annotation evaluation, and unsound escape hatches.
        practical: Type a parsing boundary with discriminated outcomes and run strict static checks against intentional failures.
        interview: Explain that hints are not runtime validation, Any versus object, Optional, narrowing, and exhaustive checks.
      - title: Generics, type parameters, protocols, variance, overloads, and ParamSpec
        behind_the_scenes: Model relationships between types using bounded parameters, structural subtyping, variance rules, overload signatures, callable parameter forwarding, and type erasure.
        practical: Build a generic repository and typed decorator using Protocol and ParamSpec, then test substitutability with a checker.
        interview: Explain covariance and contravariance, Protocol versus ABC, overloads, and invariant mutable containers.
      - title: Runtime validation, parsing, schemas, serialization, and typed API boundaries
        behind_the_scenes: Distinguish trusted in-process values from untrusted wire data and trace parsing, normalization, validation errors, domain construction, and output serialization.
        practical: Build a dependency-light validation boundary and compare it with a schema library without treating annotations as checks.
        interview: Explain parsing versus casting, DTO versus domain model, coercion risk, and where schema validation belongs.
      - title: Standard library, pathlib, files, JSON, CSV, datetime, zones, and resources
        behind_the_scenes: Understand text versus binary I/O, buffering, atomic replacement, JSON type loss, CSV dialects, aware datetimes, zone rules, and package resources.
        practical: Build an atomic import-export tool that handles encodings, malformed records, time zones, and cleanup.
        interview: Explain naive versus aware datetime, pathlib benefits, file buffering, and safe atomic writes.
      - title: Regular expressions, parsing, subprocesses, environment, signals, and OS boundaries
        behind_the_scenes: Trace regex backtracking, process creation, argument vectors, pipes, exit status, environment inheritance, signal delivery, and shell interpretation.
        practical: Build a bounded subprocess runner with timeouts, captured output, safe arguments, and graceful termination.
        interview: Explain catastrophic backtracking, shell injection, deadlocked pipes, and process signal handling.
      - title: Asyncio event loop, coroutines, awaitables, tasks, futures, and cooperative scheduling
        behind_the_scenes: Follow a coroutine from creation through task scheduling, suspension at await, readiness callbacks, selector events, resumption, and result storage.
        practical: Build an instrumented concurrent fetch simulator and prove that one blocking call stalls every task on the loop.
        interview: Explain the event loop, coroutine versus task versus future, and why async is concurrency rather than automatic parallelism.
      - title: TaskGroup, cancellation, timeouts, queues, semaphores, and backpressure
        behind_the_scenes: Study structured concurrency, cancellation injection, timeout transformation, exception aggregation, bounded queues, permits, and shutdown coordination.
        practical: Build a bounded worker pipeline that survives partial failure, cancels cleanly, and never admits unlimited work.
        interview: Explain cancellation propagation, TaskGroup failure semantics, backpressure, and why gather can be the wrong ownership model.
      - title: Threads, the GIL, locks, conditions, thread safety, and free-threaded builds
        behind_the_scenes: Distinguish OS thread scheduling from interpreter locking, understand when native work releases the GIL, and examine synchronization requirements in regular and free-threaded builds.
        practical: Reproduce a race, protect an invariant with a lock, and compare I/O throughput and CPU work across thread configurations.
        interview: Explain what the GIL does and does not guarantee, race conditions, deadlocks, and the implications of optional free-threaded Python.
      - title: Multiprocessing, process pools, IPC, shared memory, start methods, and pickling
        behind_the_scenes: Follow worker creation, state transfer, serialization, pipes and queues, result collection, process isolation, and platform-specific start behavior.
        practical: Parallelize a CPU-bound task, measure serialization overhead, and shut the pool down after a worker failure.
        interview: Compare fork, spawn, and forkserver, explain picklability, and identify when process overhead dominates.
      - title: Concurrency selection, async, threads, processes, executors, and distributed workers
        behind_the_scenes: Map workload wait states, CPU demand, isolation, cancellation, queueing, memory, failure ownership, and durability to the right concurrency boundary.
        practical: Implement the same mixed workload three ways, measure it, and write an architecture decision using latency and failure evidence.
        interview: Choose among async, threads, processes, and a durable queue for concrete workloads and defend the tradeoff.
      - title: Memory management, reference counting, cyclic GC, weak references, and finalization
        behind_the_scenes: Study object reachability, CPython reference counts, generational cycle detection, weak-reference callbacks, finalizers, resurrection, and implementation differences.
        practical: Create and diagnose a reference cycle, observe collection, replace a cache with weak references, and prove explicit resource cleanup.
        interview: Explain reference counting versus cyclic GC and why code must not depend on immediate finalization.
      - title: Copying, serialization, pickle, JSON, object graphs, and trust boundaries
        behind_the_scenes: Compare shallow and deep traversal, identity preservation, recursive graphs, reduction protocols, version compatibility, and code execution during deserialization.
        practical: Fix an aliasing defect and design a safe versioned JSON format instead of unpickling untrusted input.
        interview: Explain copy versus deepcopy, pickle risks, schema evolution, and identity in serialized graphs.
      - title: Performance, complexity, profiling, benchmarking, caching, and optimization
        behind_the_scenes: Separate algorithmic cost, interpreter overhead, allocation, I/O waits, cache behavior, warmup, variance, and observer effects.
        practical: Profile a slow pipeline with cProfile, tracemalloc, and timeit, then optimize the measured bottleneck and report the before-and-after evidence.
        interview: Explain a disciplined Python optimization workflow and why microbenchmarks can mislead.
      - title: Testing, unittest, pytest concepts, fixtures, mocking, properties, and determinism
        behind_the_scenes: Understand test discovery, isolation, fixture lifetimes, dependency seams, mock call recording, generated cases, random seeds, and flaky shared state.
        practical: Test a service with unit, contract, property, and failure-path tests while minimizing mocks at stable boundaries.
        interview: Explain fixture scope, mocks versus fakes, property-based testing, and how to diagnose flaky tests.
      - title: Debugging, tracebacks, pdb, logging, warnings, metrics, and observability
        behind_the_scenes: Follow frames and exception metadata through tracebacks, debugger hooks, LogRecord creation, handler propagation, warning filters, and contextual correlation.
        practical: Diagnose a failing concurrent service using breakpoint conditions, structured logs, warnings, metrics, and a minimal reproduction.
        interview: Walk through evidence-first debugging and explain logging hierarchy, exception information, and high-cardinality risks.
      - title: Packaging, pyproject.toml, build backends, source distributions, wheels, and metadata
        behind_the_scenes: Trace a frontend build request through a PEP 517 backend into an sdist or wheel and understand metadata, tags, installation, and import-package layout.
        practical: Package a src-layout typed library, build its sdist and wheel, inspect both artifacts, and install the wheel into a clean environment.
        interview: Explain pyproject.toml, build frontend versus backend, sdist versus wheel, and distribution names versus import names.
      - title: Dependencies, virtual environments, lock files, reproducibility, publishing, and supply chain
        behind_the_scenes: Understand environment prefixes, resolver inputs, transitive graphs, version constraints, hashes, lock semantics, indexes, provenance, and reproducible installation limits.
        practical: Produce a locked application environment, verify hashes and dependency provenance, scan artifacts, and rehearse a safe package release.
        interview: Explain why a virtual environment is not a lock file and how to reduce dependency-confusion and compromised-package risk.
      - title: Native extensions, C API, stable ABI, FFI, buffer protocol, and performance boundaries
        behind_the_scenes: Understand extension-module loading, reference ownership, Python-to-native conversion, ABI compatibility, buffer sharing, GIL transitions, and crash containment limits.
        practical: Call a small native library through ctypes or cffi, validate inputs, benchmark copying, and document ownership and failure risks.
        interview: Explain when native code helps, the stable ABI tradeoff, reference-count bugs, and zero-copy buffer boundaries.
      - title: Architecture, modules, domain boundaries, dependency inversion, configuration, and errors
        behind_the_scenes: Connect import direction, dependency graphs, pure domain logic, adapters, configuration loading, resource lifetimes, and stable error contracts.
        practical: Refactor a coupled script into a package with domain, application, and adapter boundaries plus dependency-injected tests.
        interview: Explain how to structure a Python service so framework, database, and vendor details do not own the domain.
      - title: Python security, validation, secrets, deserialization, injection, dependencies, and hardening
        behind_the_scenes: Model trust boundaries around input parsing, command and query construction, dynamic execution, filesystem access, secret handling, logs, dependencies, and resource exhaustion.
        practical: Threat-model and harden a CLI or service against injection, unsafe deserialization, path traversal, secret leakage, and denial-of-service inputs.
        interview: Identify Python-specific security failure modes and distinguish validation, escaping, parameterization, authorization, and sandboxing.
      - title: Python production architecture capstone, contracts, concurrency, tests, packaging, and operations
        behind_the_scenes: Trace one production request or job across configuration, validation, domain logic, persistence, concurrency, cleanup, logging, packaging, deployment, and graceful shutdown.
        practical: Build and document a typed production service slice with bounded work, stable errors, complete tests, a wheel, profiles, security evidence, and an incident runbook.
        interview: Defend the architecture, runtime behavior, failure handling, performance evidence, and deployment strategy in a senior-level system-design discussion.

  - id: fastapi
    title: FastAPI Complete Deep Dive
    tier: core
    goal: Master FastAPI from ASGI internals through typed contracts, security, data, testing, observability, and production deployment.
    topics:
      - title: FastAPI setup, CLI, project anatomy, typing, and development workflow
        behind_the_scenes: Trace an application import through the FastAPI CLI, Uvicorn process, module cache, reload watcher, route registration, and generated documentation.
        practical: Create a strict typed project, run development and production commands, inspect the route table, and document the import path and process model.
        interview: Separate responsibilities among Python, FastAPI, Starlette, Pydantic, AnyIO, Uvicorn, and the ASGI server process.
      - title: ASGI scope, receive, send, Uvicorn, Starlette, and request lifecycle
        behind_the_scenes: Follow one HTTP connection through ASGI scope creation, request events, middleware, routing, dependency solving, endpoint execution, response events, and disconnect.
        practical: Write a tiny raw ASGI application and middleware, then compare its event trace with the same request handled by FastAPI.
        interview: Explain the ASGI callable contract and how it enables HTTP concurrency and WebSockets.
      - title: FastAPI application configuration, metadata, docs, and OpenAPI lifecycle
        behind_the_scenes: Understand application construction, route registration timing, OpenAPI schema caching, documentation UIs, operation IDs, lifespan ownership, and application state.
        practical: Configure metadata, docs URLs, tags, contact and license details, deterministic operation IDs, and a schema build check.
        interview: Explain when the OpenAPI schema is built and why mutating routes after startup is dangerous.
      - title: Path operations, HTTP methods, routing order, status codes, and semantics
        behind_the_scenes: Trace decorator registration into Starlette routes, ordered matching, method dispatch, automatic HEAD or OPTIONS behavior, and response status selection.
        practical: Build resource-oriented create, read, replace, patch, and delete operations and verify routing conflicts and HTTP semantics.
        interview: Defend method and status-code choices and diagnose why a dynamic route shadows a fixed path.
      - title: Path parameters, converters, enums, UUIDs, dates, and validation
        behind_the_scenes: Follow path text through route matching, Python annotation inspection, Pydantic conversion, error accumulation, endpoint arguments, and OpenAPI parameter schemas.
        practical: Build typed paths using integers, UUIDs, enums, and constrained values, then exercise successful and invalid requests.
        interview: Explain the boundary between router-level matching and Pydantic-level validation.
      - title: Query parameters, headers, cookies, aliases, lists, and reusable filters
        behind_the_scenes: Understand repeated values, absence versus null, alias conversion, header normalization, cookie extraction, annotated constraints, and schema generation.
        practical: Implement pagination and filter objects with bounded lists, aliases, headers, and cookies while testing duplicate and malformed input.
        interview: Model optional query parameters precisely and explain why unbounded pagination is an operational defect.
      - title: Pydantic request bodies, nested models, unions, validators, and strict boundaries
        behind_the_scenes: Trace bytes through content-type parsing, JSON decoding, model validation, coercion or strictness, nested error locations, and typed endpoint arguments.
        practical: Design nested create and patch contracts with discriminated unions, field and model validators, examples, and adversarial payload tests.
        interview: Explain why Python type hints alone do not validate external JSON and where coercion can surprise clients.
      - title: Forms, files, UploadFile, multipart parsing, and size boundaries
        behind_the_scenes: Understand URL-encoded and multipart framing, parser spooling, UploadFile storage, asynchronous file interfaces, content-type trust, and resource exhaustion risks.
        practical: Build a metadata and file upload endpoint with streaming inspection, size limits, media validation, cleanup, and malformed multipart tests.
        interview: Compare bytes and UploadFile and explain how to prevent memory exhaustion and unsafe file handling.
      - title: Response models, serialization, filtering, aliases, and output contracts
        behind_the_scenes: Follow returned objects through response-model validation, field filtering, alias handling, JSON-compatible encoding, response-class rendering, and OpenAPI documentation.
        practical: Separate input, persistence, and public output models so secrets cannot leak even when domain objects contain them.
        interview: Explain why response models are security boundaries rather than documentation-only types.
      - title: Response classes, streaming, files, redirects, cookies, and headers
        behind_the_scenes: Understand Response bypass paths, media types, content length, iterators and backpressure, file transfer, background cleanup, header mutation, and cookie attributes.
        practical: Return JSON, streamed CSV, a ranged file, a redirect, cache headers, and a secure cookie while verifying wire-level behavior.
        interview: Choose between returning data and returning a Response directly and describe what validation is bypassed.
      - title: HTTPException, validation errors, exception handlers, and stable error contracts
        behind_the_scenes: Trace raised exceptions through middleware, registered handlers, request-validation normalization, debug behavior, and final response encoding.
        practical: Implement a consistent problem-details error format with domain mappings, correlation IDs, validation detail, and safe production messages.
        interview: Separate expected client errors, domain failures, and unexpected defects without hiding operational evidence.
      - title: Request and Response objects, state, disconnects, and low-level access
        behind_the_scenes: Explore Starlette request streams, client and URL metadata, request state, response mutation, disconnect detection, and the tradeoff of bypassing typed extraction.
        practical: Add correlation state, inspect streaming request bodies safely, detect disconnects, and set conditional response headers.
        interview: Explain when direct Request access is justified and what contract information it removes from OpenAPI.
      - title: Depends, Annotated, dependency caching, and dependency graph solving
        behind_the_scenes: Follow signature inspection into a directed dependency graph, request-scoped result caching, topological execution, validation, and value injection.
        practical: Compose pagination, tenant, and service dependencies with Annotated aliases and prove which nodes execute once per request.
        interview: Explain that FastAPI dependencies are graph nodes rather than a general-purpose container.
      - title: Yield dependencies, cleanup scopes, exceptions, and resource ownership
        behind_the_scenes: Trace generator dependencies through entry, endpoint execution, response production, nested LIFO cleanup, scope selection, and exception propagation.
        practical: Manage a session and lock with nested yield dependencies, deliberately fail each phase, and verify cleanup ordering.
        interview: Place transaction commit or rollback correctly and explain why cleanup timing matters for streaming responses.
      - title: Callable dependencies, classes, factories, router dependencies, and overrides
        behind_the_scenes: Understand callable instance signatures, parameterized dependency factories, decorator-only dependencies, global and router graphs, cache keys, and test overrides.
        practical: Build reusable authorization and feature-flag dependencies at application, router, and operation scopes with isolated overrides.
        interview: Choose dependency placement without creating invisible behavior or import-time singletons.
      - title: Dependency injection architecture, service boundaries, and domain isolation
        behind_the_scenes: Separate framework graph construction from application orchestration, domain rules, persistence ports, adapters, and transaction ownership.
        practical: Implement one vertical feature slice where FastAPI handles transport while a framework-independent service owns the use case.
        interview: Defend layering through testability and change cost instead of repository-pattern ceremony.
      - title: Settings, environment configuration, secrets, validation, and process boundaries
        behind_the_scenes: Trace environment and secret sources into validated settings, caching, import timing, worker memory, test overrides, and redaction requirements.
        practical: Build typed settings for development, test, and production with secret injection, startup validation, and no credentials in logs or images.
        interview: Explain configuration precedence, fail-fast behavior, and why settings objects should not be rebuilt per request.
      - title: Lifespan, startup, shutdown, shared resources, and application state
        behind_the_scenes: Follow the ASGI lifespan protocol, resource initialization, readiness, yield boundary, shutdown cancellation, worker independence, and legacy event compatibility.
        practical: Initialize and close an HTTP client, database engine, and model resource with failure-safe lifespan code and lifecycle tests.
        interview: Explain why every worker runs its own lifespan and how startup failures should affect readiness.
      - title: async def, def, thread pools, blocking calls, and event-loop health
        behind_the_scenes: Understand coroutine execution, AnyIO thread-pool offloading for synchronous dependencies or endpoints, capacity limits, the GIL, and event-loop starvation.
        practical: Compare async I/O, blocking I/O inside async code, synchronous endpoints, and CPU work while measuring event-loop delay and throughput.
        interview: Diagnose why an async endpoint can still block the whole worker and select an appropriate execution boundary.
      - title: Cancellation, timeouts, task groups, disconnects, and structured concurrency
        behind_the_scenes: Trace cancellation from server or client through awaits, timeout scopes, child tasks, cleanup, exception groups, and response abandonment.
        practical: Run bounded parallel upstream calls with AnyIO task groups, deadlines, partial failure policy, and client-disconnect cancellation.
        interview: Explain why creating untracked background asyncio tasks inside a request is unsafe.
      - title: Async SQLAlchemy sessions, engines, connection pools, and request scope
        behind_the_scenes: Follow a request from session acquisition through pool checkout, implicit transaction, query await, identity map, close, and connection return.
        practical: Configure an async engine and session dependency with pool limits, timeouts, typed queries, and pool-saturation tests.
        interview: Relate worker concurrency to pool capacity and diagnose connection leaks or long-held transactions.
      - title: Transactions, unit of work, commit, rollback, retries, and consistency
        behind_the_scenes: Define the transaction owner, follow flush versus commit, rollback on failure, isolation anomalies, retry boundaries, and post-commit side effects.
        practical: Implement an atomic use case with uniqueness conflicts, rollback, safe retry, and an outbox record in the same transaction.
        interview: Explain why committing inside repository methods breaks multi-step invariants.
      - title: BackgroundTasks, durable jobs, idempotency, queues, and outbox delivery
        behind_the_scenes: Distinguish in-process post-response tasks from durable queue workers, process crashes, retries, duplicate delivery, idempotency records, and transactional outboxes.
        practical: Implement a small post-response notification and a separate durable job flow with idempotency keys and replay tests.
        interview: Explain when BackgroundTasks is insufficient and how to avoid acknowledging work before it is durable.
      - title: OAuth2, password hashing, bearer tokens, JWT validation, and identity
        behind_the_scenes: Trace credential submission, password verification, token issuance, signature and claim validation, clock checks, user lookup, and authentication failure.
        practical: Implement a standards-aligned token flow with modern password hashing, short-lived access tokens, key rotation seams, and negative tests.
        interview: Explain what a signed JWT proves, what it does not encrypt, and how revocation or rotation changes the design.
      - title: Security scopes, authorization, tenant boundaries, and object permissions
        behind_the_scenes: Separate scheme declaration, SecurityScopes aggregation, authenticated principal construction, role or scope checks, object ownership, and database enforcement.
        practical: Enforce scope and tenant-aware resource authorization with tests for cross-tenant identifiers and confused-deputy paths.
        interview: Diagnose insecure direct-object references and explain why authentication alone never authorizes a resource.
      - title: Cookie sessions, CSRF, SameSite, secure attributes, and browser clients
        behind_the_scenes: Follow cookies through browser attachment rules, origin and site distinctions, session lookup or signing, CSRF attack paths, rotation, expiry, and logout.
        practical: Build a secure cookie session flow with CSRF defense, SameSite behavior, HTTPS-only attributes, rotation, and browser-level tests.
        interview: Compare bearer tokens and cookie sessions and explain when CSRF becomes relevant.
      - title: CORS, trusted hosts, HTTPS redirects, proxy headers, and origin policy
        behind_the_scenes: Trace browser preflight, middleware decisions, credential rules, host validation, TLS termination, forwarded metadata, and trusted-proxy boundaries.
        practical: Configure explicit production origins, hosts, HTTPS behavior, and proxy trust, then test hostile Origin and Host headers.
        interview: Explain why CORS is a browser policy rather than authentication and why wildcard credentials are unsafe.
      - title: HTTP middleware, pure ASGI middleware, ordering, context, and request IDs
        behind_the_scenes: Follow nested middleware call order, ServerError and Exception middleware, BaseHTTPMiddleware limitations, context-variable propagation, streaming, and response finalization.
        practical: Implement pure ASGI request-ID and timing middleware that preserves streaming and exception behavior.
        interview: Draw middleware execution order and explain why body buffering or misplaced error handling causes production defects.
      - title: API security hardening, rate limits, body limits, audit logs, and abuse controls
        behind_the_scenes: Model trust boundaries, malformed bodies, request smuggling surfaces, injection, brute force, replay, resource exhaustion, dependency risk, and audit integrity.
        practical: Threat-model an API and add size limits, rate and concurrency limits, safe parsing, authorization tests, security headers, and redacted audit events.
        interview: Prioritize layered controls for a public endpoint and explain which protections belong at the proxy, application, and data layers.
      - title: OpenAPI schemas, documentation customization, examples, and client generation
        behind_the_scenes: Understand Pydantic JSON Schema generation, FastAPI operation assembly, component reuse, schema caching, OpenAPI 3.1 output, custom extensions, and client compatibility.
        practical: Publish a deterministic schema with examples and error models, generate a typed client, and gate incompatible schema changes in CI.
        interview: Explain how implementation annotations become a contract and why generated docs do not replace contract governance.
      - title: OpenAPI callbacks, webhooks, external events, and delivery contracts
        behind_the_scenes: Distinguish callback expressions from named webhooks, documentation from execution, subscriber registration, signing, retry, ordering, and duplicate delivery.
        practical: Document a webhook, implement signed delivery with an outbox and retry policy, and build an idempotent receiver test harness.
        interview: Design a webhook contract that remains correct under retries, delays, duplicates, and secret rotation.
      - title: APIRouter, multi-file applications, sub-applications, mounts, and root paths
        behind_the_scenes: Trace router inclusion and prefix composition, dependency and tag propagation, mounted ASGI isolation, OpenAPI separation, proxy path stripping, and root_path.
        practical: Split a service by feature, mount an internal sub-application and static assets, and verify URLs and docs behind a path-rewriting proxy.
        interview: Compare include_router with mount and diagnose broken documentation URLs behind a proxy.
      - title: WebSockets, handshake, connection management, dependencies, and backpressure
        behind_the_scenes: Follow the HTTP upgrade into ASGI websocket events, accept or close decisions, message loops, disconnects, per-connection state, broadcast fan-out, and slow consumers.
        practical: Build an authenticated WebSocket channel with bounded outbound queues, heartbeat, disconnect cleanup, and multi-client tests.
        interview: Explain how WebSocket lifecycle and scaling differ from stateless HTTP requests.
      - title: Server-sent events, StreamingResponse, generators, disconnects, and buffering
        behind_the_scenes: Understand chunked HTTP responses, async generator suspension, proxy buffering, heartbeat frames, cancellation, cleanup, and backpressure limits.
        practical: Stream typed server events with heartbeats, disconnect detection, proxy-safe headers, and a cancellation test.
        interview: Choose among SSE, WebSockets, polling, and ordinary streaming based on directionality and operational cost.
      - title: Static files, templates, HTML responses, and GraphQL integration boundaries
        behind_the_scenes: Separate ASGI mounts, template rendering and escaping, cacheable assets, browser security, and GraphQL execution mounted alongside REST.
        practical: Serve hashed static assets and an escaped template, then mount a minimal GraphQL endpoint with shared authentication and isolated schema ownership.
        interview: Explain when FastAPI should render HTML or host GraphQL and when a separate frontend boundary is clearer.
      - title: TestClient, dependency overrides, lifespan, fixtures, and deterministic tests
        behind_the_scenes: Understand the in-process ASGI transport, event-loop portal, lifespan context, dependency override lookup, application state, and exception propagation.
        practical: Test validation, authentication, cleanup, and failure responses with isolated fixtures and explicit dependency overrides.
        interview: Explain what TestClient proves, what it cannot prove, and why global overrides can leak between tests.
      - title: Async integration tests, HTTPX transports, real databases, and contract tests
        behind_the_scenes: Trace async test execution through ASGITransport, lifespan management, database isolation, transaction visibility, migrations, external-service fakes, and schema assertions.
        practical: Build async integration tests against a temporary database with migrations, concurrency cases, generated-client contract checks, and cleanup.
        interview: Balance mocks, fakes, ephemeral infrastructure, and end-to-end tests for confidence and speed.
      - title: Structured logging, metrics, tracing, health, readiness, and diagnostics
        behind_the_scenes: Propagate request and trace context through async work, distinguish logs from metrics and traces, define service-level indicators, and separate liveness from readiness.
        practical: Instrument latency, errors, pool use, dependency calls, and request IDs; expose safe health endpoints and trace one failing request.
        interview: Select observability signals for a latency incident and avoid high-cardinality or secret-bearing telemetry.
      - title: Performance profiling, serialization, validation cost, pools, and workers
        behind_the_scenes: Decompose latency into queueing, validation, endpoint work, database or upstream waits, serialization, event-loop delay, worker scheduling, and memory duplication.
        practical: Load-test a representative endpoint, profile CPU and allocations, measure pool contention, change one bottleneck, and report before and after evidence.
        interview: Explain why framework benchmarks rarely predict application performance and when more workers make latency worse.
      - title: Containers, workers, proxies, migrations, health checks, and graceful deployment
        behind_the_scenes: Follow immutable image startup, pre-start migration ownership, lifespan, readiness, load-balancer routing, signals, connection draining, worker termination, restart, and replication.
        practical: Build a non-root container and deploy it behind a proxy with health checks, one-time migrations, graceful shutdown, resource limits, and rollback.
        interview: Decide between multiple workers in one container and one worker per replicated container and explain memory and failure tradeoffs.
      - title: API versioning, deprecation, compatibility, schema evolution, and rollout
        behind_the_scenes: Treat HTTP and OpenAPI contracts as distributed dependencies, including tolerant readers, additive change, enum expansion, database migration ordering, and client rollout lag.
        practical: Evolve a live endpoint through additive fields, deprecation metadata, compatibility tests, metrics, and a safe removal plan.
        interview: Identify breaking changes beyond URL versions and design a zero-downtime server and client rollout.
      - title: Custom APIRoute, custom request handling, schema hooks, and framework internals
        behind_the_scenes: Trace APIRoute construction, dependant creation, request-handler generation, body parsing, dependency solving, endpoint invocation, serialization, and custom route wrapping.
        practical: Implement a narrowly scoped timed or decompression route class, customize OpenAPI safely, and test interaction with errors, streaming, and dependencies.
        interview: Explain when extending APIRoute is justified and why middleware or dependencies are usually simpler.
      - title: FastAPI production architecture capstone
        behind_the_scenes: Integrate transport contracts, dependency graphs, domain services, transactions, durable jobs, identity, authorization, observability, lifecycle, and deployment into one defensible system.
        practical: Ship a multi-tenant FastAPI service with PostgreSQL, background work, OpenAPI client generation, tests, security controls, telemetry, container delivery, and an incident runbook.
        interview: Present the architecture, trace a request and failure end to end, defend key tradeoffs, and show measured production evidence.

  - id: data-systems
    title: PostgreSQL, Redis, and Data Systems Complete Deep Dive
    tier: core
    goal: Model, query, tune, secure, recover, and explain production data systems from PostgreSQL storage internals through Redis distributed operation.
    topics:
      - title: PostgreSQL setup, psql, clusters, databases, schemas, roles, and search_path
        behind_the_scenes: Trace a client connection into one PostgreSQL cluster and distinguish server instances, databases, namespaces, owners, sessions, and name resolution.
        practical: Start an isolated database, create least-privilege roles and schemas, inspect connection identity, and prove which object an unqualified name resolves to.
        interview: Explain the difference between a PostgreSQL cluster, database, schema, role, and session and identify search_path security risks.
      - title: PostgreSQL architecture, postmaster, backend processes, shared memory, and background workers
        behind_the_scenes: Follow connection acceptance, per-session processes, shared buffers, WAL buffers, checkpointer, background writer, autovacuum, and operating-system boundaries.
        practical: Map live sessions and background processes to pg_stat_activity and OS process evidence under a small workload.
        interview: Trace one query through PostgreSQL processes and explain why too many connections consume real resources.
      - title: Relations, forks, pages, tuples, catalogs, and physical versus logical storage
        behind_the_scenes: Connect SQL relations and system catalogs to heap files, forks, fixed-size pages, line pointers, tuple headers, and block-oriented I/O.
        practical: Create a table, inspect relation size and page-level metadata, then relate logical rows to physical storage growth.
        interview: Explain how a logical table becomes physical pages and why storage details matter during tuning and recovery.
      - title: PostgreSQL data types, NULL, domains, enums, arrays, ranges, JSONB, and generated columns
        behind_the_scenes: Study type input and output functions, three-valued logic, binary representation, operator classes, validation boundaries, and generated-value maintenance.
        practical: Model one domain with precise scalar, temporal, range, array, JSONB, and generated values and test invalid and NULL cases.
        interview: Choose types deliberately and explain when JSONB, arrays, domains, enums, or relational tables are the safer model.
      - title: Relational modeling, entities, relationships, keys, functional dependencies, and normalization
        behind_the_scenes: Derive relation boundaries from business facts, determinants, candidate keys, cardinality, and update anomalies rather than copying UI objects.
        practical: Normalize a multi-tenant commerce model through third normal form and document deliberate denormalization with measured read needs.
        interview: Explain normalization using insertion, update, and deletion anomalies and defend a controlled denormalization.
      - title: Constraints, primary keys, foreign keys, uniqueness, CHECK, exclusion, and deferred validation
        behind_the_scenes: Treat constraints as concurrent invariant enforcement backed by indexes, lock checks, referential actions, and immediate or deferred timing.
        practical: Encode tenant ownership, valid ranges, uniqueness, and non-overlapping bookings in the database and prove rejected race cases.
        interview: Explain why application validation cannot replace database constraints under concurrency.
      - title: Schema migrations, DDL locks, transactional DDL, expand-contract, backfills, and zero-downtime change
        behind_the_scenes: Trace catalog changes, table rewrites, lock acquisition, old and new application compatibility, resumable data movement, and rollback limits.
        practical: Execute an expand-contract migration with batched backfill, dual compatibility, validation, and a measured lock budget.
        interview: Design a safe migration for a large hot table and explain which operations can block or rewrite it.
      - title: SQL logical query processing, SELECT, FROM, WHERE, GROUP BY, HAVING, ORDER BY, and LIMIT
        behind_the_scenes: Separate SQL's logical evaluation model from the physical plan that PostgreSQL may legally reorder while preserving relational meaning.
        practical: Predict aliases, NULL behavior, filtering, grouping, and ordering before running a query and compare the result with its plan.
        interview: Explain SQL's logical processing order and why it differs from written syntax and physical execution.
      - title: Joins, inner, outer, cross, semi, anti, LATERAL, and join predicates
        behind_the_scenes: Model joins as row-set combinations while distinguishing match semantics, NULL extension, predicate placement, correlation, and accidental cardinality multiplication.
        practical: Implement reporting and latest-per-parent queries with explicit joins, EXISTS, NOT EXISTS, and LATERAL and test duplicate and NULL cases.
        interview: Compare join types and diagnose a query that silently changes meaning when a predicate moves between ON and WHERE.
      - title: Subqueries, correlated execution, CTEs, recursive queries, and materialization
        behind_the_scenes: Follow parameterized subplans, decorrelation opportunities, CTE folding or materialization, working tables, recursion termination, and cycle safety.
        practical: Write hierarchy traversal and dependency queries, inspect their plans, and bound recursive behavior on cyclic data.
        interview: Explain when a CTE is organizational syntax, an optimization boundary, or a recursive evaluation mechanism.
      - title: Aggregates, window functions, frames, grouping sets, rollup, and ordered-set analysis
        behind_the_scenes: Separate row reduction from per-row window results and trace partitions, ordering, peer groups, frame boundaries, partial aggregation, and sort cost.
        practical: Build cohort, ranking, running-total, percentile, and multi-level summary queries with deterministic windows.
        interview: Explain why GROUP BY and window functions produce different row cardinalities and diagnose a surprising default frame.
      - title: Transactions, ACID, autocommit, BEGIN, savepoints, commit, and rollback
        behind_the_scenes: Follow a session transaction through statement boundaries, snapshots, resource ownership, constraint checks, WAL records, commit visibility, and abort cleanup.
        practical: Implement a multi-step money transfer with savepoints and prove atomicity under constraint, process, and client failures.
        interview: Explain each ACID property with a concrete PostgreSQL mechanism and avoid equating durability with backups.
      - title: MVCC, transaction IDs, snapshots, xmin, xmax, tuple versions, and visibility
        behind_the_scenes: Trace how writers create tuple versions and how snapshot rules decide visibility without making ordinary readers block writers.
        practical: Use two psql sessions and page or transaction metadata to observe old and new versions before and after commit and vacuum.
        interview: Explain PostgreSQL MVCC from a row update to snapshot visibility and identify the cleanup cost it creates.
      - title: Isolation levels, Read Committed, Repeatable Read, Serializable, anomalies, and SSI
        behind_the_scenes: Compare statement and transaction snapshots, write conflict detection, predicate dependencies, serialization graphs, and safe retry after SQLSTATE 40001.
        practical: Reproduce nonrepeatable reads, write skew, and serialization failure with coordinated sessions and then protect the invariant.
        interview: Select an isolation level from a named anomaly and explain why Serializable transactions may still need retry logic.
      - title: Table locks, row locks, predicate locks, advisory locks, wait queues, and NOWAIT
        behind_the_scenes: Examine lock modes, compatibility, heavyweight and row-level representations, acquisition order, waiter behavior, and transaction-scoped release.
        practical: Observe blocked sessions with pg_locks and pg_stat_activity and implement a bounded worker claim using FOR UPDATE SKIP LOCKED.
        interview: Distinguish row, table, predicate, and advisory locks and explain when SKIP LOCKED changes business semantics.
      - title: Deadlocks, serialization failures, timeouts, retry budgets, and idempotent transactions
        behind_the_scenes: Build wait-for cycles, observe deadlock victim selection, classify retryable SQLSTATEs, and preserve an external request identity across attempts.
        practical: Reproduce a deadlock, eliminate inconsistent lock order, and add bounded jittered retries around the whole transaction.
        interview: Explain the difference between a deadlock and serialization failure and place retries at the correct boundary.
      - title: B-tree internals, pages, ordering, splits, deduplication, and index-only scans
        behind_the_scenes: Follow keys through root, internal, and leaf pages; connect splits, fill factor, duplicate handling, heap references, and visibility-map checks.
        practical: Build a B-tree for a real access path, inspect size and plan behavior, and demonstrate when an index-only scan still reads the heap.
        interview: Explain B-tree lookup and why an index-only plan depends on more than included columns.
      - title: Hash, GiST, SP-GiST, GIN, BRIN, operator classes, and extension indexes
        behind_the_scenes: Relate each access method to its searchable operators, data distribution, lossy matches, rechecks, maintenance cost, and physical locality assumptions.
        practical: Compare GIN for JSONB or full text, GiST for ranges, and BRIN for ordered large data using measured plans and index sizes.
        interview: Choose a PostgreSQL index type from operators and workload rather than memorized data-type rules.
      - title: Composite, covering, partial, expression, unique indexes, and index design tradeoffs
        behind_the_scenes: Trace prefix rules, predicate implication, included payload, computed keys, uniqueness enforcement, write amplification, cache use, and redundant index cost.
        practical: Design the minimum index set for a workload and prove benefit with plans, write measurements, and unused-index evidence.
        interview: Order composite index columns and explain when partial, expression, or covering indexes help or fail.
      - title: Planner statistics, cardinality estimation, selectivity, histograms, MCVs, correlation, and extended statistics
        behind_the_scenes: Follow sampled table data into statistics and estimates that drive scan, join, aggregation, and memory decisions while accounting for correlated columns.
        practical: Create skew and correlation, observe a misestimate, improve statistics, and verify the changed plan and runtime.
        interview: Explain how wrong row estimates cascade into a poor plan and how to diagnose the source rather than force a plan blindly.
      - title: EXPLAIN, ANALYZE, BUFFERS, WAL, SETTINGS, timing, and plan interpretation
        behind_the_scenes: Read plans bottom-up while separating estimates from actual rows, loops, inclusive timing, buffer activity, temporary I/O, and planning overhead.
        practical: Diagnose one slow query with safe EXPLAIN options and preserve before-and-after plan evidence without using cost as elapsed time.
        interview: Walk through a real execution plan and identify the first material estimate or work mismatch.
      - title: Sequential scans, bitmap scans, nested loops, hash joins, merge joins, sorts, and spills
        behind_the_scenes: Compare access and join algorithms by startup cost, total work, input ordering, memory, random I/O, batching, and spill behavior.
        practical: Generate workloads that select each major scan and join strategy, then constrain memory to observe a sort or hash spill.
        interview: Choose a join algorithm for concrete input sizes and explain why the planner may prefer a sequential scan.
      - title: Heap pages, TOAST, free space map, visibility map, HOT updates, fillfactor, and bloat
        behind_the_scenes: Follow wide values and updates through heap tuples, out-of-line storage, free-space lookup, all-visible bits, same-page HOT chains, and dead space.
        practical: Compare update patterns with and without indexed-column changes and measure table, TOAST, and index growth.
        interview: Explain HOT updates, visibility maps, and why bloat is reusable space rather than simply a file leak.
      - title: VACUUM, autovacuum, ANALYZE, freezing, transaction ID wraparound, and maintenance tuning
        behind_the_scenes: Trace dead-tuple pruning, index cleanup, visibility marking, statistics refresh, freeze horizons, worker scheduling, thresholds, and long-transaction interference.
        practical: Create dead tuples, inspect maintenance statistics, tune one table, and prove that an old transaction delays cleanup.
        interview: Explain why vacuum is required by MVCC and how autovacuum protects both performance and transaction-ID safety.
      - title: WAL, LSNs, commit durability, checkpoints, full-page writes, and crash recovery
        behind_the_scenes: Follow a change into WAL buffers, durable log records, data pages, checkpoint metadata, redo, and group commit under different synchronous_commit choices.
        practical: Correlate a transaction with LSN movement, checkpoint activity, WAL volume, and a controlled crash-recovery test.
        interview: Explain write-ahead logging and why a committed transaction can survive before its changed table page reaches disk.
      - title: Connections, sessions, prepared statements, PgBouncer, pool sizing, and transaction pooling
        behind_the_scenes: Account for backend memory and process cost, queueing, session state, prepared-plan lifetime, pool modes, admission control, and database capacity.
        practical: Load-test bounded and oversized pools, measure wait time and throughput, and find session features incompatible with transaction pooling.
        interview: Size a connection pool from capacity evidence and explain why more connections can reduce throughput.
      - title: Declarative partitioning, pruning, routing, maintenance, constraints, and partition-wise execution
        behind_the_scenes: Map a partitioned table to child relations, bound checks, plan-time or runtime pruning, indexes per partition, default partitions, and catalog overhead.
        practical: Partition time-series data, verify pruning with parameters, rotate partitions safely, and compare it with an unpartitioned baseline.
        interview: Explain what partitioning solves, what it does not solve, and why the partition key must match operational access patterns.
      - title: Physical streaming replication, WAL senders, receivers, slots, lag, synchronous replication, and failover
        behind_the_scenes: Trace WAL from primary to standby receipt, flush, replay, feedback, slot retention, synchronous confirmation, timelines, promotion, and client routing.
        practical: Measure receive and replay lag, pause a replica, observe retained WAL, promote safely, and verify recovery-point objectives.
        interview: Compare synchronous and asynchronous replication and explain how lag, slots, and failover can affect availability and data safety.
      - title: Logical replication, publications, subscriptions, decoding, replication identity, and CDC
        behind_the_scenes: Convert WAL changes into logical row events, filter published tables, identify updates and deletes, manage slots and acknowledgements, and handle schema separately.
        practical: Stream a table into a subscriber or local CDC consumer and prove duplicate-safe resume from a recorded position.
        interview: Compare physical replication, logical replication, and change-data capture for migration and event integration.
      - title: Backups, pg_dump, pg_restore, base backups, WAL archiving, PITR, RPO, and RTO
        behind_the_scenes: Distinguish logical exports from consistent physical base backups and combine archived WAL with recovery targets, timelines, verification, and retention.
        practical: Restore a logical backup and perform a point-in-time recovery drill with measured recovery point and recovery time.
        interview: Design a PostgreSQL backup strategy and explain why replicas do not replace tested backups.
      - title: Authentication, pg_hba.conf, TLS, roles, privileges, default privileges, and row-level security
        behind_the_scenes: Follow connection authentication separately from SQL authorization, role membership, object ownership, grant inheritance, policy evaluation, and SECURITY DEFINER risk.
        practical: Build least-privilege app and migration roles, require TLS, isolate tenants with RLS, and test bypass and object-creation paths.
        interview: Trace PostgreSQL access from pg_hba authentication to row policy and identify common ownership and search_path escalation mistakes.
      - title: PostgreSQL observability, pg_stat_activity, pg_locks, pg_stat_statements, progress views, logs, and wait events
        behind_the_scenes: Connect cumulative statistics, current session state, lock graphs, normalized query fingerprints, backend wait categories, maintenance progress, and structured logs.
        practical: Diagnose one lock incident and one slow-query incident from database views without relying on application guesses.
        interview: Present a systematic PostgreSQL diagnosis path from user symptom to sessions, waits, query plans, storage, and host evidence.
      - title: PostgreSQL performance tuning, memory, I/O, checkpoints, work_mem, cache, and capacity testing
        behind_the_scenes: Relate workload concurrency to shared and per-operation memory, operating-system cache, storage latency, WAL pressure, checkpoint pacing, and saturation queues.
        practical: Establish a reproducible baseline, change one setting, load-test to saturation, and retain latency, throughput, error, and resource evidence.
        interview: Explain why PostgreSQL tuning starts with workload and query evidence rather than a universal configuration template.
      - title: JSONB indexing, full-text search, extensions, pgvector, vector indexes, and hybrid retrieval
        behind_the_scenes: Compare binary JSON operators, GIN search, text parsing and ranking, extension types, exact vector distance, approximate index search, filtering, and recall tradeoffs.
        practical: Build an interview-search dataset with relational filters, full-text ranking, vector similarity, and measured hybrid retrieval quality.
        interview: Decide between relational columns, JSONB, full text, and vectors and explain approximate-search accuracy versus latency.
      - title: Application data patterns, optimistic concurrency, idempotency, outbox, inbox, pagination, and read consistency
        behind_the_scenes: Move application invariants into conditional writes and durable records while tracing duplicate requests, event publication gaps, keyset boundaries, replica lag, and retry behavior.
        practical: Implement a duplicate-safe command with version checking and a transactional outbox, then consume it idempotently.
        interview: Explain how database transactions support idempotent APIs and reliable event publication without claiming distributed atomicity.
      - title: Redis architecture, event loop, command execution, I/O threads, keyspace, databases, and expiration cycle
        behind_the_scenes: Follow a socket request through protocol parsing and mostly single-threaded command execution while distinguishing network I/O, background work, key lookup, and incremental expiration.
        practical: Observe command latency under small and deliberately blocking workloads and connect symptoms to complexity and event-loop occupancy.
        interview: Explain what Redis being single-threaded does and does not mean and why one expensive command can affect unrelated clients.
      - title: RESP, connections, clients, command pipelining, protocol framing, and output buffers
        behind_the_scenes: Encode commands and replies as RESP frames, preserve request order on persistent connections, and account for parser limits, client buffers, backpressure, and disconnect behavior.
        practical: Send RESP manually over a socket, inspect replies, and compare sequential requests with a bounded pipeline.
        interview: Trace a Redis command at the protocol level and distinguish pipelining from transactions and batching inside Lua.
      - title: Redis strings, counters, hashes, object encodings, memory usage, and atomic updates
        behind_the_scenes: Relate logical byte strings and field maps to compact or expanded encodings, command atomicity, integer operations, serialization choices, and memory overhead.
        practical: Model sessions, counters, and small objects with strings and hashes and measure memory and update behavior.
        interview: Choose strings versus hashes and explain atomic increments, serialization boundaries, and per-key overhead.
      - title: Redis lists, sets, sorted sets, blocking operations, indexes, and leaderboard patterns
        behind_the_scenes: Connect command complexity and encodings to ordered sequences, uniqueness, score ordering, rank lookup, blocking clients, and queue fairness.
        practical: Build a bounded activity feed, membership set, and ranked leaderboard and verify tie, removal, and blocking behavior.
        interview: Select list, set, or sorted set from access operations and state the time and memory tradeoffs.
      - title: Redis bitmaps, bitfields, HyperLogLog, geospatial indexes, probabilistic tradeoffs, and compact analytics
        behind_the_scenes: Pack boolean or integer state into bits, estimate cardinality with bounded error, and map coordinates into sorted-set representations and radius searches.
        practical: Compare exact and approximate daily-active-user counts and implement a compact feature or attendance bitmap.
        interview: Explain when approximation or bit packing is worthwhile and quantify the accuracy, range, and memory tradeoff.
      - title: Redis TTL, expiration, eviction policies, maxmemory, LFU, LRU sampling, and memory pressure
        behind_the_scenes: Distinguish key expiration from memory eviction, active from passive expiry, sampled policy decisions, lazy freeing, TTL loss through writes, and out-of-memory responses.
        practical: Run a memory-limited instance, exercise eviction policies, and capture hit rate, latency, evicted keys, expired keys, and application correctness.
        interview: Compare TTL and eviction and choose a maxmemory policy without allowing cached data loss to violate source-of-truth invariants.
      - title: Redis atomic commands, MULTI, EXEC, WATCH, optimistic locking, Lua, and server-side functions
        behind_the_scenes: Compare per-command atomicity, queued transaction execution, WATCH invalidation, lack of rollback, deterministic server-side logic, script cache, and blocking duration.
        practical: Implement a conditional balance update with WATCH and an atomic rate operation with Lua, then force conflicts and script errors.
        interview: Explain Redis transaction guarantees, why MULTI is not a relational transaction, and when Lua improves or harms correctness.
      - title: Redis pipelining, batching, round trips, throughput, latency, and backpressure
        behind_the_scenes: Amortize network round trips while requests accumulate in client and server buffers, responses remain ordered, and oversized batches create memory and tail-latency risk.
        practical: Benchmark sequential, pipelined, and variably batched commands and find the knee where throughput gains stop justifying latency and memory.
        interview: Explain why pipelining improves throughput without making individual commands execute in parallel.
      - title: Redis RDB, AOF, fsync, rewrites, fork, copy-on-write, restart, and durability tradeoffs
        behind_the_scenes: Follow snapshots and append-only commands through child processes, page copying, fsync policies, background rewrites, startup replay, corruption handling, and data-loss windows.
        practical: Test RDB and AOF configurations with writes, restarts, interrupted persistence, verification tools, and measured recovery time.
        interview: Compare RDB and AOF and connect persistence policy to explicit RPO, latency, memory, and recovery requirements.
      - title: Redis replication, replication IDs, offsets, PSYNC, backlog, replicas, and Sentinel failover
        behind_the_scenes: Trace command-stream replication, partial and full resynchronization, backlog coverage, replica staleness, Sentinel quorum, leader election, promotion, and client reconfiguration.
        practical: Break and restore replication, observe offsets and backlog behavior, then execute a Sentinel failover and verify client and data outcomes.
        interview: Explain Redis replication and Sentinel failure windows without claiming synchronous write safety.
      - title: Redis Cluster, hash slots, hash tags, MOVED, ASK, resharding, gossip, quorum, and failover
        behind_the_scenes: Map keys to 16384 slots, route clients through redirects, migrate slots, propagate topology, detect failures, elect replicas, and enforce multi-key locality.
        practical: Run a small cluster, inspect slot ownership, use hash tags for an atomic multi-key operation, reshard, and observe redirect handling.
        interview: Explain Redis Cluster scaling and availability, including asynchronous replication and cross-slot constraints.
      - title: Redis Streams, entries, consumer groups, pending entries, acknowledgements, claiming, trimming, and idempotency
        behind_the_scenes: Follow immutable stream IDs through group cursors, per-consumer pending state, redelivery, ownership transfer, acknowledgement, retention, and duplicate side effects.
        practical: Build a consumer group that survives a crashed worker, claims stale work, records idempotency, and trims only within an explicit retention policy.
        interview: Compare Redis Streams with lists and durable logs and explain at-least-once processing using the pending entries list.
      - title: Cache-aside, write-through, invalidation, stampedes, stale data, negative caching, and consistency
        behind_the_scenes: Trace cache hits and misses against an authoritative store, version or invalidate entries, bound staleness, collapse concurrent fills, randomize expiry, and protect missing-value lookups.
        practical: Implement cache-aside with versioned keys, single-flight refresh, jittered TTL, negative caching, and observable fallback during Redis failure.
        interview: Design a cache for a concrete read path and explain invalidation, stampede, stale-read, and outage behavior.
      - title: Distributed locks, fencing tokens, rate limiting, queues, delayed work, and correctness boundaries
        behind_the_scenes: Separate mutual-exclusion leases from stale-owner protection, reason about pauses and partitions, and model token buckets, retries, acknowledgement, scheduling, and source-of-truth durability.
        practical: Demonstrate an unsafe lease, repair the protected resource with fencing, and implement an atomic bounded rate limiter with expiry.
        interview: Explain why a Redis lock alone may not protect correctness and choose purpose-built primitives for limits and work delivery.
      - title: Redis security, ACLs, TLS, protected mode, command controls, observability, latency, and memory diagnostics
        behind_the_scenes: Follow client identity through encrypted transport and ACL categories while tracking slow commands, latency events, command statistics, clients, memory fragmentation, key sampling, and persistence health.
        practical: Create least-privilege users, enable secure transport, block unsafe administration paths, and diagnose a latency or memory incident from native evidence.
        interview: Present a production Redis hardening and diagnosis checklist without relying on network isolation alone.
      - title: Data systems production architecture capstone, PostgreSQL, Redis, CDC, recovery, performance, and operations
        behind_the_scenes: Integrate authoritative relational state, transactional invariants, cache behavior, event publication, Redis failure tolerance, replication, backups, capacity limits, security, and end-to-end telemetry.
        practical: Ship a multi-tenant job platform with PostgreSQL as source of truth, outbox-driven events, Redis acceleration, load and failure tests, restore evidence, dashboards, and an incident runbook.
        interview: Present the architecture, trace a request and recovery end to end, defend every consistency boundary, and support tradeoffs with measured evidence.

  - id: api-distributed-systems
    title: API Design and Distributed Systems Complete Deep Dive
    tier: core
    goal: Design evolvable service contracts and distributed workflows that remain correct, bounded, diagnosable, and recoverable under concurrency, latency, retries, overload, and partial failure.
    topics:
      - title: System boundaries, domain invariants, service ownership, and API contracts
        behind_the_scenes: Begin with business capabilities and authoritative state, then make ownership, trust, consistency, failure, and compatibility boundaries explicit before choosing protocol shapes.
        practical: Decompose a multi-tenant AI job product into owned capabilities and write an invariant and contract sheet for every cross-boundary interaction.
        interview: Derive service boundaries from change and consistency needs instead of drawing boxes from nouns or team structure alone.
      - title: HTTP architecture, requests, responses, intermediaries, and semantics
        behind_the_scenes: Trace a self-descriptive HTTP message through user agents, caches, proxies, gateways, origins, and transport versions while keeping application semantics independent of framing.
        practical: Capture one request across a reverse proxy and compare method, target, headers, representation, status, timing, and hop-by-hop changes.
        interview: Explain what HTTP semantics guarantee across HTTP versions and what proxies may legitimately transform or cache.
      - title: HTTP methods, safety, idempotency, cacheability, and conditional behavior
        behind_the_scenes: Connect method semantics to automated retries, crawling, caching, preconditions, side effects, and the difference between repeating a request and repeating its network exchange.
        practical: Design GET, POST, PUT, PATCH, and DELETE operations and prove their safe, idempotent, conditional, and retry behavior.
        interview: Distinguish safe from idempotent and explain why an idempotent method can still produce new logs, billing, or responses.
      - title: Resource modeling, URIs, collections, relationships, and action endpoints
        behind_the_scenes: Model stable identities and state transitions as resources while separating client-visible names from storage layout, controller methods, and transient implementation details.
        practical: Design resources for projects, runs, approvals, artifacts, and cancellations with consistent collection, relationship, and operation patterns.
        interview: Defend a resource model and identify when an explicit command endpoint is clearer than pretending every operation is CRUD.
      - title: Representations, media types, content negotiation, compression, and localization
        behind_the_scenes: Treat a representation as one transferable view of resource state selected by media type, language, encoding, profile, and negotiated client capabilities.
        practical: Implement JSON and event-stream representations with Accept negotiation, correct Vary behavior, compression thresholds, and locale-safe domain data.
        interview: Explain why resources are not their JSON representations and how negotiation interacts with caches.
      - title: Status codes, RFC 9457 Problem Details, stable error codes, and failure contracts
        behind_the_scenes: Separate protocol-level outcome from domain-specific problem type, occurrence, retryability, field errors, support correlation, and safe disclosure.
        practical: Define a versioned error catalog and return application/problem+json for validation, conflict, authorization, throttling, and dependency failure.
        interview: Choose precise status codes and design errors clients can handle without parsing human prose.
      - title: Boundary validation, normalization, unknown fields, limits, and error aggregation
        behind_the_scenes: Parse untrusted bytes into a bounded syntactic shape, normalize only explicitly equivalent forms, validate domain policy, and preserve useful multi-field diagnostics.
        practical: Build one request parser that rejects oversized, ambiguous, duplicate, unknown, malformed, and policy-invalid input before business effects.
        interview: Explain the difference between parsing, normalization, schema validation, and domain validation and where each belongs.
      - title: Idempotency keys, request fingerprints, deduplication records, and replayed responses
        behind_the_scenes: Bind a client operation identity to one canonical request fingerprint and durable outcome so concurrent attempts either share work or receive the authoritative prior result.
        practical: Implement an idempotent create endpoint with atomic claim, conflict on key reuse with different input, stored response, expiry policy, and concurrent tests.
        interview: Design idempotency for a payment-like mutation and explain storage, scope, race, retry, and retention decisions.
      - title: ETags, Last-Modified, preconditions, optimistic concurrency, and lost-update prevention
        behind_the_scenes: Turn a selected representation or resource version into a validator and evaluate If-Match or If-None-Match before applying a state transition.
        practical: Implement conditional GET and conditional update, reproduce a lost update, and prove that a stale ETag receives 412 without overwriting newer state.
        interview: Compare cache revalidation with optimistic concurrency and explain strong versus weak validators.
      - title: Pagination offset, keyset, cursor, snapshots, and stable ordering
        behind_the_scenes: Define a total order and continuation boundary while accounting for inserts, deletes, ties, authorization filters, snapshot lifetime, and opaque cursor evolution.
        practical: Implement signed keyset cursors over a compound sort key and test no duplicates or omissions across concurrent writes.
        interview: Compare offset and cursor pagination and design stable traversal for a changing high-cardinality collection.
      - title: Filtering, sorting, search, sparse fields, includes, and query complexity
        behind_the_scenes: Translate a bounded public query grammar into authorized database operations while controlling field exposure, join fan-out, search cost, and cache-key variation.
        practical: Define an allowlisted query DSL with deterministic ordering, cost budgets, safe parameters, and explain-plan tests.
        interview: Design flexible collection queries without exposing arbitrary SQL or unbounded server work.
      - title: API versioning, compatibility, additive evolution, deprecation, and sunset policy
        behind_the_scenes: Classify changes by observed client contract, evolve readers and writers independently, measure real use, announce timelines, and remove behavior only after migration evidence.
        practical: Evolve a request and response across two client versions with consumer contract tests, deprecation headers, telemetry, and a rollback path.
        interview: Decide whether a proposed change needs a version and explain why additive syntax can still be semantically breaking.
      - title: HTTP caching, Cache-Control, validators, Vary, CDNs, and invalidation
        behind_the_scenes: Follow freshness, age, validation, shared versus private storage, cache keys, variant selection, stale directives, and purge or versioned-resource behavior.
        practical: Configure a cacheable public response and a private user response, then inspect HIT, MISS, revalidation, stale serving, and invalidation evidence.
        interview: Trace a response through browser and CDN caches and diagnose a correctness or hit-rate failure.
      - title: REST constraints, statelessness, hypermedia, uniform interface, and maturity tradeoffs
        behind_the_scenes: Connect client-server separation, stateless requests, cacheability, layered intermediaries, uniform operations, and runtime-discovered links to independent evolution.
        practical: Review an HTTP API against REST constraints and add useful links and state-transition affordances without ceremony that clients will ignore.
        interview: Explain REST as an architectural style rather than a JSON-over-HTTP synonym and defend pragmatic deviations.
      - title: OpenAPI, JSON Schema, examples, code generation, linting, and contract governance
        behind_the_scenes: Treat a machine-readable description as a governed artifact that drives validation, documentation, mocks, generated clients, diff checks, and compatibility policy.
        practical: Author an OpenAPI contract, validate examples, generate a client, run a breaking-change diff, and test the deployed service against it.
        interview: Explain what OpenAPI can prove, what runtime tests must still prove, and how to prevent specification drift.
      - title: Protocol Buffers, gRPC, streaming RPCs, deadlines, status, and schema evolution
        behind_the_scenes: Trace a typed message through binary field tags, HTTP/2 streams, generated stubs, metadata, deadline propagation, cancellation, status details, and backward-compatible schema changes.
        practical: Define unary and streaming RPCs, propagate a deadline, enforce bounds, evolve fields safely, and test an old client against a new server.
        interview: Compare REST and gRPC for public and internal boundaries and explain protobuf compatibility rules.
      - title: GraphQL schema, resolvers, N+1, batching, complexity, and federation
        behind_the_scenes: Execute a client-selected field graph through resolver dependencies, per-request batching, authorization, null propagation, cost limits, and federated ownership.
        practical: Build a typed query with DataLoader-style batching, depth and cost limits, field authorization, persisted operations, and resolver traces.
        interview: Explain how GraphQL avoids over-fetching yet can create N+1, authorization, caching, and unbounded-query problems.
      - title: Webhooks, signatures, timestamps, retries, replay protection, and event evolution
        behind_the_scenes: Deliver an immutable event over an untrusted network, authenticate its raw bytes, bound timestamp skew, deduplicate identity, acknowledge promptly, and retry without duplicate effects.
        practical: Implement webhook signing and verification, rotate secrets, reject replays, queue accepted work, and simulate lost responses and out-of-order events.
        interview: Design a webhook provider and consumer with explicit authenticity, delivery, ordering, and compatibility guarantees.
      - title: SSE, WebSockets, bidirectional streams, heartbeats, backpressure, and reconnects
        behind_the_scenes: Maintain long-lived connection state through intermediaries while framing messages, detecting liveness, bounding buffers, resuming positions, authenticating refreshes, and cleaning abandoned work.
        practical: Build a resumable SSE feed and a bounded WebSocket channel, then test slow consumers, reconnect, proxy idle timeout, and server shutdown.
        interview: Choose polling, SSE, WebSockets, or streaming RPCs from directionality, scale, delivery, browser, and operational constraints.
      - title: Authentication, authorization, scopes, tenant isolation, delegation, and audit
        behind_the_scenes: Separate proof of caller identity from policy decisions over resource, action, tenant, context, delegation chain, and recorded security event.
        practical: Enforce object-level authorization and tenant scoping in a shared policy boundary and test confused-deputy and identifier-tampering cases.
        interview: Trace identity and authority across services and explain why gateway authentication cannot replace downstream authorization.
      - title: API gateways, reverse proxies, routing, quotas, rate limits, and policy placement
        behind_the_scenes: Route requests through an intermediary that terminates transport and applies bounded cross-cutting policy while preserving client identity, deadlines, protocol semantics, and service ownership.
        practical: Configure routing, request limits, per-principal quotas, trusted forwarding, timeout budgets, and failure responses across a gateway and service.
        interview: Decide which responsibilities belong at the gateway versus inside services and identify single-point and policy-drift risks.
      - title: API security, threat modeling, injection, SSRF, mass assignment, and abuse resistance
        behind_the_scenes: Map assets and trust boundaries, constrain interpreters and outbound destinations, allowlist writable fields, enforce object policy, and bound attacker-controlled cost.
        practical: Threat-model an API and add tests for injection, SSRF, broken object authorization, unsafe binding, oversized input, automation, and secret leakage.
        interview: Prioritize API threats using concrete assets, paths, controls, residual risk, and verification rather than reciting a checklist.
      - title: API observability, correlation, trace context, metrics, logs, and audit events
        behind_the_scenes: Propagate one request identity and trace context across boundaries while separating high-cardinality diagnostic events from aggregatable service and product signals.
        practical: Instrument an endpoint through two dependencies with RED metrics, structured logs, spans, retry attempt details, safe payload metadata, and audit linkage.
        interview: Diagnose a slow or failing API using traces, metrics, logs, and business state and explain cardinality and privacy tradeoffs.
      - title: API testing, schema conformance, contract tests, property tests, fuzzing, and compatibility
        behind_the_scenes: Prove syntax, semantics, authorization, failure, concurrency, and evolution at the narrowest realistic boundary while keeping consumer expectations executable.
        practical: Build provider conformance, consumer contract, metamorphic pagination, fuzz, concurrency, and backward-compatibility checks for one API.
        interview: Design an API test strategy that catches integration and compatibility failures without duplicating every assertion at every layer.
      - title: Developer experience, documentation, SDKs, changelogs, sandboxes, and governance
        behind_the_scenes: Treat time-to-first-success and safe evolution as product outcomes supported by examples, generated or hand-tuned clients, consistent conventions, support evidence, and review policy.
        practical: Publish a quickstart, reference, runnable examples, typed SDK, sandbox, changelog, and design checklist and test them with a new consumer.
        interview: Explain how developer experience affects adoption and correctness and how governance stays helpful rather than becoming a committee bottleneck.
      - title: Distributed system model, nodes, processes, messages, state, and assumptions
        behind_the_scenes: Define independent failure domains, local state machines, message channels, scheduling, timing, durability, trust, and the exact assumptions an algorithm needs to make progress.
        practical: Model a three-node service as deterministic transitions and enumerate which facts each node can and cannot know after a dropped response.
        interview: State a distributed-system model before proposing guarantees and distinguish safety from liveness.
      - title: Failure models, crashes, omissions, Byzantine behavior, and partial failure
        behind_the_scenes: Classify fail-stop, crash-recovery, send or receive omission, timing, corruption, and arbitrary faults while recognizing that one component can fail as others continue.
        practical: Inject process death, paused execution, lost messages, disk errors, and malformed peer input and record detection and recovery behavior.
        interview: Explain partial failure and choose defenses appropriate to the assumed fault model rather than solving a harder or easier problem accidentally.
      - title: Network uncertainty, delay, loss, duplication, reordering, partitions, and TCP limits
        behind_the_scenes: Separate reliable ordered byte-stream behavior on one live TCP connection from end-to-end application delivery across reconnects, proxies, partitions, and unknown remote outcomes.
        practical: Use a fault proxy to add delay, loss, reset, duplication, and partition behavior and verify bounded retries and idempotent state.
        interview: Explain why a client timeout cannot reveal whether the server committed and why TCP does not give exactly-once requests.
      - title: Physical clocks, monotonic time, NTP, clock skew, and timestamp hazards
        behind_the_scenes: Distinguish wall-clock adjustment from monotonic duration measurement and trace how skew, leap behavior, suspension, and uncertainty break ordering, expiry, and lease assumptions.
        practical: Simulate clock jumps and skew in expiry, token, audit, and last-write-wins logic and replace unsafe duration measurements with monotonic time.
        interview: Explain why timestamps from different machines cannot safely establish causality or precise global order without stronger assumptions.
      - title: Logical clocks, happens-before, Lamport clocks, vector clocks, and hybrid logical clocks
        behind_the_scenes: Derive causal partial order from local sequencing and message edges, then compare scalar logical order, vector concurrency detection, and physical-logical timestamp compromise.
        practical: Implement Lamport and vector-clock updates for three processes and identify causal, concurrent, and arbitrarily tie-broken events.
        interview: Explain what each logical clock can infer and what it cannot reconstruct about real time or causality.
      - title: Latency distributions, percentiles, tail amplification, fan-out, and coordinated omission
        behind_the_scenes: Model response time as a distribution whose tail compounds across parallel dependencies and whose measurement can hide stalls when the load generator waits before sending.
        practical: Generate latency distributions, fan out to dependencies, compare p50 through p99.9, and measure open-loop versus closed-loop load.
        interview: Explain why averages hide user pain and estimate how dependency fan-out changes tail latency.
      - title: Timeouts, deadlines, budget propagation, cancellation, and cleanup
        behind_the_scenes: Turn a caller's total willingness to wait into a propagated remaining budget while stopping queued, active, and downstream work and releasing resources after cancellation.
        practical: Implement a nested operation with one deadline, per-stage reserve, abort propagation, server-side cancellation, and leak checks.
        interview: Choose timeout boundaries from latency and capacity evidence and explain why independent per-hop timeouts can exceed the user deadline.
      - title: Retries, exponential backoff, jitter, retry budgets, and hedged requests
        behind_the_scenes: Reattempt only transient and safe work within one deadline while randomizing schedules, limiting amplification, honoring server guidance, and comparing duplicate hedges with tail reduction.
        practical: Build a retry simulator with exponential backoff and jitter, inject failures, and graph attempts, success, added load, and deadline consumption.
        interview: Explain when retries improve reliability, when they worsen overload, and how idempotency and retry budgets change the decision.
      - title: Overload control, bounded queues, backpressure, admission, load shedding, and degradation
        behind_the_scenes: Detect saturation before latency explodes, keep queues finite, push pressure upstream, reject low-value work early, and serve a cheaper mode inside known capacity.
        practical: Load a service past saturation and compare unbounded queues with concurrency limits, admission control, shedding, and graceful degradation.
        interview: Design overload behavior and explain why autoscaling alone cannot repair an already cascading system.
      - title: Circuit breakers, bulkheads, health checks, dependency isolation, and recovery
        behind_the_scenes: Bound failure propagation through separate resource pools and temporary call suppression while using realistic readiness and cautious recovery probes instead of binary magical health.
        practical: Isolate two dependencies with bulkheads, open a breaker from rolling evidence, test half-open recovery, and prevent probe traffic from causing an outage.
        interview: Explain circuit-breaker states and tradeoffs and distinguish dependency health from service readiness and end-to-end correctness.
      - title: Idempotency, deduplication, commutativity, monotonic operations, and exactly-once claims
        behind_the_scenes: Seek operations whose repeated or reordered application converges, otherwise record stable identities and effects atomically within a clearly bounded system.
        practical: Compare set-add, increment, and transfer operations under duplicates and implement the minimum state needed for safe replay.
        interview: Challenge an exactly-once claim by naming the boundary, failure window, stored identity, transactional scope, and external side effects.
      - title: Queues, publish-subscribe, logs, streams, commands, and events
        behind_the_scenes: Match communication topology and retention to intent: exclusive work, fan-out notification, replayable ordered history, requested action, or immutable fact.
        practical: Model one workflow using a queue and a partitioned log and compare consumer independence, replay, ordering, retention, and operational cost.
        interview: Choose a messaging primitive from delivery, replay, fan-out, ordering, throughput, and ownership requirements.
      - title: Broker internals, acknowledgements, visibility, offsets, retention, and flow control
        behind_the_scenes: Trace publication into durable broker storage, partition ownership, delivery position, in-flight state, acknowledgement or offset commit, redelivery, retention, and producer or consumer pressure.
        practical: Observe messages through publish, storage, fetch, processing, acknowledgement, crash, redelivery, and retention expiry with lag metrics.
        interview: Explain how queue visibility timeouts differ from log offsets and how both can duplicate processing.
      - title: Delivery semantics, at-most-once, at-least-once, redelivery, and duplicate effects
        behind_the_scenes: Place the acknowledgement before or after the side effect and show how each crash window trades message loss against duplicate work.
        practical: Crash a consumer at every boundary around processing and acknowledgement and verify the claimed delivery semantics against business state.
        interview: Derive delivery guarantees from failure windows rather than vendor labels and design an idempotent consumer.
      - title: Ordering, partitions, consumer groups, rebalancing, and parallelism
        behind_the_scenes: Preserve order only inside the selected partition while assigning partitions to consumers, moving ownership, pausing delivery, and controlling work that outlives a rebalance.
        practical: Partition by aggregate identity, scale a consumer group, trigger rebalances, and prove per-key order without globally serializing throughput.
        interview: Explain the relationship among partition count, ordering scope, consumer parallelism, and hot keys.
      - title: Poison messages, retry topics, dead-letter queues, quarantine, and replay
        behind_the_scenes: Classify transient from permanent failure, prevent one record from blocking a partition forever, preserve context, control retries, and repair or replay without surprising duplicates.
        practical: Route malformed and dependency-failing events through bounded retry and quarantine, fix one case, and replay it under change control.
        interview: Design poison-message handling and explain why a dead-letter queue without ownership and replay procedure is only hidden data loss.
      - title: Transactional outbox, inbox, CDC, atomic publication, and idempotent consumers
        behind_the_scenes: Commit domain state and an outgoing event record together, publish it at least once from change data, and atomically record incoming identities with local effects.
        practical: Build an outbox relay and inbox consumer, crash each step, and prove no committed intent is lost and no duplicate business effect survives.
        interview: Explain which dual-write gap the outbox closes, which duplicates remain, and how CDC position and schema evolution are managed.
      - title: Sagas, compensating actions, orchestration, choreography, and workflow durability
        behind_the_scenes: Coordinate local transactions through durable forward steps and semantic compensation while persisting workflow state, timers, retries, human intervention, and irreversible boundaries.
        practical: Implement an order saga with orchestration, compensation, idempotent steps, timeout, manual repair, and a complete execution history.
        interview: Compare orchestration and choreography and explain why compensation is a business action rather than database rollback.
      - title: Distributed transactions, two-phase commit, coordinator failure, blocking, and alternatives
        behind_the_scenes: Separate prepare from commit so participants promise recoverable decisions, then examine coordinator logs, in-doubt locks, recovery, heuristic hazards, and availability cost.
        practical: Simulate two-phase commit with a failed coordinator and compare it with one-owner, outbox, and saga designs for the same invariant.
        interview: Explain 2PC safety and blocking behavior and choose it only when its atomicity boundary and operational cost are justified.
      - title: Single-leader replication, WAL, commit index, follower lag, failover, and read scaling
        behind_the_scenes: Order writes through one leader, ship a replicated log, define acknowledgement quorum, replay on followers, route reads by freshness need, and promote without accepting stale leadership.
        practical: Simulate leader writes, delayed followers, acknowledged positions, failover, and read-your-writes routing with measured data-loss and staleness windows.
        interview: Explain synchronous versus asynchronous replication and why replicas improve some read capacity but not arbitrary write throughput.
      - title: Multi-leader replication, conflict detection, resolution, topology, and convergence
        behind_the_scenes: Accept writes at multiple leaders and reconcile concurrent versions using causal metadata, deterministic merge, application rules, or explicit conflict while preventing loops.
        practical: Run two writable regions through a partition, create concurrent edits, and test conflict detection and a domain-correct merge policy.
        interview: Identify workloads that justify multi-leader writes and explain conflicts that last-write-wins silently destroys.
      - title: Leaderless replication, quorums, sloppy quorums, hinted handoff, and read repair
        behind_the_scenes: Write and read multiple replicas without a permanent leader, compare versioned responses, route around unavailable owners, hand changes back, and repair divergence.
        practical: Simulate N, W, and R choices with node failure, concurrent writes, stale replicas, sloppy placement, and repair.
        interview: Explain why W plus R greater than N is not by itself a universal linearizability proof.
      - title: Consistency models, linearizability, serializability, causal, session, and eventual consistency
        behind_the_scenes: Define legal histories separately for single-object real-time operations, multi-operation transactions, causal dependencies, client sessions, and eventual replica convergence.
        practical: Classify observed histories and implement read-your-writes and monotonic-read tokens over a lagging replica setup.
        interview: Translate product requirements into a named consistency guarantee and distinguish linearizability from serializability.
      - title: CAP theorem, partitions, availability, consistency, and PACELC latency tradeoffs
        behind_the_scenes: During communication partitions choose which requests may complete without violating the required consistency, and during normal operation account for replication latency choices.
        practical: Partition a replicated key-value simulation and document which reads and writes complete, reject, or return stale data under two policies.
        interview: Apply CAP to one operation and failure rather than labeling an entire database with two letters.
      - title: Sharding, partition keys, consistent hashing, rebalancing, hotspots, and scatter-gather
        behind_the_scenes: Map data and requests to owners, move ranges or virtual nodes as capacity changes, preserve routing metadata, and control skew, hot keys, global queries, and cross-shard invariants.
        practical: Design a partition key from workload data, simulate skew and rebalancing, and measure scatter-gather fan-out and tail latency.
        interview: Choose a shard key and explain resharding, hotspot, join, uniqueness, transaction, and routing consequences.
      - title: Consensus, replicated state machines, Raft terms, elections, log replication, and safety
        behind_the_scenes: Elect one leader per term, replicate ordered commands to a majority, commit safely, apply deterministically, and change membership without allowing conflicting committed logs.
        practical: Implement a small Raft state-transition simulator for election and log commit and test stale leaders, split votes, and node recovery.
        interview: Explain what consensus solves, trace a Raft write, and distinguish leader election from failure detection and replication alone.
      - title: Membership, failure detection, leases, distributed locks, fencing, and split brain
        behind_the_scenes: Maintain an imperfect view of live nodes, distinguish suspicion from proof, expire time-bounded authority, and require monotonically fenced resources to reject stale owners.
        practical: Pause a lock holder beyond its lease, elect another, and prove the protected store rejects the old holder's late write.
        interview: Explain why heartbeats and leases cannot prove a node is dead and how quorum and fencing limit split-brain damage.
      - title: Service discovery, DNS, client-side and server-side load balancing, health, and locality
        behind_the_scenes: Resolve changing service instances, refresh cached membership, select endpoints, reuse connections, incorporate readiness and locality, and retry without pinning traffic to failure.
        practical: Compare proxy and client-side balancing under endpoint churn, uneven latency, long-lived connections, and zone failure.
        interview: Trace discovery and load balancing for one request and explain why round robin over addresses may not balance real work.
      - title: Layer 4 and Layer 7 load balancing, transport flows, HTTP routing, algorithms, health checks, affinity, TLS, proxies, and failure modes
        behind_the_scenes: Compare forwarding by IP address and transport port with terminating and routing HTTP requests by host, path, header, method, or content while tracing connection ownership, pooling, source identity, encryption, retries, and target health.
        practical: Route TCP and HTTP workloads through separate balancers, test round-robin and least-outstanding selection, drain a target, break health checks, hold long-lived connections, and inspect packets, headers, logs, and latency distribution.
        interview: Choose Layer 4 or Layer 7 from protocol, routing, performance, TLS, observability, connection, and failure requirements and trace one request in both designs.
      - title: Multi-region architecture, active-passive, active-active, geo-routing, sovereignty, and failover
        behind_the_scenes: Place compute and authoritative data across failure and legal domains while budgeting propagation, writes, failover authority, client routing, recovery, and return to normal.
        practical: Design and game-day a two-region service with stated RPO, RTO, consistency, traffic, capacity, data-residency, and failback behavior.
        interview: Choose active-passive or active-active from product needs and explain the write-conflict and operational costs hidden by the diagram.
      - title: CQRS, event sourcing, materialized views, snapshots, and temporal queries
        behind_the_scenes: Separate command validation from query models and optionally treat an append-only event history as authority while rebuilding projections, evolving events, and snapshotting long streams.
        practical: Build an event-sourced aggregate and rebuild two projections, then test duplicate events, version migration, snapshot restore, and temporal debugging.
        interview: Explain when CQRS or event sourcing earns its complexity and distinguish an event log from ordinary audit logging.
      - title: System design method, requirements, estimation, Little's Law, capacity, and bottlenecks
        behind_the_scenes: Turn functional and quality requirements into workload estimates, invariants, APIs, data ownership, traffic paths, resource budgets, failure behavior, and an evidence-driven evolution plan.
        practical: Lead a timed design using requests per second, object size, retention, concurrency, latency, availability, and cost estimates and identify the first likely bottleneck.
        interview: Structure a collaborative system-design conversation and use rough calculations to challenge rather than decorate architecture choices.
      - title: System design case studies, URL shortener, chat, feed, file processing, and AI inference
        behind_the_scenes: Reuse core mechanisms across read-heavy lookup, ordered messaging, fan-out, durable asynchronous processing, and compute-intensive model serving while changing the dominant constraints.
        practical: Produce concise architectures for all five systems with APIs, data model, capacity, critical path, failure mode, observability, and evolution steps.
        interview: Adapt one system design when the interviewer changes scale, ordering, consistency, latency, geography, or cost requirements.
      - title: Distributed systems production architecture capstone, contracts, resilience, consistency, observability, and evolution
        behind_the_scenes: Integrate versioned APIs, durable commands and events, deadlines, retry and overload budgets, data ownership, replication, recovery, security, tracing, deployment, and capacity evidence.
        practical: Ship a multi-tenant AI processing platform, inject network and regional failures, verify invariants and recovery, and preserve diagrams, traces, load results, SLOs, and an incident runbook.
        interview: Present the system end to end, defend each guarantee at its exact boundary, and evolve the design as constraints change.

  - id: service-architecture-events
    title: Microservices, Domain-Driven Design, and Event-Driven Systems
    tier: core
    goal: Find defensible service and domain boundaries, communicate through durable events, and operate Kafka-based workflows without hiding distributed-system costs.
    topics:
      - title: Microservices, modular monoliths, service boundaries, independent deployment, team ownership, data ownership, and distributed costs
        behind_the_scenes: Separate code organization from process and deployment boundaries while tracing network calls, partial failure, duplicated platform work, coordination, schema evolution, observability, and the evidence required before extracting a service.
        practical: Start with a modular monolith, identify one independently changing business capability, extract it behind a versioned contract, and compare deployment, latency, failure, test, and team costs.
        interview: Choose a monolith, modular monolith, or microservices from domain, team, scale, deployment, consistency, and operational constraints rather than fashion.
      - title: Strategic domain-driven design, domains, subdomains, core domains, supporting domains, generic domains, ubiquitous language, bounded contexts, and context maps
        behind_the_scenes: Collaborate with domain experts to separate business capabilities and models, assign strategic importance, define language inside each boundary, and record upstream and downstream relationships without forcing one enterprise-wide object model.
        practical: Run an event-storming and language exercise for an order platform, classify subdomains, draw bounded contexts and a context map, and identify ambiguous terms and ownership conflicts.
        interview: Derive service candidates from business language and change boundaries and explain why the same real-world entity can have different valid models.
      - title: Tactical domain-driven design, entities, value objects, aggregates, aggregate roots, invariants, repositories, domain services, and application services
        behind_the_scenes: Give identity only where continuity matters, make descriptive values immutable, enforce immediate consistency inside an aggregate, expose changes through its root, and keep orchestration separate from domain decisions and persistence details.
        practical: Model an order aggregate with money and address value objects, enforce transitions, emit a domain event, persist through a repository, and test invariant violations without a framework or database.
        interview: Distinguish entities, value objects, aggregates, domain services, and application services through identity, behavior, consistency, and transaction ownership.
      - title: Commands, domain events, integration events, transactional outbox, idempotent consumers, eventual consistency, and process managers
        behind_the_scenes: Distinguish requested intent from a past domain fact, translate internal events into versioned external contracts after commit, deliver them at least once, suppress duplicate effects, and persist long-running coordination state.
        practical: Place an order, commit its outbox event atomically, publish it twice, process one integration event idempotently, and advance a durable fulfillment process manager through timeout and recovery.
        interview: Trace every failure window from command to integration effect and state exactly where consistency is immediate or eventual.
      - title: Event-driven architecture, producers, consumers, brokers, publish-subscribe, event notification, event-carried state transfer, choreography, and orchestration
        behind_the_scenes: Compare small notifications, self-contained state events, replayable logs, decentralized reactions, and explicit workflow control while accounting for contracts, fan-out, ordering, duplicate delivery, coupling, debugging, and ownership.
        practical: Implement the same fulfillment workflow with choreography and orchestration, inject an unavailable consumer and an out-of-order duplicate event, then compare recovery and trace clarity.
        interview: Choose an event style and coordination model from business ownership, latency, autonomy, consistency, visibility, and change requirements.
      - title: Kafka architecture, brokers, topics, partitions, keys, append-only logs, segments, indexes, retention, and compaction
        behind_the_scenes: Hash event keys to ordered topic partitions, append batches to leader logs, roll segment files and sparse indexes, serve sequential fetches, expire records by policy, and compact older keys while preserving partition offsets.
        practical: Create topics with multiple partitions, publish keyed events, inspect partition placement and offsets, change retention, compact updates and tombstones, and measure how a hot key limits parallelism.
        interview: Trace an event from producer metadata through partition storage to consumer fetch and explain ordering, scale, retention, and compaction boundaries.
      - title: Kafka replication, leaders, followers, in-sync replicas, acknowledgements, min.insync.replicas, controllers, elections, and failure recovery
        behind_the_scenes: Replicate each partition from one leader to followers, track sufficiently caught-up replicas, combine producer acknowledgement with minimum replica policy, elect replacement leaders through cluster metadata, and avoid unsafe recovery claims.
        practical: Run a three-broker lab, stop leaders and followers under different acknowledgement settings, inspect ISR changes and elections, and record which acknowledged events survive.
        interview: Derive Kafka durability and availability from replication factor, acknowledgements, ISR policy, unclean election, and failure timing.
      - title: Kafka producers, batching, compression, idempotence, transactions, consumers, consumer groups, rebalancing, offsets, and ordering
        behind_the_scenes: Accumulate keyed records into compressed batches, retry with producer identity and sequence numbers, optionally commit output and consumed positions transactionally, assign partitions across a group, and recover from stored offsets after rebalancing.
        practical: Tune batch and linger settings, force a retry, compare idempotent and transactional production, scale a consumer group, trigger rebalances, and crash before and after an offset commit.
        interview: Explain duplicates, ordering, parallelism, rebalancing, committed offsets, and the exact boundary of Kafka transactions.
      - title: Event schemas, compatibility, schema registries, poison events, retry topics, replay, observability, testing, and operations
        behind_the_scenes: Give event contracts stable ownership and versions, enforce compatible evolution, quarantine permanent failures, bound transient retries, replay deliberately, and correlate producer, broker, consumer, lag, business outcome, and cost signals.
        practical: Evolve a schema across old and new consumers, reject an incompatible change, quarantine malformed events, replay a repaired range, and load-test lag, rebalance, and recovery dashboards.
        interview: Design production governance for an event platform and diagnose rising lag without assuming the consumer is simply slow.

  - id: quality-security
    title: Testing, Security, Reliability, and SaaS Operations
    tier: core
    goal: Prove systems work, protect important assets, operate common SaaS workflows safely, and recover predictably when they fail.
    topics:
      - title: Test strategy, boundaries, contracts, and test doubles
        behind_the_scenes: Balance confidence, speed, realism, determinism, and maintenance cost.
        practical: Build unit, integration, contract, browser, and smoke-test layers for one system.
        interview: Explain what to test at each boundary and why mocking can mislead.
      - title: Property-based, concurrency, load, chaos, and regression testing
        behind_the_scenes: Explore input spaces, race schedules, capacity limits, and controlled failure.
        practical: Discover edge cases with generators and establish performance regression budgets.
        interview: Design tests for a high-risk or asynchronous feature.
      - title: Threat modeling, secure design, authentication, authorization, and secrets
        behind_the_scenes: Model assets, actors, trust boundaries, attack paths, and layered controls.
        practical: Threat-model each portfolio system and verify high-priority controls.
        interview: Distinguish authentication from authorization and prioritize risks.
      - title: Web, API, dependency, and supply-chain security
        behind_the_scenes: Study injection, request forgery, unsafe deserialization, compromised packages, and build provenance.
        practical: Add security headers, scanning, safe parsing, dependency policy, and adversarial tests.
        interview: Review a vulnerable design and propose layered remediation.
      - title: Reliability targets, observability, incidents, and postmortems
        behind_the_scenes: Connect SLIs, SLOs, error budgets, logs, metrics, traces, alerts, and human response.
        practical: Instrument a service, create actionable alerts, run an incident drill, and write a blameless review.
        interview: Debug an outage and explain reliability tradeoffs.
      - title: Production webhooks, event contracts, signatures, timestamps, replay defense, idempotency, retries, ordering, and secret rotation
        behind_the_scenes: Follow an event from the provider transaction through signing, transport, verification, durable receipt, duplicate delivery, asynchronous processing, and secret rotation without assuming exactly-once delivery.
        practical: Build both sides of a signed webhook, persist the event before acknowledging it, reject stale or altered requests, retry failures, deduplicate repeated delivery, and rotate secrets safely.
        interview: Design a webhook provider and consumer, then explain authenticity, replay protection, acknowledgment timing, retry policy, ordering limits, and event evolution.
      - title: Application file storage, direct uploads, presigned URLs, multipart transfer, validation, malware scanning, metadata, lifecycle, and delivery
        behind_the_scenes: Separate file bytes from database metadata while tracing authorization, temporary upload capability, multipart assembly, content validation, quarantine, object naming, versioning, lifecycle policy, and controlled download.
        practical: Implement a direct-to-object-storage upload flow with short-lived authorization, size and type limits, checksum verification, quarantine scanning, durable metadata, private delivery, and deletion cleanup.
        interview: Design secure large-file upload and download paths and explain why filenames, MIME headers, public buckets, and application-server proxying are unsafe defaults.
      - title: Background jobs, queues, leases, acknowledgements, retries, idempotency, scheduling, dead letters, and worker shutdown
        behind_the_scenes: Follow a committed job through durable enqueue, reservation or visibility lease, execution, heartbeat, acknowledgment, retry, duplicate delivery, dead-letter handling, and graceful worker termination.
        practical: Build a database-backed worker, crash it after a side effect, recover the expired lease, prove idempotency, move poison work aside, and stop without losing in-flight state.
        interview: Explain at-least-once delivery, why exactly-once is usually a business invariant, and how leases, backoff, concurrency, and shutdown interact.
      - title: Audit logs, actors, actions, targets, outcomes, correlation, tamper evidence, retention, privacy, and investigation
        behind_the_scenes: Model an audit event as security evidence with an authenticated actor, attempted action, affected target, outcome, request correlation, trusted time, append-only storage, controlled access, and policy-driven retention.
        practical: Instrument privileged changes, redact sensitive values, link events across services, detect a broken hash chain, export an investigation timeline, and test retention and access controls.
        interview: Distinguish audit logs from application logs and explain completeness, integrity, privacy, searchable structure, and incident use.
      - title: Admin systems, privileged workflows, RBAC, impersonation, approvals, bulk operations, safety rails, and observability
