        practical: Build a protected admin action with deny-by-default RBAC, step-up authentication, dry-run preview, explicit confirmation, idempotent execution, immutable audit evidence, and a reversible result.
        interview: Design an internal admin system and defend its trust boundaries, authorization model, impersonation controls, dangerous bulk-action safeguards, and operational monitoring.

  - id: cloud-aws
