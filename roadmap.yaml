  - id: devops
    title: DevOps Complete Deep Dive
    tier: core
    goal: Build fast, safe, observable delivery systems that improve flow without separating development from operations.
    topics:
      - title: DevOps principles, CALMS, flow, feedback, learning, ownership, and socio-technical systems
        behind_the_scenes: Connect team boundaries, work queues, automation, measurement, and learning loops to delivery outcomes.
        practical: Map one product's idea-to-production value stream and quantify its delays, handoffs, failures, and feedback.
        interview: Explain DevOps as an operating model rather than a job title or toolchain.
      - title: Linux processes, systemd, services, users, permissions, signals, limits, and resource diagnosis
        behind_the_scenes: Trace service startup, process identity, file permissions, signals, cgroups, descriptors, CPU, memory, and exit state.
        practical: Diagnose and repair a service that fails startup, exhausts a resource, and ignores graceful termination.
        interview: Use OS evidence to explain a production symptom from process to kernel boundary.
      - title: Networking diagnostics, DNS, routing, TCP, TLS, HTTP, proxies, load balancers, and timeouts
        behind_the_scenes: Follow name resolution, packets, handshakes, certificates, protocol messages, proxy hops, and deadline budgets.
        practical: Diagnose five connectivity failures using dig, ip, ss, curl, openssl, packet capture, and application logs.
        interview: Give a layered network-debugging sequence without guessing.
      - title: Shell automation, strict mode, quoting, pipes, exit codes, idempotency, traps, and portable scripts
        behind_the_scenes: Understand expansion, word splitting, process pipelines, environment inheritance, failure propagation, and cleanup.
        practical: Write a safe deployment script with validation, dry-run, traps, structured output, and repeatable behavior.
        interview: Explain common shell failure modes and when to replace a script with a real program.
      - title: Git workflows, trunk-based development, branches, pull requests, reviews, rebasing, releases, and recovery
        behind_the_scenes: Connect commits and refs to integration frequency, conflict cost, review latency, release history, and recovery.
        practical: Design a small-batch workflow with protected main, required evidence, release tags, and reversible mistakes.
        interview: Compare trunk-based and long-lived branching strategies using team and deployment constraints.
      - title: CI pipeline graphs, triggers, runners, jobs, matrices, caches, artifacts, concurrency, and reproducibility
        behind_the_scenes: Trace one commit through event matching, runner isolation, dependency restore, parallel jobs, artifacts, and result aggregation.
        practical: Build a matrix pipeline with deterministic caches, immutable artifacts, cancellation, and failure diagnostics.
        interview: Explain cache versus artifact and diagnose a flaky or unexpectedly slow pipeline.
      - title: Automated testing strategy, unit, integration, contract, end-to-end, performance, and quality gates
        behind_the_scenes: Place tests at boundaries that provide fast, trustworthy feedback while controlling environment and data variance.
        practical: Design a staged test pipeline that blocks real regressions without making every commit wait for everything.
        interview: Defend test distribution, quarantine policy, and release gates using failure-detection value.
      - title: Software supply chain, dependency trust, SBOMs, provenance, signing, attestations, and SLSA concepts
        behind_the_scenes: Follow source and dependencies into a build identity, artifact digest, metadata, signature, verification, and deployment policy.
        practical: Generate an SBOM, scan and sign an artifact, attach provenance, and reject an unverified deployment.
        interview: Explain why vulnerability scanning alone does not establish artifact trust.
      - title: CI identity, OIDC federation, secrets, environments, approvals, least privilege, and runner security
        behind_the_scenes: Trace workflow identity claims into short-lived credentials and protected environment policy without stored cloud keys.
        practical: Configure OIDC-based deployment with branch restrictions, approvals, minimal permissions, and secret-leak tests.
        interview: Threat-model a CI runner and explain how pull requests can become credential attacks.
      - title: Artifact repositories, semantic versioning, immutable releases, promotion, retention, and rollback identity
        behind_the_scenes: Separate building once from promoting the same digest through environments and retaining provenance for recovery.
        practical: Publish versioned packages and images, promote by digest, enforce immutability, and restore a prior release.
        interview: Explain why rebuilding per environment destroys confidence and complicates rollback.
      - title: Configuration, environment variables, feature flags, secrets, dynamic config, validation, and drift
        behind_the_scenes: Distinguish deployable artifact from runtime configuration and trace config ownership, rollout, audit, and failure.
        practical: Build typed configuration with safe defaults, secret injection, flag cleanup, and environment-drift detection.
        interview: Compare configuration, secrets, and feature flags and describe their failure modes.
      - title: Deployment strategies, rolling, recreate, blue-green, canary, feature release, health checks, and rollback
        behind_the_scenes: Trace traffic and versions through admission, readiness, rollout steps, observation, promotion, abort, and draining.
        practical: Implement a canary with automated analysis and deliberately fail health and business metrics.
        interview: Choose a deployment strategy based on state, capacity, compatibility, and risk.
      - title: Database delivery, expand-contract migrations, backward compatibility, data backfills, locks, and rollback
        behind_the_scenes: Coordinate application versions with schema state while controlling locks, replication, long transactions, and irreversible data changes.
        practical: Ship a zero-downtime field replacement across old and new services with a resumable backfill.
        interview: Explain why application rollback does not automatically roll back data safely.
      - title: Observability, SLIs, SLOs, error budgets, metrics, logs, traces, alerts, and dashboards
        behind_the_scenes: Turn user-visible behavior into bounded telemetry, aggregation, alert state, investigation context, and prioritization.
        practical: Define SLOs and actionable burn-rate alerts, then debug one request across logs, metrics, and traces.
        interview: Distinguish monitoring from observability and explain an error budget's decision value.
      - title: Incident response, severity, command, communication, mitigation, recovery, and blameless postmortems
        behind_the_scenes: Trace detection through triage, role assignment, hypothesis testing, risk-controlled mitigation, stakeholder updates, and learning.
        practical: Run a timed incident exercise and produce a causal postmortem with owned follow-up work.
        interview: Describe an incident using evidence, decisions, tradeoffs, impact, and systemic improvements.
      - title: Capacity planning, load testing, queues, saturation, autoscaling, performance budgets, and load shedding
        behind_the_scenes: Connect arrival rate, service time, concurrency, bottlenecks, queue growth, resource limits, and scaling delay.
        practical: Load-test a service to saturation, identify the limiting resource, and design safe overload behavior.
        interview: Explain why autoscaling cannot rescue every overload and how to establish capacity headroom.
      - title: Infrastructure as code, desired state, plans, modules, state, drift, policy checks, and change review
        behind_the_scenes: Trace declarative configuration through dependency graph, provider APIs, recorded state, partial failure, and reconciliation.
        practical: Review and apply a staged infrastructure plan with policy tests, drift detection, import, and recovery.
        interview: Explain IaC state, replacement risk, module boundaries, and why plans are evidence not guarantees.
      - title: Platform engineering, internal developer platforms, golden paths, self-service, APIs, scorecards, and product thinking
        behind_the_scenes: Treat platform capabilities as products that reduce cognitive load while preserving escape hatches and operational ownership.
        practical: Design a paved road for deploying a service with measurable adoption, lead-time, reliability, and satisfaction outcomes.
        interview: Distinguish platform engineering from central ticket queues and premature abstraction.
      - title: DevSecOps, threat modeling, secure defaults, policy as code, compliance evidence, and vulnerability response
        behind_the_scenes: Integrate risk analysis and controls across design, code, build, artifact, deployment, runtime, audit, and remediation.
        practical: Threat-model a pipeline, encode critical policies, test bypasses, and rehearse response to a vulnerable dependency.
        interview: Explain how security gates can improve flow rather than become ceremonial blockers.
      - title: DevOps production delivery capstone, value stream, pipeline, infrastructure, observability, incident, and improvement
        behind_the_scenes: Connect human workflow, source, CI, artifact, infrastructure, rollout, telemetry, failure, recovery, and learning metrics.
        practical: Deliver a service through a secure pipeline, inject a release failure, recover it, and quantify flow and reliability changes.
        interview: Defend an end-to-end delivery system using lead time, failure rate, recovery, reliability, and developer experience.

  - id: docker
    title: Docker Complete Deep Dive
    tier: core
    goal: Build, secure, debug, distribute, and operate production container images with a clear Linux isolation model.
    topics:
      - title: Docker architecture, client, daemon, API, containerd, runc, registries, and object lifecycle
        behind_the_scenes: Trace a CLI request through the daemon and runtime into image, container, network, and volume objects.
        practical: Inspect Docker contexts, API events, daemon state, containerd tasks, and the lifecycle of one container.
        interview: Explain what Docker adds around Linux containers and where OCI runtimes fit.
      - title: Images, containers, read-only layers, writable layers, content digests, tags, and lifecycle
        behind_the_scenes: Follow content-addressed blobs and configuration into an image manifest and a running container snapshot.
        practical: Build, tag, inspect, run, modify, stop, remove, and compare image and container state by digest.
        interview: Distinguish image, container, layer, tag, digest, and writable state.
      - title: Dockerfile FROM, RUN, COPY, ADD, WORKDIR, USER, ENV, ARG, EXPOSE, and metadata
        behind_the_scenes: Understand how instructions create build graph nodes, filesystem changes, configuration, and cache inputs.
        practical: Author a deterministic Dockerfile and inspect the resulting history, config, user, environment, and filesystem.
        interview: Explain instruction semantics and common security or cache mistakes.
      - title: Build context, .dockerignore, layers, cache keys, invalidation, ordering, and reproducible builds
        behind_the_scenes: Trace context transfer and instruction inputs into cached or rebuilt layer results.
        practical: Reduce context size and rebuild time while proving dependency changes invalidate the correct layer.
        interview: Explain why Dockerfile order affects speed but not necessarily final correctness.
      - title: BuildKit, multi-stage builds, named stages, targets, cache mounts, secret mounts, SSH mounts, and outputs
        behind_the_scenes: Follow the build DAG rather than a linear legacy build and keep credentials outside layer history.
        practical: Build test, debug, and minimal production targets with dependency caches and ephemeral build secrets.
        interview: Explain how multi-stage builds reduce attack surface and why copying from a stage is selective.
      - title: CMD, ENTRYPOINT, exec form, shell form, arguments, environment expansion, and overrides
        behind_the_scenes: Trace image configuration and docker run arguments into the exact process argv and shell behavior.
        practical: Build an image whose defaults are useful, overridable, signal-safe, and free of quoting surprises.
        interview: Compare CMD and ENTRYPOINT and explain exec versus shell form.
      - title: PID 1, signals, process reaping, init, graceful shutdown, stop timeout, and application lifecycle
        behind_the_scenes: Understand special PID 1 signal behavior, orphan adoption, zombie reaping, termination, and forced kill.
        practical: Reproduce lost signals and zombies, then repair the image with exec form, application handling, or a tiny init.
        interview: Explain why an application that shuts down locally may fail inside a container.
      - title: Linux namespaces, cgroups, capabilities, seccomp, AppArmor, SELinux, and container isolation
        behind_the_scenes: Map process views, resource accounting, privileges, syscall filtering, and mandatory access controls to kernel enforcement.
        practical: Inspect namespace IDs and cgroups, drop capabilities, apply resource limits, and trigger a blocked syscall.
        interview: Explain what containers isolate, what they share with the host, and why they are not virtual machines.
      - title: Rootless Docker, user namespaces, non-root users, read-only filesystems, no-new-privileges, and hardening
        behind_the_scenes: Trace container and host identities, privilege mapping, filesystem writes, daemon authority, and escalation paths.
        practical: Run a rootless or hardened non-root container with minimal capabilities and writable tmpfs only where required.
        interview: Distinguish root in a container from root on the host and explain the Docker socket risk.
      - title: Docker networking, bridge, host, none, user-defined networks, DNS, NAT, published ports, and IPv6
        behind_the_scenes: Follow a packet through container interfaces, bridge, embedded DNS, iptables or nftables, address translation, and host sockets.
        practical: Connect two services privately, publish only the frontend, inspect routes and DNS, and diagnose a failed connection.
        interview: Explain why localhost inside a container is not the host and how port publishing works.
      - title: Overlay filesystems, container writable state, volumes, bind mounts, tmpfs, ownership, backup, and performance
        behind_the_scenes: Compare copy-on-write layers with Docker-managed and host-path storage lifecycles and consistency.
        practical: Persist database state in a volume, mount source for development, use tmpfs for secrets, and restore a backup.
        interview: Choose among image data, writable layer, volume, bind mount, and tmpfs.
      - title: Docker Compose services, projects, networks, volumes, profiles, dependencies, environment, and overrides
        behind_the_scenes: Trace Compose model merging into Docker API objects and distinguish startup ordering from actual readiness.
        practical: Define a local full-stack AI environment with profiles, health-gated dependencies, isolated networks, and persistent data.
        interview: Explain what Compose solves and why it is not equivalent to production orchestration.
      - title: Health checks, readiness, startup ordering, restart policies, dependency failure, and self-healing limits
        behind_the_scenes: Understand health command execution, status transitions, restart decisions, Compose dependency conditions, and external routing.
        practical: Make a dependent service wait for real readiness and observe behavior during unhealthy and crashed states.
        interview: Distinguish process running, container healthy, and application ready.
      - title: Container logs, stdout, stderr, logging drivers, docker stats, events, metrics, and retention
        behind_the_scenes: Follow process file descriptors through the logging driver and daemon while cgroup metrics expose resource use.
        practical: Emit structured logs, configure rotation, correlate events, and diagnose CPU, memory, disk, and log growth.
        interview: Explain why writing application logs only inside a container is operationally fragile.
      - title: Container debugging, inspect, logs, exec, top, diff, events, network namespaces, and minimal images
        behind_the_scenes: Gather evidence from metadata, process state, filesystem changes, sockets, namespaces, and daemon events without mutating blindly.
        practical: Diagnose a crash loop, missing file, DNS failure, permission error, and distroless image using ephemeral tools.
        interview: Give a layered container debugging workflow that preserves evidence.
      - title: Registries, repositories, tags, digests, authentication, push, pull, garbage collection, and retention
        behind_the_scenes: Follow manifests and blobs through content-addressed upload, tag mutation, authentication, authorization, and cleanup.
        practical: Publish by immutable digest, restrict access, test tag movement, and define safe retention.
        interview: Explain why deploying latest is unsafe and how digest pinning changes rollback.
      - title: Multi-platform images, buildx, builders, emulation, cross-compilation, manifests, and platform selection
        behind_the_scenes: Trace platform-specific builds into an OCI image index and runtime manifest selection.
        practical: Produce amd64 and arm64 images, inspect the manifest list, and test native versus emulated builds.
        interview: Explain multi-architecture images and when emulation can hide performance or correctness problems.
      - title: Container supply-chain security, base images, vulnerabilities, SBOMs, provenance, signing, and policy
        behind_the_scenes: Connect source and base-image identity to built layers, scanner databases, SBOM components, attestations, signatures, and admission.
        practical: Pin a minimal base by digest, scan it, generate an SBOM, sign the image, and verify policy before run.
        interview: Explain why small images, scanning, signing, and provenance solve different risks.
      - title: Production image optimization, dependency caching, distroless, resource limits, immutability, and operational tradeoffs
        behind_the_scenes: Balance size, startup, debugging, compatibility, patching, memory, CPU, filesystem, and observability.
        practical: Reduce an application image and attack surface while retaining health, certificates, time zones, and diagnosis paths.
        interview: Defend a production image design beyond saying use Alpine or multi-stage builds.
      - title: Docker production capstone, build, Compose, security, networking, storage, observability, and incident diagnosis
        behind_the_scenes: Trace source through BuildKit, registry, runtime isolation, service communication, data persistence, telemetry, failure, and recovery.
        practical: Containerize a full-stack AI slice, sign it, run it least-privileged, inject failures, restore data, and present evidence.
        interview: Diagnose and defend the entire container lifecycle in a senior infrastructure interview.

  - id: kubernetes
    title: Kubernetes Complete Deep Dive
    tier: core
    goal: Design, deploy, secure, debug, and operate Kubernetes workloads while understanding its API-driven reconciliation model.
    topics:
      - title: Kubernetes purpose, declarative APIs, desired state, control plane, nodes, workloads, and orchestration tradeoffs
        behind_the_scenes: Connect API objects, persistent desired state, controllers, scheduling, node agents, and container runtimes.
        practical: Draw and inspect a local cluster, then justify when a simpler platform would be operationally better.
        interview: Explain Kubernetes without calling it merely a container manager.
      - title: Kubernetes objects, apiVersion, kind, metadata, spec, status, UIDs, generations, resource versions, and etcd
        behind_the_scenes: Follow serialized objects through API validation, durable storage, optimistic concurrency, watch events, and status updates.
        practical: Create and patch an object while observing generation, resourceVersion, managed fields, status, and watch output.
        interview: Explain spec versus status and how resourceVersion prevents lost updates.
      - title: API server, authentication, authorization, admission, validation, conversion, persistence, and audit
        behind_the_scenes: Trace an API request through TLS identity, impersonation, RBAC, admission plugins or webhooks, schema handling, etcd, and audit.
        practical: Submit allowed, forbidden, mutated, and rejected requests and correlate each decision with audit evidence.
        interview: Explain the exact Kubernetes API request path and extension risks.
      - title: Controllers, reconciliation loops, watches, work queues, owner references, finalizers, and garbage collection
        behind_the_scenes: Follow desired and observed state through watch events, queued keys, idempotent reconcile, retries, ownership, and deletion.
        practical: Implement or simulate a small controller and diagnose a resource stuck on a finalizer.
        interview: Explain level-triggered reconciliation and why controllers must be idempotent.
      - title: Scheduler, pending Pods, filtering, scoring, binding, requests, constraints, plugins, and scheduling failure
        behind_the_scenes: Trace an unscheduled Pod through queue, feasible-node filtering, scoring, reserve, permit, bind, and retry.
        practical: Force and diagnose scheduling decisions using requests, selectors, affinity, taints, topology, and events.
        interview: Explain why a Pod is Pending even when cluster CPU appears available.
      - title: Nodes, kubelet, CRI, container runtime, pod sandbox, image pulls, status, leases, and node failure
        behind_the_scenes: Follow an assigned Pod through kubelet sync, runtime calls, sandbox networking, containers, probes, status, and eviction.
        practical: Inspect kubelet and runtime state and diagnose NotReady, image pull, sandbox, and node-pressure failures.
        interview: Separate control-plane, kubelet, runtime, and CNI responsibilities.
      - title: Pods, shared network, volumes, lifecycle, restart policy, init containers, sidecars, and ephemeral containers
        behind_the_scenes: Understand the Pod sandbox, colocated process namespaces, container sequencing, restart behavior, and shared resources.
        practical: Build a multi-container Pod with init, sidecar, shared volume, lifecycle hooks, and ephemeral debugging.
        interview: Explain why the Pod is Kubernetes' scheduling unit and when multiple containers belong together.
      - title: Startup, readiness, liveness probes, conditions, readiness gates, termination, grace periods, and draining
        behind_the_scenes: Trace probe results into container restart and EndpointSlice readiness while termination hooks and signals drain work.
        practical: Configure all three probes, break each independently, and observe traffic, restart, and shutdown behavior.
        interview: Explain how a bad liveness probe can create an outage.
      - title: Deployments, ReplicaSets, rolling updates, maxSurge, maxUnavailable, progress, pause, and rollback
        behind_the_scenes: Follow template changes through new ReplicaSet scaling, availability constraints, readiness, progress deadlines, and revision history.
        practical: Perform, pause, fail, diagnose, and roll back a zero-downtime deployment.
        interview: Trace a Deployment rollout and identify why it can stall.
      - title: StatefulSets, stable identity, ordered rollout, headless Services, persistent storage, and failure recovery
        behind_the_scenes: Connect Pod ordinals, DNS identity, PVC retention, ordered transitions, partitions, and application-level replication.
        practical: Deploy a small stateful cluster, replace a Pod and node, and verify identity and data behavior.
        interview: Compare StatefulSet and Deployment without claiming Kubernetes makes databases safe automatically.
      - title: DaemonSets, node-local agents, update strategies, tolerations, priority, and system workload safety
        behind_the_scenes: Trace eligible nodes into one Pod per node and coordinate critical agents with upgrades, taints, and resource pressure.
        practical: Deploy a node log or metrics agent and perform a controlled rolling update.
        interview: Choose DaemonSet versus Deployment and explain its scheduling exceptions.
      - title: Jobs, CronJobs, completions, parallelism, backoff, deadlines, concurrency policy, and failure handling
        behind_the_scenes: Follow batch Pods through success counting, retry, replacement, scheduling, history, cleanup, and duplicate execution.
        practical: Build an idempotent parallel Job and CronJob with deadlines, failure policy, and safe overlap behavior.
        interview: Explain why Kubernetes Job retries require idempotent work.
      - title: Services, ClusterIP, NodePort, LoadBalancer, EndpointSlices, selectors, kube-proxy, and traffic policies
        behind_the_scenes: Trace stable virtual service identity into ready endpoint selection and node-level forwarding or proxy rules.
        practical: Expose a Deployment, inspect EndpointSlices and data-plane rules, then break selector and readiness behavior.
        interview: Explain how a Service reaches ephemeral Pods and where load balancing occurs.
      - title: Ingress, ingress controllers, Gateway API, routes, listeners, TLS, load balancers, and north-south traffic
        behind_the_scenes: Distinguish API configuration from the controller and external load balancer that implement routing.
        practical: Route multiple hosts and paths with TLS, policy attachment, health, and safe controller boundaries.
        interview: Compare Service LoadBalancer, Ingress, and Gateway API.
      - title: Cluster DNS, CoreDNS, Service discovery, search domains, ndots, caching, and DNS debugging
        behind_the_scenes: Follow Pod resolver configuration through search expansion, CoreDNS plugins, Service records, upstream DNS, and caches.
        practical: Diagnose slow or failed service discovery using resolv.conf, dig, CoreDNS logs, endpoints, and network policy.
        interview: Explain common Kubernetes DNS latency and lookup failures.
      - title: Kubernetes network model, CNI, Pod IPs, routing, encapsulation, NetworkPolicy, ingress, egress, and isolation
        behind_the_scenes: Trace sandbox interface creation and packets across nodes while policy selectors determine allowed directions.
        practical: Apply default deny, permit explicit application flows and DNS, and diagnose blocked traffic.
        interview: Explain CNI versus NetworkPolicy enforcement and why policies may appear ineffective.
      - title: ConfigMaps, Secrets, environment variables, projected volumes, Downward API, reload, encryption, and external secret stores
        behind_the_scenes: Trace configuration from API storage into kubelet projection and process consumption, including update and exposure behavior.
        practical: Inject typed config and rotated secrets without image rebuilds and verify reload and audit behavior.
        interview: Explain why Kubernetes Secrets are not automatically secure and environment updates are not live.
      - title: CPU and memory requests, limits, cgroups, QoS classes, throttling, OOM, eviction, and resource diagnosis
        behind_the_scenes: Connect scheduling requests to node admission and runtime limits to kernel enforcement, pressure, and eviction priority.
        practical: Trigger CPU throttling, container OOM, and node-pressure eviction, then right-size using measurements.
        interview: Explain requests versus limits and why low CPU usage can coexist with latency.
      - title: PersistentVolumes, PVCs, StorageClasses, CSI, dynamic provisioning, access modes, reclaim policy, and snapshots
        behind_the_scenes: Follow a claim through binding or provisioning, volume attachment, node mount, Pod mount, snapshot, and deletion lifecycle.
        practical: Provision, snapshot, restore, expand, and safely delete persistent storage while observing reclaim behavior.
        interview: Distinguish PV, PVC, StorageClass, CSI, and application-level data protection.
      - title: Namespaces, labels, selectors, annotations, quotas, LimitRanges, multi-tenancy, and isolation boundaries
        behind_the_scenes: Understand organizational scope, policy selection, default resource constraints, cluster-scoped exceptions, and noisy-neighbor risks.
        practical: Create a tenant namespace with quotas, defaults, labels, RBAC, network policy, and storage controls.
        interview: Explain what namespaces isolate and what they do not.
      - title: ServiceAccounts, RBAC Roles, ClusterRoles, bindings, verbs, resources, subresources, and least privilege
        behind_the_scenes: Trace workload token identity through API authentication and additive RBAC authorization rules.
        practical: Grant one controller only the API operations it needs and prove escalation and cross-namespace actions fail.
        interview: Diagnose Forbidden and explain Role versus ClusterRole and binding scope.
      - title: SecurityContext, users, groups, capabilities, seccomp, AppArmor, Pod Security Standards, and admission
        behind_the_scenes: Map Pod declarations into runtime identity and kernel restrictions while admission enforces cluster policy.
        practical: Harden a workload to restricted standards with non-root, read-only filesystem, dropped capabilities, and seccomp.
        interview: Explain defense in depth from admission to runtime and host kernel.
      - title: Horizontal Pod Autoscaler, Vertical Pod Autoscaler, cluster autoscaling, metrics, stabilization, and scaling limits
        behind_the_scenes: Follow metrics through control loops, desired replica calculation, cooldown, Pod requests, pending capacity, and node provisioning.
        practical: Load-test HPA and node scaling, then diagnose oscillation, missing metrics, and unschedulable replicas.
        interview: Explain why HPA depends on correct requests and how scaling loops interact.
      - title: Affinity, anti-affinity, topology spread, taints, tolerations, priority, preemption, disruption budgets, and drains
        behind_the_scenes: Combine placement preferences and constraints with disruption and resource pressure during scheduling and maintenance.
        practical: Spread replicas across zones, reserve special nodes, protect availability, and safely drain a node.
        interview: Design placement and disruption policy without making workloads unschedulable.
      - title: Kubernetes observability, events, logs, metrics, API audit, traces, control-plane signals, and SLOs
        behind_the_scenes: Trace application and cluster signals from Pods, kubelet, controllers, API server, scheduler, and infrastructure into telemetry systems.
        practical: Build dashboards and alerts for user symptoms and cluster causes with bounded labels and correlated traces.
        interview: Diagnose a cluster incident using events, metrics, logs, and control-plane evidence.
      - title: Kubernetes debugging, Pending, ImagePullBackOff, CrashLoopBackOff, OOMKilled, DNS, networking, storage, and nodes
        behind_the_scenes: Connect status, conditions, events, logs, previous logs, probes, scheduling, runtime, network, storage, and node evidence.
        practical: Work through a fault lab containing one failure from every major layer without random restarts.
        interview: Give a repeatable debugging decision tree from symptom to controlling component.
      - title: Helm, charts, templates, values, releases, hooks, dependencies, Kustomize, overlays, and configuration management
        behind_the_scenes: Trace reusable templates or patches into rendered API objects, release state, upgrades, rollback, and ownership conflicts.
        practical: Package an application with safe defaults, schema validation, environment overlays, rendering tests, and rollback.
        interview: Compare Helm and Kustomize and explain template complexity and secret-management risks.
      - title: GitOps, reconciliation, drift, pull-based delivery, CRDs, operators, webhooks, and API extension
        behind_the_scenes: Follow Git intent into cluster reconciliation and custom APIs into controllers, conversion, admission, status, and upgrade obligations.
        practical: Deploy through GitOps, repair drift, and build a minimal CRD/controller contract with safe deletion.
        interview: Explain GitOps security and operator lifecycle costs beyond installing a controller.
      - title: Cluster operations, version skew, upgrades, node replacement, etcd backup, disaster recovery, and EKS boundaries
        behind_the_scenes: Coordinate control plane, nodes, add-ons, APIs, workloads, persistent state, certificates, and provider-managed responsibilities.
        practical: Plan and rehearse an upgrade and recovery, including deprecated APIs, drain, add-ons, data restore, and rollback limits.
        interview: Explain what EKS manages, what the customer still owns, and how to reduce upgrade risk.
      - title: Kubernetes production capstone, architecture, security, delivery, scaling, observability, failure injection, and operations
        behind_the_scenes: Trace source, image, GitOps, API admission, scheduling, runtime, networking, storage, traffic, telemetry, failure, and recovery.
        practical: Operate a full-stack AI workload with least privilege, progressive delivery, autoscaling, backup, game day, and runbook evidence.
        interview: Defend Kubernetes adoption and diagnose the system across control plane, data plane, and application boundaries.

  - id: ml-foundations
    title: Mathematics and Machine Learning Foundations
    tier: deep
    goal: Understand enough mathematics and ML to reason about model behavior, metrics, and product tradeoffs.
    topics:
      - title: Vectors, matrices, similarity, projections, and probability
        behind_the_scenes: Build intuition for representations, dot products, distributions, conditioning, and uncertainty.
        practical: Implement vector similarity and small probabilistic simulations with NumPy.
        interview: Explain cosine similarity and probability tradeoffs without hiding behind libraries.
      - title: Optimization, gradients, loss functions, regularization, and generalization
        behind_the_scenes: Understand how objectives guide learning and how models overfit.
        practical: Train and diagnose small models while varying data, features, and regularization.
        interview: Connect loss, validation, bias, variance, and generalization.
      - title: Data splits, leakage, imbalance, metrics, and experiment design
        behind_the_scenes: Study how measurement choices create false confidence.
        practical: Design an evaluation with baselines, slices, uncertainty, and leakage checks.
        interview: Choose precision, recall, ranking, or calibration metrics for product costs.
      - title: Classical ML, embeddings, clustering, ranking, and recommendation intuition
        behind_the_scenes: Learn which problems do not require a generative model.
        practical: Build a baseline classifier, semantic search, and ranking experiment.
        interview: Compare a simple model or heuristic with an LLM-based approach.

  - id: llm-internals
    title: LLM and Transformer Internals
    tier: deep
    goal: Explain the path from text to tokens to probabilities and the limits imposed by training and inference.
    topics:
      - title: Tokenization, vocabulary, embeddings, positional information, and context windows
        behind_the_scenes: Trace how text becomes IDs and vectors and why token boundaries affect cost and behavior.
        practical: Inspect tokenizer output across languages, code, whitespace, and adversarial strings.
        interview: Explain tokens, embeddings, and context without anthropomorphism.
      - title: Attention, transformer blocks, residual streams, normalization, and feed-forward layers
        behind_the_scenes: Follow tensor shapes and information flow through a simplified transformer.
        practical: Implement and visualize scaled dot-product attention on a tiny example.
        interview: Explain self-attention, its cost, and why position information is needed.
      - title: Pretraining, next-token prediction, fine-tuning, instruction tuning, and preference optimization
        behind_the_scenes: Separate base-model learning from post-training alignment and product prompting.
        practical: Compare model behavior across instruction and non-instruction checkpoints or documented examples.
        interview: Explain what prompting can and cannot change about a trained model.
      - title: Decoding, temperature, top-p, determinism, caching, batching, and quantization
        behind_the_scenes: Connect logits to sampled output and inference choices to latency, memory, cost, and quality.
        practical: Measure output and latency changes across decoding and serving configurations.
        interview: Explain why temperature is not a factuality control.
      - title: Hallucination, calibration, long-context limits, reasoning claims, and failure analysis
        behind_the_scenes: Understand that fluent generation is not retrieval, verification, or guaranteed reasoning.
        practical: Build a failure taxonomy and adversarial test set for one model feature.
        interview: Describe limitations honestly and propose system-level mitigations.

  - id: ai-application-engineering
    title: AI Application Engineering
    tier: core
    goal: Integrate models into dependable products with explicit contracts, budgets, and fallbacks.
    topics:
      - title: Model APIs, messages, instructions, multimodal inputs, streaming, and provider abstraction
        behind_the_scenes: Trace request construction, inference latency, token accounting, transport, and incremental output.
        practical: Build a streaming typed client with cancellation, retries, timeouts, and provider substitution seams.
        interview: Design a model gateway and explain what should remain provider-specific.
      - title: Prompt design, context engineering, examples, delimiters, and prompt versioning
        behind_the_scenes: Treat prompts as behavior-shaping program inputs with conflicts and limited context.
        practical: Create versioned prompts with test cases and compare changes against a baseline.
        interview: Debug a weak prompt systematically rather than adding vague instructions.
      - title: Structured outputs, schemas, parsing, validation, and repair
        behind_the_scenes: Separate constrained generation from application-level semantic validation.
        practical: Build a typed extraction workflow with refusal, invalid-output, and partial-result handling.
        interview: Explain why valid JSON can still be wrong.
      - title: Tool calling, execution boundaries, permissions, and human approval
        behind_the_scenes: Separate model proposals from trusted application execution and side effects.
        practical: Implement allowlisted tools with validation, idempotency, audit logs, and approval gates.
        interview: Threat-model a tool-using assistant.
      - title: Latency, cost, caching, fallbacks, rate limits, and model routing
        behind_the_scenes: Decompose time-to-first-token, generation time, queueing, token costs, and quality tiers.
        practical: Add budgets, semantic or exact caching, graceful degradation, and usage dashboards.
        interview: Reduce cost or latency without silently harming quality.
      - title: AI frontend streaming, fetch streams, SSE, event framing, incremental state, cancellation, reconnection, and backpressure
        behind_the_scenes: Trace bytes from a model stream through HTTP framing, UTF-8 decoding, event parsing, application message parts, batched rendering, abort propagation, disconnect handling, and slow-consumer limits.
        practical: Build an accessible streaming chat without a framework helper, correctly handle split chunks, cancel generation, reconnect with an event cursor, and measure time to first token and render frequency.
        interview: Explain why network chunks are not messages and design a resilient streaming protocol from server emission to browser state.
      - title: Generative UI, structured message parts, tool calls, human approval, optimistic state, errors, and accessibility
        behind_the_scenes: Keep durable messages separate from transient UI state while a model emits typed text, reasoning, data, citations, and tool-call parts that may require application execution or human approval.
        practical: Render an exhaustive typed message-part state machine, approve a sensitive tool call, reconcile optimistic input with server truth, expose errors, and preserve focus and screen-reader announcements.
        interview: Design generative UI that remains deterministic, secure, recoverable, and accessible when streams or tools fail halfway.
      - title: Conversation persistence, message identity, server authority, resumable streams, authentication, privacy, testing, and evaluation
        behind_the_scenes: Assign stable conversation, message, stream, and request identities so the server can authorize ownership, persist canonical events, resume after disconnect, suppress duplicates, delete private data, and replay deterministic UI state.
        practical: Persist a conversation event log, resume an interrupted stream from the last event ID, prevent cross-user access and duplicate sends, redact logs, test race conditions, and evaluate the complete user journey.
        interview: Explain client versus server authority, message identity, resume semantics, privacy boundaries, and how frontend tests complement model evaluations.

  - id: retrieval-rag
    title: Search, Embeddings, and RAG
    tier: core
    goal: Build retrieval systems whose grounding quality can be measured and improved.
    topics:
      - title: Information retrieval fundamentals, lexical search, dense retrieval, and hybrid search
        behind_the_scenes: Study inverted indexes, BM25 intuition, embeddings, approximate neighbors, and score fusion.
        practical: Compare lexical, vector, and hybrid retrieval on a labeled dataset.
        interview: Explain when embeddings fail and why hybrid retrieval helps.
      - title: Ingestion, parsing, cleaning, metadata, chunking, and indexing
        behind_the_scenes: Understand how document structure and chunk boundaries determine retrievable evidence.
        practical: Build an incremental, idempotent ingestion pipeline with lineage and deletion.
        interview: Diagnose a RAG failure caused before the model call.
      - title: Query rewriting, filtering, reranking, context assembly, and citations
        behind_the_scenes: Separate candidate generation, ranking, evidence selection, and answer generation.
        practical: Add metadata filters and reranking, then generate verifiable citations.
        interview: Design for multi-tenant retrieval and explain precision/recall tradeoffs.
      - title: RAG evaluation, golden sets, retrieval metrics, answer metrics, and regression testing
        behind_the_scenes: Attribute failures to retrieval, context, generation, or evaluation rather than one aggregate score.
        practical: Create a representative dataset and measure recall, ranking, groundedness, correctness, and latency.
        interview: Propose an evaluation plan before tuning chunks or prompts.
      - title: Advanced retrieval, freshness, permissions, and operational failure modes
        behind_the_scenes: Study multi-hop retrieval, graph relationships, temporal validity, access filtering, and index drift.
        practical: Enforce document-level permissions and monitor freshness and ingestion failures.
        interview: Threat-model data leakage and stale knowledge in enterprise RAG.
      - title: Vector database data model, embeddings, dimensions, distance metrics, metadata, filtering, upserts, deletes, and query execution
        behind_the_scenes: Trace a record from embedding validation and durable storage through metadata filter planning, exact or approximate candidate search, distance calculation, top-k selection, payload fetch, and consistency-visible updates or deletes.
        practical: Store a labeled dataset, compare cosine distance, dot product, and Euclidean distance, combine vector search with tenant filters, then verify upsert and delete behavior against an exact-search baseline.
        interview: Explain what a vector database stores, how a similarity query executes, why metric and embedding model must agree, and where filtering changes recall and latency.
      - title: Vector index internals, exact search, HNSW graphs, IVF lists, product quantization, recall, memory, and build cost
        behind_the_scenes: Derive brute-force search, HNSW layered graph traversal, IVF centroid assignment and probing, and product-quantized distance estimates while tracking construction work, memory, query latency, and lost recall.
        practical: Implement exact top-k on a tiny dataset, inspect HNSW and IVF parameters on the same labeled queries, plot recall versus latency, and explain every missed neighbor from the candidate path.
        interview: Compare exact, HNSW, IVF, and product quantization and choose index and tuning parameters from scale, update rate, memory, latency, and recall requirements.
      - title: Vector database storage internals, segments, write-ahead logs, tombstones, compaction, filtering plans, sharding, replication, and recovery
        behind_the_scenes: Follow writes through a durability log and mutable state into immutable segments, vector and payload indexes, tombstones, background merge, shard routing, replica acknowledgment, snapshot, and crash recovery.
        practical: Generate insert-update-delete churn, inspect segments and filter selectivity, force maintenance, compare recall and tail latency before and after compaction, then restore a snapshot and verify tenant isolation.
        interview: Design a multi-tenant vector service and explain durability, delete visibility, compaction amplification, prefilter versus postfilter behavior, shard keys, replication consistency, and recovery evidence.
      - title: Portfolio Project 2 — evaluated knowledge product
        behind_the_scenes: Expose ingestion, retrieval, ranking, generation, evaluation, and authorization decisions.
        practical: Ship a full-stack RAG application with citations, evaluation reports, and operational metrics.
        interview: Demonstrate measured improvement from a documented baseline.

  - id: agents
    title: Agents and Durable AI Workflows
    tier: deep
    goal: Decide when agentic behavior is justified and build bounded, inspectable workflows.
    topics:
      - title: LLM system blueprint, workflows versus agents, ReAct, state machines, planners, and control loops
        behind_the_scenes: Trace an LLM system from input and context assembly through model decisions, validated and authorized tool execution, observations, state and memory updates, stopping conditions, output, evaluation, and telemetry; separate deterministic orchestration from model-selected ReAct loops.
        practical: Implement the same task as a fixed workflow and a bounded ReAct agent, then compare reliability, cost, failure handling, and trace evidence.
        interview: Draw a production LLM system blueprint and explain when a ReAct agent is unnecessary or unsafe.
      - title: Tool design, descriptions, schemas, state, memory, and context management
        behind_the_scenes: Understand how tool surfaces and state representation constrain model decisions.
        practical: Build small, composable tools and explicit short- and long-term memory policies.
        interview: Distinguish conversation history, working state, retrieval, and durable memory.
      - title: LangChain v1 agents, models, messages, tools, middleware, structured output, streaming, and tracing
        behind_the_scenes: Trace how create_agent compiles a model-and-tool loop onto the LangGraph runtime, carries message state, applies middleware, validates structured output, streams step updates, and emits traces.
        practical: Build a typed LangChain agent with one narrow tool, structured output, streamed updates, error handling, and an inspectable trace.
        interview: Explain what LangChain adds, what LangGraph runs underneath, and when direct provider APIs or ordinary application code are simpler.
      - title: LangGraph StateGraph, Pydantic state schemas, nodes, edges, reducers, checkpoints, interrupts, and durable execution
        behind_the_scenes: Follow validated Pydantic input state through a node, reducer, conditional edge, checkpoint, interrupt, and later resume under the same thread identity, including where graph updates are not recursively revalidated.
        practical: Build a Pydantic-backed approval workflow that rejects invalid input, pauses, persists state, resumes after process interruption, and prevents duplicate side effects.
        interview: Explain Pydantic versus TypedDict state, validation limits, routing, checkpoint ownership, interrupt replay rules, and the production difference between in-memory and durable persistence.
      - title: Model Context Protocol architecture, hosts, clients, servers, JSON-RPC, initialization, capabilities, tools, resources, prompts, and lifecycle
        behind_the_scenes: Follow one host-created client connection through protocol version and capability negotiation, JSON-RPC requests, responses and notifications, server discovery primitives, tool execution, resource reading, prompt retrieval, cancellation, and orderly shutdown.
        practical: Build a local MCP server and host client over standard input and output, expose one tool, resource, and prompt, inspect every JSON-RPC frame, and verify unsupported capability and error behavior.
        interview: Explain the responsibilities and trust boundaries of MCP hosts, clients, and servers, and distinguish protocol interoperability from model tool-selection behavior.
      - title: MCP transports, Streamable HTTP, sessions, authorization, consent, security, testing, and observability
        behind_the_scenes: Trace local standard-I/O and remote Streamable HTTP connections through origin checks, protocol headers, session identity, resumable events, OAuth-protected resource discovery, token audience, user consent, input validation, cancellation, and telemetry.
        practical: Secure a remote MCP server with scoped authorization, explicit tool approval, bounded inputs and timeouts, then test malicious origins, wrong-audience tokens, replay, disconnect, cancellation, and trace correlation.
        interview: Threat-model a remote MCP deployment and explain transport state, authorization boundaries, confused-deputy risk, user consent, safe tool execution, and production evidence.
      - title: Checkpoints, retries, idempotency, human-in-the-loop, and recovery
        behind_the_scenes: Treat long-running agents as distributed workflows exposed to duplicate execution and partial failure.
        practical: Resume a failed run safely and require approval before sensitive side effects.
        interview: Design an auditable workflow that survives process restarts.
      - title: Multi-agent patterns, coordination costs, and failure containment
        behind_the_scenes: Evaluate specialization, handoffs, shared state, conflicting goals, and error amplification.
        practical: Compare one capable agent with a small specialist graph using the same evaluation set.
        interview: Justify additional agents with measured benefit rather than novelty.
      - title: Agent evaluation, traces, budgets, security, and stopping conditions
        behind_the_scenes: Measure task success, trajectory quality, tool errors, loops, cost, and unsafe behavior.
        practical: Create adversarial scenarios, hard budgets, trace inspection, and deterministic termination guards.
        interview: Explain how to debug a successful final answer produced by a bad trajectory.

  - id: ai-quality-safety
    title: AI Evaluations, Observability, and Safety
    tier: core
    goal: Release AI behavior through evidence, monitoring, and explicit risk controls.
    topics:
      - title: Evaluation objectives, datasets, rubrics, baselines, and slices
        behind_the_scenes: Translate vague quality goals into representative cases and measurable decisions.
        practical: Build a versioned evaluation suite with pass thresholds and failure categories.
        interview: Design evaluation for a feature with subjective and objective dimensions.
      - title: Deterministic checks, model graders, human review, and judge calibration
        behind_the_scenes: Understand evaluator bias, variance, leakage, position effects, and disagreement.
        practical: Calibrate automated graders against blinded human labels and investigate disagreement.
        interview: Explain why an LLM judge is not ground truth.
      - title: LLM benchmarking, representative datasets, baselines, repetitions, quality metrics, latency, cost, and statistical uncertainty
        behind_the_scenes: Run candidate systems on the same versioned cases, repeat non-deterministic trials, record quality and operational measures, calculate uncertainty, and compare them with a declared baseline.
        practical: Build a reproducible benchmark harness that compares two model configurations by slice, quality, latency, token cost, variance, and regressions.
        interview: Explain why leaderboard scores and one-off demos do not predict product quality, then design a fair application benchmark.
      - title: Prompt injection, data exfiltration, tool abuse, and untrusted content
        behind_the_scenes: Treat retrieved and user-provided text as data that can attempt to redirect control.
        practical: Red-team an AI workflow and enforce permissions outside the model.
        interview: Design layered defenses and state their limitations.
      - title: AI traces, quality monitoring, drift, feedback, and incident response
        behind_the_scenes: Connect prompts, retrieval, model calls, tools, latency, cost, user outcomes, and privacy.
        practical: Build trace views, sampled review, alerts, and a model-behavior incident runbook.
        interview: Diagnose a quality regression after a model or prompt change.
      - title: Privacy, fairness, compliance, model risk, and product boundaries
        behind_the_scenes: Identify sensitive data flows, affected users, misuse, retention, and accountability.
        practical: Produce a risk register and apply minimization, consent, access, and escalation controls.
        interview: Make a responsible ship/no-ship recommendation with explicit evidence.

  - id: portfolio-capstone
    title: Production Capstone
    tier: core
    goal: Produce internationally legible evidence of senior engineering judgment across the whole stack.
    topics:
      - title: Product discovery, users, success metrics, constraints, and architecture
        behind_the_scenes: Tie technology choices to a real problem, measurable outcome, and bounded risk.
        practical: Write a concise product brief, architecture diagram, threat model, and delivery plan.
        interview: Explain why this product should exist and why the architecture fits it.
      - title: End-to-end implementation across React, Node.js or FastAPI, data, and AI
        behind_the_scenes: Make contracts, ownership, state transitions, failure modes, and trust boundaries explicit.
        practical: Ship vertical slices with typed interfaces, reviewable commits, and ADRs.
        interview: Navigate the codebase and explain critical paths without hand-waving.
      - title: Quality, security, evaluation, observability, deployment, and operations
        behind_the_scenes: Treat production readiness as demonstrated behavior rather than a checklist claim.
        practical: Add automated tests, AI evals, load evidence, security controls, dashboards, and runbooks.
        interview: Show a failure discovered, measured, fixed, and prevented from recurring.
      - title: Portfolio narrative, demo, case study, and architecture defense
        behind_the_scenes: Convert implementation evidence into a concise signal a remote interviewer can assess quickly.
        practical: Publish a live demo, short video, README, architecture case study, and known-tradeoffs section.
        interview: Deliver five-, fifteen-, and forty-five-minute versions of the project story.

  - id: international-interviews
    title: International Interviews and Relocation Readiness Complete Module
    tier: core
    goal: Convert engineering depth into discoverable evidence, disciplined applications, strong interview performance, and accurate cross-border hiring decisions.
    topics:
      - title: Role targeting, job-description analysis, skill signals, gap mapping, and evidence selection
        behind_the_scenes: Translate product, platform, frontend, backend, AI, seniority, location, and sponsorship language into recurring responsibilities and proof requirements rather than treating every posting as unique.
        practical: Analyze thirty target descriptions, cluster their requirements, score fit honestly, and connect each claimed skill to one inspectable artifact or story.
        interview: State a coherent target-role narrative and explain how existing evidence addresses the employer's highest-value problems.
      - title: Resume architecture, ATS parsing, achievement bullets, keywords, credibility, and tailoring
        behind_the_scenes: Design for both machine extraction and fast human scanning while preserving plain structure, chronological truth, measurable scope, personal ownership, and role-specific vocabulary.
        practical: Produce one master evidence inventory and two truthful one-page resume variants with outcome-based bullets and an automated text-extraction check.
        interview: Defend every resume claim with context, decisions, evidence, tradeoffs, and the exact part personally owned.
      - title: LinkedIn profile, headline, About, experience, skills, Open to Work, and discoverability
        behind_the_scenes: Align the profile's role vocabulary, locations, evidence, and preferences with recruiter search while keeping the public narrative specific, consistent, and privacy-aware.
        practical: Rewrite the headline, About, experience, skills, featured work, custom URL, contact path, location preferences, and Open to Work visibility using current LinkedIn controls.
        interview: Convert a recruiter profile view into a concise conversation about fit, impact, availability, and international intent.
      - title: GitHub profile, pinned repositories, portfolio evidence, READMEs, demos, and engineering credibility
        behind_the_scenes: Optimize the first five minutes of repository review around runnable proof, architecture, tests, security, observability, tradeoffs, contribution history, and honest limitations.
        practical: Curate a profile README and pin three evidence-rich projects with live demos, setup, diagrams, decisions, test results, metrics, and known gaps.
        interview: Navigate a repository live and use committed evidence to answer design, debugging, quality, and ownership questions.
      - title: Job portals, company career pages, search queries, filters, alerts, sourcing channels, and fraud checks
        behind_the_scenes: Treat sourcing as a coverage system across direct employer sites, reputable portals, specialist communities, referrals, and recruiter outreach while deduplicating roles and verifying the employer.
        practical: Build a query and alert matrix by role, location, seniority, remote model, and sponsorship signal and verify every application against the employer's official domain.
        interview: Explain why the role fits without pretending that a portal recommendation or keyword match proves eligibility.
      - title: Application tracking, prioritization, personalized outreach, follow-ups, analytics, and safe automation
        behind_the_scenes: Automate owned data and reminders rather than platform access: ingest permitted alerts or manual exports, normalize records, score priorities, schedule human-reviewed actions, and preserve truthful personalization.
        practical: Build a local application tracker with deduplication, stage history, deadlines, contact consent, templates, conversion metrics, and reminders without scraping or auto-submitting.
        interview: Describe a disciplined search process that improves learning and response quality rather than maximizing low-quality application volume.
      - title: Recruiter screens, career narrative, introduction, motivation, scope, compensation, and availability
        behind_the_scenes: Compress a complex career into a role-relevant through-line while answering logistics directly and separating current facts, preferences, negotiable ranges, and questions for the recruiter.
        practical: Record thirty-, ninety-, and three-hundred-second introductions and rehearse motivation, transition, compensation, notice period, location, remote, and scheduling answers.
        interview: Give a concise truthful screen that establishes fit and invites the right next question without oversharing or evasion.
      - title: Coding interview method, clarification, examples, invariants, brute force, optimization, complexity, and tests
        behind_the_scenes: Turn ambiguity into a precise contract, maintain an invariant through implementation, expose tradeoffs aloud, and use tests to catch reasoning errors before the interviewer must.
        practical: Run timed problems using one repeatable loop from clarification through working code, edge tests, complexity, and a measured improvement note.
        interview: Collaborate visibly under pressure and recover from mistakes without silently abandoning the reasoning trail.
      - title: JavaScript and Python coding interviews, language fluency, debugging, standard libraries, and execution
        behind_the_scenes: Separate algorithm reasoning from language mechanics while using familiar collections, iteration, sorting, heaps, queues, recursion limits, async boundaries, and debugging tools accurately.
        practical: Solve and debug equivalent problems in JavaScript and Python, record language-specific errors, and choose one primary interview language from measured fluency.
        interview: Write readable executable code, explain runtime behavior, and verify boundary cases without relying on unavailable packages or IDE magic.
      - title: Full-stack technical interviews, JavaScript, Node.js, Python, React, FastAPI, data, cloud, and operations
        behind_the_scenes: Answer from definition to mechanism, production consequence, failure mode, diagnostic evidence, tradeoff, and a personally observed example across the stack.
        practical: Build an interleaved question bank linked to roadmap lessons and record two-minute blackboard explanations without notes.
        interview: Move beyond framework syntax by tracing control, state, resource ownership, concurrency, network, storage, and operational evidence.
      - title: System-design interviews, requirements, estimates, APIs, data, scaling, reliability, and evolution
        behind_the_scenes: Treat the interview as collaborative constraint discovery followed by explicit invariants, critical paths, rough capacity, failure handling, observability, security, and staged evolution.
        practical: Complete timed designs for a feed, chat, file pipeline, and AI inference product with diagrams, calculations, bottlenecks, and interviewer checkpoints.
        interview: Lead a structured discussion, justify the simplest design that meets requirements, and adapt when a constraint changes.
      - title: AI engineering interviews, model behavior, RAG, agents, evaluations, safety, latency, and cost
        behind_the_scenes: Connect probabilistic model behavior to deterministic product boundaries, retrieval evidence, tool authority, evaluation datasets, failure controls, serving capacity, and business metrics.
        practical: Rehearse architecture, debugging, evaluation, prompt-injection, hallucination, latency, token-cost, and model-change questions using measured project evidence.
        interview: Distinguish product engineering judgment from model trivia and state how each AI quality claim is evaluated.
      - title: Situational interview questions, hypothetical scenarios, clarification, principles, options, tradeoffs, decisions, and model answers
        behind_the_scenes: Treat a hypothetical prompt as an incomplete decision problem, ask for missing constraints, state the principles that govern the response, compare realistic options, choose one, and name evidence or escalation that would change the choice.
        practical: Write and rehearse model answers for ambiguous ownership, production risk, disagreement, missed deadlines, quality pressure, security concerns, and customer escalation, then adapt each answer when one constraint changes.
        interview: Answer situations with concrete judgment and conditional reasoning without inventing past experience or hiding behind “it depends.”
      - title: Behavioral story bank, STAR, decisions, actions, results, metrics, and reflection
        behind_the_scenes: Index a small set of true experiences by competency while preserving the difficult context, personal decision process, specific actions, measurable outcome, and honest learning.
        practical: Write eight reusable stories, map them to common prompts, attach corroborating evidence, and rehearse one-, three-, and five-minute versions.
        interview: Answer the actual question with concrete personal evidence and reflection instead of reciting a memorized autobiography.
      - title: Leadership, ownership, conflict, failure, feedback, ambiguity, and cross-cultural collaboration
        behind_the_scenes: Demonstrate influence through listening, written clarity, decision mechanisms, respectful disagreement, escalation, accountability, repair, and adaptation across authority, culture, and time zones.
        practical: Rehearse stories involving disagreement, missed goals, incidents, feedback given and received, ambiguous ownership, asynchronous work, and inclusive collaboration.
        interview: Show judgment and growth without blaming others, erasing conflict, or converting every failure into a disguised success.
      - title: Technical storytelling, audience, context, stakes, tension, decisions, evidence, clarity, and brevity
        behind_the_scenes: Select a truthful narrative arc that gives the audience just enough context, makes the engineering tension and personal decision visible, proves the result, and changes detail level without distorting facts.
        practical: Turn one project into thirty-second, two-minute, and ten-minute stories for a recruiter, engineer, manager, and executive, then test what each listener remembers.
        interview: Tell a concise technical story with ownership, mechanism, evidence, tradeoff, and reflection instead of listing technologies chronologically.
      - title: Influence without authority, stakeholder mapping, listening, incentives, framing, credibility, coalition building, disagreement, and escalation
        behind_the_scenes: Understand each stakeholder's goals, constraints, authority, risks, and preferred evidence, then earn trust, frame a shared problem, test proposals, build support, document decisions, and escalate transparently when impact requires it.
        practical: Prepare and role-play an architecture change with skeptical product, security, operations, and leadership stakeholders and revise the proposal from their evidence.
        interview: Demonstrate influence through listening, useful evidence, alternatives, and durable agreement rather than title, pressure, or political theater.
      - title: Ethical persuasion, transparency, consent, autonomy, incentives, nudges, dark patterns, coercion, deception, and manipulation boundaries
        behind_the_scenes: Distinguish honest persuasion that helps someone make an informed voluntary choice from interfaces or communication that hide information, exploit vulnerability, obstruct refusal, manufacture urgency, or punish dissent.
        practical: Review product prompts, stakeholder messages, and negotiation scripts for asymmetric information and pressure, replace dark patterns with clear choices, and document the user's or colleague's ability to decline.
        interview: Explain how to persuade positively while preserving truth, consent, autonomy, privacy, and a safe path to disagree.
      - title: Portfolio presentations, project walkthroughs, architecture diagrams, demos, tradeoffs, and live questions
        behind_the_scenes: Structure a project story around user need, constraints, personal ownership, critical architecture, one deep mechanism, evidence, failure, and the next improvement while keeping the demo recoverable.
        practical: Prepare five-, fifteen-, and forty-five-minute presentations with a recorded backup, seeded data, failure demo, architecture map, metrics, and question branches.
        interview: Navigate from product outcome to implementation depth and change altitude when an interviewer follows one technical thread.
      - title: Networking, open source, referrals, communities, outreach, and international communication
        behind_the_scenes: Build trust through useful repeated contributions and context-rich conversations rather than transactional requests, broadcast spam, or manufactured engagement.
        practical: Contribute one reviewable fix or document, ask maintainers scoped questions, reconnect with real contacts, and send personalized referral or informational requests with an easy decline.
        interview: Provide evidence of asynchronous collaboration, code review, written decisions, time-zone handoffs, and respectful communication across cultures.
      - title: Salary negotiation, market evidence, total compensation, ranges, anchors, BATNA, priorities, scripts, counteroffers, and written terms
        behind_the_scenes: Separate role value and market evidence from personal need, compare base, variable pay, equity, benefits, tax assumptions, relocation, risk, and growth, then exchange justified proposals while protecting alternatives and relationships.
        practical: Build a total-compensation comparison, define target and walk-away priorities, rehearse recruiter and written counteroffer scripts, request time, and verify every final term in the formal offer.
        interview: Discuss compensation calmly and truthfully, avoid premature commitments, ask for the complete package, and negotiate multiple interests rather than issuing an unsupported ultimatum.
      - title: Relocation readiness, work authorization, sponsorship, official research, offer evaluation, and negotiation
        behind_the_scenes: Separate employer willingness from legal eligibility and compare written compensation, tax and benefit assumptions, location, family needs, timing, probation, relocation support, and downside risk using current official sources.
        practical: After choosing target countries, build a dated official-source checklist and a total-offer decision matrix, then prepare factual recruiter questions and a evidence-based negotiation range.
        interview: Discuss current location, authorization, sponsorship need, notice period, relocation timing, and constraints accurately without guessing law or misrepresenting status.
      - title: Mock interview loops, scorecards, recordings, error logs, feedback, spaced retrieval, and improvement cycles
        behind_the_scenes: Replace vague confidence with repeated comparable evidence across coding, technical depth, system design, behavioral communication, and recovery after mistakes.
        practical: Run a full loop, score observable behaviors, review recordings, classify root errors, schedule targeted drills, and repeat until weak signals improve.
        interview: Enter the real loop with practiced structure while remaining responsive, conversational, and willing to revise an answer.

ongoing_practice:
  weekly:
    - Two coding interview problems with written error analysis
    - One behind-the-scenes explanation recorded without notes
    - One portfolio-quality implementation or debugging task
    - One spaced retrieval review mixing older tracks
    - One technical communication artifact such as a review, ADR, diagram, or demo
  monthly:
    - One full mock interview loop
    - One portfolio release with measured evidence
    - One open-source or technical-community contribution
    - One roadmap review against current target job descriptions

