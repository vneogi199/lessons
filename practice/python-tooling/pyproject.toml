[project]
name = "lesson-python-tooling"
version = "0.1.0"
requires-python = ">=3.9"
dependencies = []

# Teaching constraints, not a resolved or security-reviewed dependency lock.
[dependency-groups]
dev = ["pytest>=8", "ruff>=0.9"]

[tool.uv]
package = false

[tool.ruff]
target-version = "py39"
line-length = 88

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.ruff.format]
quote-style = "double"

[tool.pytest.ini_options]
testpaths = ["."]
python_files = ["test_*.py"]
addopts = "--strict-markers"
