# Inactive example. Review prerequisites before copying into .github/workflows/.
name: Release isolated RFQ demo
on: workflow_dispatch
permissions:
  contents: read
concurrency:
  group: lesson-rfq-demo-release
  cancel-in-progress: false
jobs:
  release:
    if: github.ref == 'refs/heads/main'
    environment: lesson-demo
    runs-on: [self-hosted, ephemeral, lesson-release]
    timeout-minutes: 40
    env:
      APPROVED_DEMO_DEPLOYMENT: "yes"
      AWS_ACCOUNT_ID: ${{ vars.AWS_ACCOUNT_ID }}
      AWS_DEFAULT_REGION: ${{ vars.AWS_REGION }}
      RUNTIME_IMAGE: ${{ vars.RUNTIME_IMAGE }}
      ECR_REPOSITORY: lesson-rfq-demo
      ECS_CLUSTER: ${{ vars.ECS_CLUSTER }}
      ECS_SERVICE: lesson-rfq-demo
      EXECUTION_ROLE_ARN: ${{ vars.EXECUTION_ROLE_ARN }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - run: python3 practice/api-release/release.py
