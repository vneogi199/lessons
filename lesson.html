<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Focused lesson-player prototype for a Full Stack AI Engineer tutorial." />
    <title>Deepstep — Tutorial MVP</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:ital,wght@0,400;0,500;0,600;0,700;1,400&amp;display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="reading-progress" aria-hidden="true"><span id="reading-progress"></span></div>
    <aside class="sidebar">
      <div class="sidebar-head">
        <a class="brand" href="./"><span>&gt;_</span> deepstep</a>
        <span class="build-tag">local://v0.5</span>
      </div>
      <div class="course-progress">
        <div><span>Curriculum progress</span><strong id="overall-percent">0%</strong></div>
        <div class="progress-bar"><span id="overall-bar"></span></div>
        <small id="overall-count">Loading generated lessons...</small>
      </div>
      <div class="catalog-tools">
        <label for="catalog-search">// SEARCH_CURRICULUM</label>
        <div class="search-field"><span>⌕</span><input id="catalog-search" type="search" placeholder="javascript, RAG, security..." autocomplete="off" /></div>
        <small id="catalog-count">Loading tracks...</small>
      </div>
      <nav id="lesson-nav" aria-label="Course lessons"></nav>
      <div class="sidebar-footer">
        <span><i></i> progress saved locally</span><a href="index.html">dashboard()</a>
        <div class="progress-actions">
          <button id="export-progress" type="button">export()</button>
          <button id="import-progress" type="button">import()</button>
          <button id="reset-progress" type="button">reset()</button>
        </div>
        <input id="progress-file" type="file" accept="application/json,.json" hidden />
        <p id="progress-feedback" role="status" aria-live="polite"></p>
      </div>
    </aside>

    <main>
      <header class="lesson-topbar">
        <div class="topbar-context">
          <span id="breadcrumb">react / lesson_01</span>
          <span class="lesson-status" id="lesson-status" role="status" aria-live="polite">in_progress</span>
          <button class="lesson-status-action" id="mark-incomplete" type="button" aria-label="Mark this lesson incomplete" aria-keyshortcuts="Alt+U" title="Mark this lesson incomplete (Alt + U)" hidden>mark_incomplete()</button>
        </div>
        <div class="top-actions">
          <span class="lesson-time" id="lesson-time">~8 min</span>
          <div class="step-buttons" aria-label="Lesson navigation">
            <button id="previous-lesson" type="button" aria-label="Previous lesson" title="Previous lesson (Alt + Left Arrow)">←</button>
            <button id="next-lesson" type="button" aria-label="Next lesson" title="Next lesson (Alt + Right Arrow)">→</button>
          </div>
          <button id="resume-next" type="button">resume_next() <span>↵</span></button>
        </div>
      </header>
      <article id="lesson-view" tabindex="-1"><p class="loading-state">loading generated curriculum<span>...</span></p></article>
    </main>

    <script src="base.js"></script>
    <script src="app.js"></script>
  </body>
</html>
